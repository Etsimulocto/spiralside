document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showSprite }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:12px;background:#0b0e1a;border:1px solid #5b2a7d;box-shadow:0 0 34px rgba(216,92,255,0.13)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px\">\n              <span style=\"font-size:9px;color:#d85cff;letter-spacing:1px\">{{ spriteName }}<\u002Fspan>\n              <span style=\"font-size:9px;color:#5b6079\">16 × 16<\u002Fspan>\n            <\u002Fdiv>\n            <div>{{ spriteGrid }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showRun }}\" hint-placeholder-val=\"{{ true }}\">\n          <div ref=\"{{ playStageRef }}\" style=\"{{ playStageStyle }}\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;flex-wrap:wrap\">\n              <div style=\"display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid #ff75bd;border-radius:3px;background:rgba(255,117,189,0.1);font-family:'Silkscreen',monospace;font-size:10px;color:#ff75bd;animation:bmblink 1.2s infinite\">▶ PLAYING<\u002Fdiv>\n              <div style=\"padding:5px 12px;border:1px solid #3a2033;border-radius:3px;background:rgba(255,111,145,0.08);font-family:'Silkscreen',monospace;font-size:13px;letter-spacing:2px;color:#ff6f91\" ref=\"{{ hpRef }}\">♥♥♥<\u002Fdiv>\n              <div style=\"padding:5px 12px;border:1px solid #4a3f1a;border-radius:3px;background:rgba(248,214,109,0.08);font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:1px;color:#f8d66d\" ref=\"{{ scoreRef }}\">◉ 0 / 0<\u002Fdiv>\n              <div style=\"padding:5px 12px;border:1px solid #4a3f1a;border-radius:3px;background:rgba(255,224,122,0.08);font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:1px;color:#ffe07a\" ref=\"{{ keyRef }}\">⚷ 0<\u002Fdiv>\n              <button onclick=\"{{ toggleFullscreen -for>\n                            <\u002Fselect>\n                            <input value=\"{{ c.val }}\" onchange=\"{{ c.onVal }}\" style=\"width:56px;flex:0 0 auto;padding:6px 7px;border:1px solid #2b3150;border-radius:3px;background:#151a30;color:#e7e2f5;font-size:10px;font-family:inherit\">\n                            <button onclick=\"{{ c.onRemove }}\" style=\"width:24px;flex:0 0 auto;padding:6px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#8f93af;font-size:10px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#ff6f91;color:#ff6f91\">✕<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n\n                      <div style=\"padding:11px 12px;border:1px solid #4a3f1a;border-radius:6px;background:rgba(248,214,109,0.05)\">\n                        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">\n                          <span style=\"font-size:8px;letter-spacing:2px;color:#f8d66d\">THEN ▸ DO THIS<\u002Fspan>\n                          <button onclick=\"{{ addAct }}\" style=\"padding:4px 9px;border:1px solid #4a3f1a;border-radius:3px;background:rgba(248,214,109,0.1);color:#f8d66d;font-size:8px;letter-spacing:1px;cursor:pointer;font-family:inherit\">+ ACTION<\u002Fbutton>\n                        <\u002Fdiv>\n                        <sc-for list=\"{{ actRows }}\" as=\"a\" hint-placeholder-count=\"1\">\n                          <div style=\"display:flex;gap:5px;align-items:center;margin-bottom:6px\">\n                            <select value=\"{{ a.doVal }}\" onchange=\"{{ a.onDo }}\" style=\"flex:1;min-width:0;padding:6px 5px;border:1px solid #2b3150;border-radius:3px;background:#151a30;color:#e7e2f5;font-size:10px;font-family:inherit;cursor:pointer\">\n                              <sc-for list=\"{{ actOptions }}\" as=\"o\" hint-placeholder-count=\"11\"><option value=\"{{ o.value }}\" style=\"bac                    <button onclick=\"{{ a.onRemove }}\" style=\"width:24px;flex:0 0 auto;padding:6px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#8f93af;font-size:10px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#ff6f91;color:#ff6f91\">✕<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <div style=\"margin-top:14px;padding:12px;border:1px solid #5b2a7d;border-radius:6px;background:rgba(216,92,255,0.05)\">\n                    <div style=\"font-size:8px;letter-spacing:2px;color:#d85cff;margin-bottom:9px\">✦ AI RULE BUILDER<\u002Fdiv>\n                    <input value=\"{{ aiPromptVal }}\" onchange=\"{{ onAiPrompt }}\" placeholder=\"Describe a rule, e.g. lose a heart every 5 seconds\" style=\"width:100%;padding:8px 10px;border:1px solid #2b3150;border-radius:4px;background:#151a30;color:#f2eefb;font-size:11px;font-family:inherit;margin-bottom:8px\">\n                    <button onclick=\"{{ aiGenerate }}\" disabled=\"{{ aiBusy }}\" style=\"width:100%;padding:9px;border:1px solid #d85cff;border-radius:4px;background:rgba(216,92,255,0.12);color:#e7c4ff;font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:1px;cursor:pointer\">{{ aiBusyLabel }}<\u002Fbutton>\n                    <sc-if value=\"{{ hasAiNote }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:9px;font-size:9px;color:#c9a6f0;line-height:1.5\">{{ aiNote }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ isCodeView }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:8px\">RULES · JSON · EDIT &amp; APPLY<\u002Fdiv>\n                  <textarea value=\"{{ logicDraftVal }}\" onchange=\"{{ onLogicDraft }}\" spellcheck=\"false\" style=\"width:100%;height:300px;padding:11px;border:1px solid #2b3150;border-radius:5px;background:#0e1120;color:#9fe3c0;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;resize:vertical\"><\u002Ftextarea>\n                  <div style=\"display:flex;gap:7px;margin-top:9px\">\n                    <button onclick=\"{{ applyLogicDraft }}\" style=\"flex:1;padding:9px;border:1px solid #59e391;border-radius:4px;background:rgba(89,227,145,0.12);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">APPLY CODE<\u002Fbutton>\n                    <button onclick=\"{{ copyLogic }}\" style=\"flex:1;padding:9px;border:1px solid #78a9ff;border-radius:4px;background:#20243b;color:#78a9ff;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">COPY SCHEMA + RULES<\u002Fbutton>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ hasAiNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:9px;font-size:9px;color:#c9a6f0;line-height:1.5\">{{ aiNote }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"margin-top:9px;font-size:8px;color:#5b6079;line-height:1.5\">Paste the copied schema into any AI chat to generate rules, then paste the JSON array back here and APPLY.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showDialogue }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width:540px;max-width:100%\">\n            <div style=\"font-size:8px;letter-spacing:2px;color:#7a7f9c;margin-bottom:12px;text-align:center\">DIALOGUE PREVIEW · AS SEEN IN PLAY MODE<\u002Fdiv>\n            <div style=\"position:relative;padding:40px 30px;background:#0b0e1a;border:1px solid #2f4d7a;box-shadow:0 0 30px rgba(120,169,255,0.1);display:flex;flex-direction:column;align-items:center;gap:22px\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n                <div style=\"filter:drop-shadow(0 0 5px rgba(120,169,255,0.5))\">{{ dlgSignPreview }}<\u002Fdiv>\n                <div style=\"font-size:8px;letter-spacing:1px;color:#5b6079\">SIGN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:100%;max-width:440px;background:linear-gradient(#141a30,#0e1324);border:2px solid {{ dlgSpeakerColor }};border-radius:8px;box-shadow:0 6px 26px rgba(0,0,0,0.5)\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,0.08)\">\n                  <span style=\"width:10px;height:10px;border-radius:2px;background:{{ dlgSpeakerColor }};box-shadow:0 0 8px {{ dlgSpeakerColor }}\"><\u002Fspan>\n                  <span style=\"font-family:'Silkscreen',monospace;font-size:11px;color:{{ dlgSpeakerColor }}\">{{ dlgSpeaker }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:15px 15px 17px\">\n                  <sc-for list=\"{{ dlgPreviewLines }}\" as=\"pl\" hint-placeholder-count=\"2\">\n                    <div style=\"{{ pl.style }}\">{{ pl.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"margin-top:6px;text-align:right;font-family:'Silkscreen',monospace;font-size:8px;color:#5b6079\">▸ E TO CONTINUE<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width:560px;max-width:100%;max-height:100%;display:flex;flex-direction:column;background:#0b0e1a;border:1px solid #5b2a7d;box-shadow:0 0 34px rgba(216,92,255,0.12)\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;background:#151a30;border-bottom:1px solid #5b2a7d\">\n              <span style=\"font-family:'Silkscreen',monospace;font-size:10px;color:#d85cff\">STUDIO SETTINGS<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:8px;letter-spacing:1px;color:#5b6079\">BLOOM NEON<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;overflow:auto;padding:16px 18px\">\n\n              <div style=\"font-size:8px;letter-spacing:2px;color:#78a9ff;margin-bottom:8px\">DISPLAY<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">CRT scanlines<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">Retro scanline overlay across the studio<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ toggleScanlines }}\" style=\"{{ scanToggle }}\">{{ scanLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ scanlinesOn }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #191d33\">\n                  <span style=\"font-size:10px;color:#8f93af;flex:0 0 auto;min-width:60px\">Intensity<\u002Fspan>\n                  <input type=\"range\" min=\"0.1\" max=\"0.8\" step=\"0.05\" value=\"{{ scanIntensity }}\" onchange=\"{{ onScanIntensity }}\" style=\"flex:1;accent-color:#d85cff;cursor:pointer\">\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">Editor grid lines<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">Show tile borders in the Map editor<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ toggleGrid }}\" style=\"{{ gridToggle }}\">{{ gridLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">Auto fullscreen on Play<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">Expand the play area to fill the screen when RUN starts<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ toggleAutoFs }}\" style=\"{{ autoFsToggle }}\">{{ autoFsLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">Touch controls<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">On-screen D-pad &amp; buttons in fullscreen on phones/tablets<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ toggleTouch }}\" style=\"{{ touchToggle }}\">{{ touchLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"font-size:8px;letter-spacing:2px;color:#59e391;margin:20px 0 8px\">GAMEPLAY<\u002Fdiv>\n              <div style=\"padding:9px 0;border-bottom:1px solid #191d33\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px\">\n                  <div style=\"font-size:11px;color:#e7e2f5\">Difficulty preset<\u002Fdiv>\n                  <span style=\"font-size:8px;letter-spacing:1px;color:#7a7f9c\">{{ difficultyLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:7px\">\n                  <sc-for list=\"{{ diffOptions }}\" as=\"d\" hint-placeholder-count=\"3\">\n                    <button onclick=\"{{ d.onClick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:8px;color:#5b6079;margin-top:9px;line-height:1.5\">Sets player hearts and scales every enemy's speed &amp; health. Build &amp; tune enemies in the Actor tool.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">Play starts in<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">Room the RUN button drops you into<\u002Fdiv><\u002Fdiv>\n                <select value=\"{{ startRoomVal }}\" onchange=\"{{ onStartRoom }}\" style=\"width:150px;padding:7px 8px;border:1px solid #2b3150;border-radius:4px;background:#151a30;color:#e7e2f5;font-size:10px;font-family:inherit;cursor:pointer\">\n                  <sc-for list=\"{{ startRoomChoices }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\" style=\"background:#151a30\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fselect>\n              <\u002Fdiv>\n\n              <div style=\"font-size:8px;letter-spacing:2px;color:#f8d66d;margin:20px 0 8px\">AUDIO<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">Sound effects<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">Chiptune blips for coins, hits, attacks &amp; wins<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ toggleSound }}\" style=\"{{ soundToggle }}\">{{ soundLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ soundOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #191d33\">\n                  <span style=\"font-size:10px;color:#8f93af;flex:0 0 auto;min-width:60px\">Volume<\u002Fspan>\n                  <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ volumePct }}\" onchange=\"{{ onVolume }}\" style=\"flex:1;accent-color:#f8d66d;cursor:pointer\">\n                  <span style=\"font-size:9px;color:#7a7f9c;flex:0 0 auto;min-width:34px;text-align:right\">{{ volumePct }}%<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;align-items:center;gap:10px;margin:22px 0 10px\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#ff9dcf\">KEY BINDINGS<\u002Fdiv>\n                <div style=\"display:flex;gap:5px;margin-left:auto\">\n                  <sc-for list=\"{{ bindDevices }}\" as=\"dv\" hint-placeholder-count=\"3\">\n                    <button onclick=\"{{ dv.onClick }}\" style=\"{{ dv.style }}\">{{ dv.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:8px;color:#5b6079;margin-bottom:10px;line-height:1.5\">{{ bindDeviceDesc }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <sc-for list=\"{{ bindRows }}\" as=\"b\" hint-placeholder-count=\"7\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #191d33\">\n                    <div style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n                      <span style=\"font-size:11px;flex:0 0 auto\">{{ b.icon }}<\u002Fspan>\n                      <div style=\"min-width:0\"><div style=\"font-size:11px;color:#e7e2f5\">{{ b.action }}<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:2px\">{{ b.hint }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:5px;flex:0 0 auto;align-items:center\">\n                      <sc-for list=\"{{ b.keys }}\" as=\"k\" hint-placeholder-count=\"1\">\n                        <kbd style=\"{{ k.style }}\">{{ k.label }}<\u002Fkbd>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"font-size:8px;letter-spacing:2px;color:#d85cff;margin:22px 0 8px\">SAVE &amp; DATA<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #191d33\">\n                <div><div style=\"font-size:11px;color:#e7e2f5\">Autosave<\u002Fdiv><div style=\"font-size:8px;color:#5b6079;margin-top:3px\">Persist edits to this browser automatically<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ toggleAutosave }}\" style=\"{{ autosaveToggle }}\">{{ autosaveLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:14px\">\n                <button onclick=\"{{ saveNow }}\" style=\"flex:1;padding:9px;border:1px solid #59e391;border-radius:4px;background:rgba(89,227,145,0.12);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">SAVE NOW<\u002Fbutton>\n                <button onclick=\"{{ resetSettings }}\" style=\"flex:1;padding:9px;border:1px solid #ff6f91;border-radius:4px;background:#20243b;color:#ff6f91;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">RESET SETTINGS<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showProps }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width:440px;max-width:100%;background:#0e1120;border:1px solid #5b2a7d;box-shadow:0 0 34px rgba(216,92,255,0.1)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#151a30;border-bottom:1px solid #5b2a7d\">\n              <span style=\"font-family:'Silkscreen',monospace;font-size:10px;color:#d85cff\">{{ activeTool }}<\u002Fspan>\n              <span style=\"font-size:8px;color:#5b6079;letter-spacing:1px\">VISOR<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:16px 15px\">\n              <div style=\"font-size:11px;color:#b6b0ca;margin-bottom:16px\">{{ toolDesc }}<\u002Fdiv>\n              <sc-for list=\"{{ propRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #191d33;font-size:11px\">\n                  <span style=\"color:#5b6079\">{{ row.k }}<\u002Fspan>\n                  <span style=\"color:#e7e2f5\">{{ row.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ showRunPrompt }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onclick=\"{{ toggleRun }}\" style=\"margin-top:16px;width:100%;padding:10px;border:1px solid #59e391;border-radius:3px;background:rgba(89,227,145,0.1);color:#59e391;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:1px;cursor:pointer\">▶ START PLAY MODE<\u002Fbutton>\n              <\u002Fsc-if>\n              <div style=\"margin-top:16px;font-size:8px;letter-spacing:2px;color:#3f4460\">MODULE · COMING · ONLINE<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ paused }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:30px 0 0 0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(9,11,23,0.82)\">\n          <div style=\"width:300px;background:#0e1120;border:1px solid #d85cff;box-shadow:0 0 44px rgba(216,92,255,0.28)\">\n            <div style=\"padding:12px 15px;background:#151a30;border-bottom:1px solid #5b2a7d;font-family:'Silkscreen',monospace;font-size:12px;color:#d85cff;text-align:center;letter-spacing:3px\">PAUSED<\u002Fdiv>\n            <div style=\"padding:15px\">\n              <sc-for list=\"{{ menuItems }}\" as=\"mi\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ mi.onClick }}\" style=\"{{ mi.style }}\">{{ mi.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"margin-top:12px;font-size:8px;letter-spacing:1px;color:#5b6079;text-align:center;line-height:1.6\">E / Y · RESUME&nbsp;&nbsp;·&nbsp;&nbsp;↑↓ · SELECT&nbsp;&nbsp;·&nbsp;&nbsp;ENTER / A · OK<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dialogueOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:32;display:flex;justify-content:center;padding:0 24px 26px\" onclick=\"{{ advanceDialogue }}\">\n          <div style=\"width:100%;max-width:560px;background:linear-gradient(#141a30,#0e1324);border:2px solid {{ dlgBoxColor }};border-radius:9px;box-shadow:0 10px 40px rgba(0,0,0,0.6);cursor:pointer\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:9px 15px;border-bottom:1px solid rgba(255,255,255,0.08)\">\n              <span style=\"width:11px;height:11px;border-radius:2px;background:{{ dlgBoxColor }};box-shadow:0 0 9px {{ dlgBoxColor }}\"><\u002Fspan>\n              <span style=\"font-family:'Silkscreen',monospace;font-size:12px;color:{{ dlgBoxColor }}\">{{ dlgBoxSpeaker }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:9px;letter-spacing:1px;color:#5b6079\">{{ dlgBoxCounter }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:17px 17px 15px\">\n              <div style=\"font-size:15px;line-height:1.6;color:#f2eefb;min-height:44px\">{{ dlgBoxLine }}<\u002Fdiv>\n              <div style=\"margin-top:12px;text-align:right;font-family:'Silkscreen',monospace;font-size:9px;color:#8f93af\">{{ dlgBoxHint }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ projectOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"{{ projectStyle }}\">\n          <div onmousedown=\"{{ startDrag }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#151a30;border-bottom:1px solid #5b2a7d;cursor:grab;user-select:none\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:9px;height:9px;background:#d85cff;box-shadow:0 0 8px #d85cff;border-radius:1px\"><\u002Fspan>\n              <span style=\"font-family:'Silkscreen',monospace;font-size:10px;color:#f7f3ff\">PROJECT CARD<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span onclick=\"{{ recenterProject }}\" title=\"Recenter window\" style=\"font-size:12px;color:#78a9ff;cursor:pointer;padding:0 2px\">⊹<\u002Fspan>\n              <span onclick=\"{{ closeProject }}\" style=\"font-size:11px;color:#ff6f91;cursor:pointer;padding:0 4px\">✕<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:12px\">\n            <div style=\"font-size:8px;color:#f8d66d;letter-spacing:1px;margin-bottom:10px\">STEP 01 · CLICK ANY FIELD TO EDIT<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px\">\n              <sc-for list=\"{{ projectFields }}\" as=\"f\" hint-placeholder-count=\"10\">\n                <div onclick=\"{{ f.onClick }}\" style=\"padding:7px 9px;background:#20243b;border:1px solid #2b3150;border-radius:3px;cursor:text\" style-hover=\"border-color:#d85cff\">\n                  <div style=\"font-size:7px;letter-spacing:1px;color:#7a7f9c;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n                  <div style=\"font-size:10px;color:#f7f3ff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ f.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:7px;margin-top:11px\">\n              <button onclick=\"{{ saveProject }}\" style=\"flex:1;padding:8px;border:1px solid #59e391;border-radius:3px;background:rgba(89,227,145,0.12);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">SAVE<\u002Fbutton>\n              <button onclick=\"{{ resetProject }}\" style=\"flex:1;padding:8px;border:1px solid #ff6f91;border-radius:3px;background:#20243b;color:#ff6f91;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">RESET<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:8px;color:#59e391\">{{ projectMessage }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"width:252px;flex:0 0 252px;background:#0d1019;border-left:1px solid #1b1f36;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"padding:13px 15px 12px;border-bottom:1px solid #1b1f36\">\n        <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079\">INSPECTOR<\u002Fdiv>\n        <div style=\"font-family:'Silkscreen',monospace;font-size:13px;color:#d85cff;margin-top:7px\">{{ activeTool }}<\u002Fdiv>\n        <div style=\"font-size:10px;color:#7a7f9c;margin-top:5px\">{{ toolDesc }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow:auto;padding:14px 15px\">\n\n        <sc-if value=\"{{ showMap }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">ROOM<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:8px\">\n              <button onclick=\"{{ prevRoom }}\" style=\"width:30px;padding:7px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:11px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#d85cff;color:#d85cff\">◀<\u002Fbutton>\n              <div style=\"flex:1;text-align:center;padding:7px;border:1px solid #5b2a7d;border-radius:3px;background:#151a30;font-size:10px;color:#e7e2f5\">{{ roomLabel }}<\u002Fdiv>\n              <button onclick=\"{{ nextRoom }}\" style=\"width:30px;padding:7px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:11px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#d85cff;color:#d85cff\">▶<\u002Fbutton>\n            <\u002Fdiv>\n            <button onclick=\"{{ addRoom }}\" style=\"width:100%;padding:8px;margin-bottom:16px;border:1px solid #59e391;border-radius:3px;background:rgba(89,227,145,0.1);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">+ ADD ROOM<\u002Fbutton>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">MAP SIZE<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px\">\n              <sc-for list=\"{{ sizeOptions }}\" as=\"so\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ so.onClick }}\" style=\"{{ so.style }}\">{{ so.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">TILE PALETTE<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:7px\">\n              <sc-for list=\"{{ tileSwatches }}\" as=\"sw\" hint-placeholder-count=\"7\">\n                <button onclick=\"{{ sw.onClick }}\" title=\"{{ sw.name }}\" style=\"{{ sw.style }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;margin-top:12px;font-size:10px\">\n              <span style=\"color:#5b6079\">BRUSH<\u002Fspan><span style=\"color:#e7e2f5\">{{ selectedTileName }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:7px;margin-top:14px\">\n              <button onclick=\"{{ fillMap }}\" style=\"flex:1;padding:8px;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:9px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#78a9ff;color:#78a9ff\">FILL ALL<\u002Fbutton>\n              <button onclick=\"{{ clearMap }}\" style=\"flex:1;padding:8px;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:9px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#ff6f91;color:#ff6f91\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin:18px 0 9px\">ENTITIES · PLACE ON MAP<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:6px\">\n              <sc-for list=\"{{ entityBrushes }}\" as=\"eb\" hint-placeholder-count=\"7\">\n                <button onclick=\"{{ eb.onClick }}\" style=\"{{ eb.style }}\">{{ eb.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;margin-top:11px;font-size:10px\">\n              <span style=\"color:#5b6079\">PLACED<\u002Fspan><span style=\"color:#e7e2f5\">{{ entityCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:9px;color:#7a7f9c;line-height:1.5\">Coins &amp; keys are pickups · Slimes chase you · Chests &amp; locked Doors need a key · Sprite stamps any sprite as decoration. Walk through an unlocked Door to travel to the next room.<\u002Fdiv>\n            <sc-if value=\"{{ showDoorTarget }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;padding:11px;border:1px solid #5b2a7d;border-radius:4px;background:rgba(154,107,208,0.06)\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#9a6bd0;margin-bottom:9px\">NEW DOOR LEADS TO<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ doorTargetOptions }}\" as=\"dt\" hint-placeholder-count=\"4\">\n                    <button onclick=\"{{ dt.onClick }}\" style=\"{{ dt.style }}\">{{ dt.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:9px;font-size:8px;color:#7a7f9c;line-height:1.5\">Applies to doors you place next. Existing doors keep their own target.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showSignPicker }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;padding:11px;border:1px solid #2f4d7a;border-radius:4px;background:rgba(120,169,255,0.06)\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#78a9ff;margin-bottom:9px\">SIGN SHOWS DIALOGUE<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <sc-for list=\"{{ signDialogueOptions }}\" as=\"sd\" hint-placeholder-count=\"2\">\n                    <button onclick=\"{{ sd.onClick }}\" style=\"{{ sd.style }}\">{{ sd.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:9px;font-size:8px;color:#7a7f9c;line-height:1.5\">Walk up in play mode and press E to read. Write dialogue in the Dialogue tool.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStampPicker }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;padding:11px;border:1px solid #5b2a7d;border-radius:4px;background:rgba(216,92,255,0.06)\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#d85cff;margin-bottom:9px\">SPRITE TO STAMP<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px\">\n                  <sc-for list=\"{{ stampThumbs }}\" as=\"st\" hint-placeholder-count=\"4\">\n                    <button onclick=\"{{ st.onClick }}\" title=\"{{ st.name }}\" style=\"{{ st.style }}\">{{ st.thumb }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button onclick=\"{{ toggleStampSolid }}\" style=\"{{ stampSolidStyle }}\">{{ stampSolidLabel }}<\u002Fbutton>\n                <div style=\"margin-top:9px;font-size:8px;color:#7a7f9c;line-height:1.5\">Paint any sprite onto map cells as decoration. Make a sprite in the Sprite tool first.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showEnemyPicker }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;padding:11px;border:1px solid #23492e;border-radius:4px;background:rgba(89,227,145,0.06)\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#59e391;margin-bottom:9px\">ENEMY TO PLACE<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <sc-for list=\"{{ enemyPickList }}\" as=\"en\" hint-placeholder-count=\"1\">\n                    <button onclick=\"{{ en.onClick }}\" style=\"{{ en.style }}\">\n                      <span style=\"{{ en.dot }}\"><\u002Fspan>\n                      <span style=\"font-size:10px\">{{ en.name }}<\u002Fspan>\n                      <span style=\"font-size:8px;letter-spacing:0.5px;color:#5b6079;margin-left:auto\">{{ en.sub }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button onclick=\"{{ gotoEnemyBuilder }}\" style=\"margin-top:9px;width:100%;padding:7px;border:1px solid #2b3150;border-radius:4px;background:#20243b;color:#8f93af;font-size:8px;letter-spacing:1px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#59e391;color:#59e391\">✎ BUILD &amp; TUNE ENEMIES →<\u002Fbutton>\n                <div style=\"margin-top:9px;font-size:8px;color:#7a7f9c;line-height:1.5\">Pick a type, then paint it onto the map. Each argin-bottom:9px\">ASSIGN \"{{ spriteName }}\" TO<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px\">\n              <sc-for list=\"{{ assignTargets }}\" as=\"at\" hint-placeholder-count=\"7\">\n                <button onclick=\"{{ at.onClick }}\" style=\"{{ at.style }}\">{{ at.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">PEN · COLOR<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:7px\">\n              <sc-for list=\"{{ colorSwatches }}\" as=\"sw\" hint-placeholder-count=\"9\">\n                <button onclick=\"{{ sw.onClick }}\" title=\"{{ sw.name }}\" style=\"{{ sw.style }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;margin-top:12px;font-size:10px\">\n              <span style=\"color:#5b6079\">PEN<\u002Fspan><span style=\"color:#e7e2f5\">{{ selectedColorName }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:7px;margin-top:14px\">\n              <button onclick=\"{{ fillSprite }}\" style=\"flex:1;padding:8px;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:9px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#78a9ff;color:#78a9ff\">FILL<\u002Fbutton>\n              <button onclick=\"{{ clearSprite }}\" style=\"flex:1;padding:8px;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:9px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#ff6f91;color:#ff6f91\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showRun }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">PLAY · STATS<\u002Fdiv>\n            <sc-for list=\"{{ runStats }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #191d33;font-size:11px\">\n                <span style=\"color:#5b6079\">{{ row.k }}<\u002Fspan><span style=\"color:#e7e2f5\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #191d33;font-size:11px\">\n              <span style=\"color:#5b6079\">Player<\u002Fspan><span ref=\"{{ playerCoordRef }}\" style=\"color:#59e391\">(2, 2)<\u002Fspan>\n            <\u002Fdiv>\n            <button onclick=\"{{ toggleRun }}\" style=\"margin-top:16px;width:100%;padding:9px;border:1px solid #ff6f91;border-radius:3px;background:rgba(255,111,145,0.12);color:#ff6f91;font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:1px;cursor:pointer\">■ STOP<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showActor }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">ACTORS<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n              <sc-for list=\"{{ actorList }}\" as=\"a\" hint-placeholder-count=\"2\">\n                <button onclick=\"{{ a.onClick }}\" style=\"{{ a.style }}\">\n                  <span style=\"{{ a.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-size:11px\">{{ a.name }}<\u002Fspan>\n                  <span style=\"font-size:8px;letter-spacing:1px;color:#5b6079;margin-left:auto\">{{ a.kind }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <button onclick=\"{{ addEnemy }}\" style=\"display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px 10px;border-radius:5px;border:1px dashed #59e391;background:rgba(89,227,145,0.06);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">+ NEW ENEMY<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:6px\">STATS<\u002Fdiv>\n            <sc-for list=\"{{ statRows }}\" as=\"st\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #191d33\">\n                <span style=\"font-size:10px;color:#8f93af\">{{ st.label }}<\u002Fspan>\n                <div style=\"display:flex;align-items:center;gap:6px\">\n                  <button onclick=\"{{ st.dec }}\" style=\"width:26px;padding:5px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:13px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#78a9ff;color:#78a9ff\">−<\u002Fbutton>\n                  <span style=\"min-width:46px;text-align:center;font-size:11px;color:#f7f3ff\">{{ st.value }}<\u002Fspan>\n                  <button onclick=\"{{ st.inc }}\" style=\"width:26px;padding:5px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:13px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#59e391;color:#59e391\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ isEnemyActor }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:18px\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">BEHAVIOUR<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:7px\">\n                  <sc-for list=\"{{ behaviorPicks }}\" as=\"bp\" hint-placeholder-count=\"3\">\n                    <button onclick=\"{{ bp.onClick }}\" style=\"{{ bp.style }}\">{{ bp.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin:16px 0 9px\">COLOUR<\u002Fdiv>\n                <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ enemyColorSwatches }}\" as=\"cs\" hint-placeholder-count=\"6\">\n                    <button onclick=\"{{ cs.onClick }}\" style=\"{{ cs.style }}\"><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin:16px 0 9px\">SIZE<\u002Fdiv>\n                <div style=\"display:flex;gap:7px\">\n                  <sc-for list=\"{{ enemySizePicks }}\" as=\"sp\" hint-placeholder-count=\"3\">\n                    <button onclick=\"{{ sp.onClick }}\" style=\"{{ sp.style }}\">{{ sp.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button onclick=\"{{ renameCurEnemy }}\" style=\"margin-top:16px;width:100%;padding:9px;border:1px solid #2b3150;border-radius:4px;background:#20243b;color:#b6b0ca;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#78a9ff;color:#78a9ff\">RENAME \"{{ curEnemyName }}\"<\u002Fbutton>\n                <button onclick=\"{{ placeCurEnemy }}\" style=\"margin-top:8px;width:100%;padding:9px;border:1px solid #59e391;border-radius:4px;background:rgba(89,227,145,0.1);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">PLACE ON MAP →<\u002Fbutton>\n                <sc-if value=\"{{ canDeleteEnemy }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button onclick=\"{{ deleteCurEnemy }}\" style=\"margin-top:8px;width:100%;padding:8px;border:1px solid #4a2030;border-radius:4px;background:rgba(255,111,145,0.08);color:#ff6f91;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">DELETE ENEMY<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isPlayerActor }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:18px\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">WEAPON<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:7px\">\n                  <sc-for list=\"{{ weaponPicks }}\" as=\"wp\" hint-placeholder-count=\"6\">\n                    <button onclick=\"{{ wp.onClick }}\" style=\"{{ wp.style }}\">\n                      {{ wp.glyph }}\n                      <span style=\"font-size:9px;letter-spacing:0.5px\">{{ wp.name }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:12px;padding:10px 11px;border:1px solid #4a3f1a;border-radius:4px;background:rgba(248,214,109,0.05)\">\n                  <div style=\"font-size:10px;color:#ffe07a\">{{ weaponName }}<\u002Fdiv>\n                  <div style=\"font-size:8px;letter-spacing:0.5px;color:#8f93af;margin-top:5px\">{{ weaponStatLine }}<\u002Fdiv>\n                  <div style=\"font-size:9px;color:#8f93af;margin-top:7px;line-height:1.5\">{{ weaponDesc }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:16px\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">APPEARANCE<\u002Fdiv>\n                <button onclick=\"{{ gotoSprite }}\" style=\"width:100%;padding:9px;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#d85cff;color:#d85cff\">EDIT \"{{ playerSpriteName }}\" SPRITE →<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showDialogue }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px\">\n              <span style=\"font-size:8px;letter-spacing:2px;color:#5b6079\">DIALOGUES<\u002Fspan>\n              <button onclick=\"{{ addDialogue }}\" style=\"padding:4px 9px;border:1px solid #2f4d7a;border-radius:3px;background:rgba(120,169,255,0.1);color:#78a9ff;font-size:9px;cursor:pointer;font-family:inherit\">+ NEW<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n              <sc-for list=\"{{ dialogueList }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <button onclick=\"{{ d.onClick }}\" style=\"{{ d.style }}\">\n                  <span style=\"{{ d.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-size:11px\">{{ d.name }}<\u002Fspan>\n                  <span style=\"font-size:8px;letter-spacing:1px;color:#5b6079;margin-left:auto\">{{ d.sub }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:8px\">SPEAKER<\u002Fdiv>\n            <button onclick=\"{{ editSpeaker }}\" style=\"width:100%;padding:9px 11px;border:1px solid #2b3150;border-radius:4px;background:#20243b;color:#f2eefb;font-size:11px;cursor:pointer;font-family:inherit;text-align:left;margin-bottom:10px\" style-hover=\"border-color:#78a9ff\">{{ dlgSpeaker }} ✎<\u002Fbutton>\n            <div style=\"display:flex;gap:7px;margin-bottom:18px\">\n              <sc-for list=\"{{ dlgColorSwatches }}\" as=\"cs\" hint-placeholder-count=\"6\">\n                <button onclick=\"{{ cs.onClick }}\" style=\"{{ cs.style }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">\n              <span style=\"font-size:8px;letter-spacing:2px;color:#5b6079\">LINES<\u002Fspan>\n              <button onclick=\"{{ addLine }}\" style=\"padding:4px 9px;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#59e391;font-size:9px;cursor:pointer;font-family:inherit\">+ ADD LINE<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ lineRows }}\" as=\"ln\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:flex-start;gap:8px;padding:8px 9px;border:1px solid #191d33;border-radius:4px;background:#161a2c\">\n                  <span style=\"font-size:9px;color:#5b6079;flex:0 0 auto;padding-top:2px\">{{ ln.n }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#cfc9de;line-height:1.45;flex:1;word-break:break-word\">{{ ln.text }}<\u002Fspan>\n                  <div style=\"display:flex;gap:4px;flex:0 0 auto\">\n                    <button onclick=\"{{ ln.onEdit }}\" style=\"width:24px;padding:4px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:11px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#78a9ff;color:#78a9ff\">✎<\u002Fbutton>\n                    <button onclick=\"{{ ln.onDelete }}\" style=\"width:24px;padding:4px 0;border:1px solid #2b3150;border-radius:3px;background:#20243b;color:#b6b0ca;font-size:11px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#ff6f91;color:#ff6f91\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ canDeleteDialogue }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ deleteDialogue }}\" style=\"margin-top:16px;width:100%;padding:8px;border:1px solid #4a2030;border-radius:3px;background:rgba(255,111,145,0.08);color:#ff6f91;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">DELETE THIS DIALOGUE<\u002Fbutton>\n            <\u002Fsc-if>\n            <div style=\"margin-top:16px;font-size:9px;color:#7a7f9c;line-height:1.5\">Attach a dialogue to a <span style=\"color:#78a9ff\">▯ Sign<\u002Fspan> in the Map tool, then press <b style=\"color:#cfe3ff\">E<\u002Fb> beside it in play mode.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showLogic }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px\">\n              <span style=\"font-size:8px;letter-spacing:2px;color:#5b6079\">RULES<\u002Fspan>\n              <button onclick=\"{{ addRule }}\" style=\"padding:4px 9px;border:1px solid #4a3f1a;border-radius:3px;background:rgba(248,214,109,0.1);color:#f8d66d;font-size:9px;cursor:pointer;font-family:inherit\">+ NEW<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ ruleCards }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div style=\"{{ r.cardStyle }}\">\n                  <div onclick=\"{{ r.onClick }}\" style=\"display:flex;align-items:center;gap:7px\">\n                    <span style=\"font-size:11px;color:#f2eefb;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fspan>\n                    <button onclick=\"{{ r.onToggle }}\" style=\"{{ r.toggleStyle }}\">{{ r.toggleLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div onclick=\"{{ r.onClick }}\" style=\"font-size:8px;color:#7a7f9c;margin-top:6px;line-height:1.5;word-break:break-word\">{{ r.summary }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;font-size:9px;color:#7a7f9c;line-height:1.5\">Rules drive your game in play mode. Select one to edit its <span style=\"color:#59e391\">WHEN<\u002Fspan> · <span style=\"color:#78a9ff\">IF<\u002Fspan> · <span style=\"color:#f8d66d\">THEN<\u002Fspan> in the canvas, or use the AI builder.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">SYSTEM<\u002Fdiv>\n            <sc-for list=\"{{ systemRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #191d33;font-size:11px\">\n                <span style=\"color:#5b6079\">{{ row.k }}<\u002Fspan><span style=\"color:#e7e2f5\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin-top:14px;font-size:9px;color:#7a7f9c;line-height:1.5\">Tune display, difficulty, audio and saving in the canvas. Everything persists to this browser.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showProps }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">PROPERTIES<\u002Fdiv>\n            <sc-for list=\"{{ propRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #191d33;font-size:11px\">\n                <span style=\"color:#5b6079\">{{ row.k }}<\u002Fspan><span style=\"color:#e7e2f5\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ showExportPanel }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:18px\">\n                <div style=\"font-size:8px;letter-spacing:2px;color:#5b6079;margin-bottom:9px\">READABLE FILES<\u002Fdiv>\n                <button onclick=\"{{ exportProject }}\" style=\"width:100%;padding:9px;margin-bottom:7px;border:1px solid #59e391;border-radius:3px;background:rgba(89,227,145,0.12);color:#59e391;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">EXPORT .bloom.json<\u002Fbutton>\n                <button onclick=\"{{ importProject }}\" style=\"width:100%;padding:9px;margin-bottom:7px;border:1px solid #78a9ff;border-radius:3px;background:#20243b;color:#78a9ff;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">IMPORT .bloom.json<\u002Fbutton>\n                <button onclick=\"{{ wipeSave }}\" style=\"width:100%;padding:9px;border:1px solid #ff6f91;border-radius:3px;background:#20243b;color:#ff6f91;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit\">CLEAR LOCAL SAVE<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height:98px;flex:0 0 98px;background:#0d1019;border-top:1px solid #1b1f36;display:flex;flex-direction:column\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 15px 5px\">\n      <span style=\"font-size:8px;letter-spacing:2px;color:#5b6079\">CONSOLE<\u002Fspan>\n      <span style=\"font-size:9px;color:#59e391;letter-spacing:1px\">{{ statusText }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow:auto;padding:0 15px 8px;display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ log }}\" as=\"line\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:9px;font-size:10px;line-height:1.5\">\n          <span style=\"color:#3f4460;flex:0 0 auto\">{{ line.t }}<\u002Fspan>\n          <span style=\"{{ line.style }}\">{{ line.msg }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:9px;font-size:10px\">\n        <span style=\"color:#3f4460\">{{ clock }}<\u002Fspan>\n        <span style=\"color:#d85cff\">&gt;<span style=\"animation:bmblink 1s infinite\">_<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"{{ scanlineStyle }}\"><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  TILE_COLORS = ['#0e1120','#59e391','#78a9ff','#6b6f8a','#f8d66d','#ff6f91','#d85cff'];\n  TILE_NAMES = ['Void','Grass','Water','Stone','Sand','Lava','Path'];\n  PEN_COLORS = ['#0e1120','#f7f3ff','#151a30','#ff6f91','#59e391','#78a9ff','#f8d66d','#d85cff','#ff9d5c'];\n  PEN_NAMES = ['Eraser','White','Ink','Red','Green','Blue','Yellow','Magenta','Orange'];\n  FIELDS = [\n    ['game_name','Game Name'],['subtitle','Subtitle'],['company','Company'],\n    ['author','Author'],['version','Version'],['genre','Genre'],\n    ['resolution','Resolution'],['platforms','Platforms'],\n    ['start_room','Start Room'],['description','Description']\n  ];\n  TOOLS = ['Project','Sprite','Map','Actor','Dialogue','Logic','Run','Settings','Assets','Export'];\n  TOOL_DESC = {\n    Project:'Game identity & metadata',\n    Sprite:'Pixel & animation editor',\n    Map:'Rooms, tiles & world editor',\n    Actor:'Player, NPC & enemy blueprints',\n    Dialogue:'Branching dialogue & quests',\n    Logic:'Visual scripting & actions',\n    Run:'Live test & play mode',\n    Settings:'Theme, layout & input',\n    Assets:'Project asset browser',\n    Export:'Build & export helper'\n  };\n  PROPS = {\n    Project:[['Fields','10'],['State','saved'],['Format','bloommaker/v1']],\n    Actor:[['Blueprints','3'],['Selected','hero'],['Behaviours','walk · talk']],\n    Dialogue:[['Trees','2'],['Nodes','14'],['Variables','flags · items']],\n    Logic:[['Graphs','1'],['Nodes','8'],['Triggers','on_enter']],\n    Settings:[['Theme','Bloom Neon'],['Input','pad · kb · touch'],['Target','Raspberry Pi']],\n    Assets:[['Sprites','6'],['Tiles','1 set'],['Audio','3 clips']],\n    Export:[['Target','Pi · Linux · Win'],['Format','readable'],['Status','ready']],\n    Run:[['Room','room_001'],['Player','(2, 2)'],['Input','pad · kb · touch']]\n  };\n  WEAPONS = {\n    fists:  { name:'Fists',  range:38, cd:300, dmg:1, ranged:false, color:'#c7cbe0', accent:'#8a8fac', tag:'melee',  desc:'Bare-handed jab. Short reach, quick recovery.' },\n    sword:  { name:'Sword',  range:54, cd:340, dmg:2, ranged:false, color:'#cfe3ff', accent:'#78a9ff', tag:'melee',  desc:'The classic. Balanced arc, solid damage.' },\n    spear:  { name:'Spear',  range:76, cd:470, dmg:2, ranged:false, color:'#9fe3c0', accent:'#59e391', tag:'reach',  desc:'Long thrust — hit slimes before they touch you.' },\n    hammer: { name:'Hammer', range:64, cd:660, dmg:4, ranged:false, color:'#ffc27a', accent:'#ff9d5c', tag:'heavy',  desc:'Slow, wide, brutal. One swing clears a crowd.' },\n    dagger: { name:'Dagger', range:34, cd:150, dmg:1, ranged:false, color:'#ff9dcf', accent:'#ff75bd', tag:'fast',   desc:'Tiny reach but blazing fast — stab, stab, stab.' },\n    bow:    { name:'Bow',    range:999, cd:430, dmg:2, ranged:true, speed:360, color:'#f8d66d', accent:'#ffe07a', tag:'ranged', desc:'Fires an arrow across the room in your facing direction.' }\n  };\n  WEAPON_ORDER = ['fists','sword','spear','hammer','dagger','bow'];\n  ACTOR_DEFS = [\n    { id:'player', name:'Player', kind:'Hero',  color:'#ff75bd' },\n    { id:'slime',  name:'Slime',  kind:'Enemy', color:'#59e391' }\n  ];\n  LOGIC_EVENTS = [\n    { id:'game_start',  label:'Game starts' },\n    { id:'enter_room',  label:'Enter a room' },\n    { id:'collect_coin',label:'Collect a coin' },\n    { id:'all_coins',   label:'All coins collected' },\n    { id:'collect_key', label:'Collect a key' },\n    { id:'open_chest',  label:'Open a chest' },\n    { id:'defeat_slime',label:'Defeat a slime' },\n    { id:'player_hurt', label:'Player is hurt' },\n    { id:'talk',        label:'Read a sign' },\n    { id:'timer',       label:'Every second' }\n  ];\n  LOGIC_VARS = [\n    { id:'coins',
