<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#020308;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   BLINK — QuarterbitGames
   You're a firefly caught in a web across a barn doorway at night.
   Your glow is your light. Your flower is your bonk stick.
   Knock the spiders off the web. Survive the big one.
   ========================================================= */

const W = 1280, H = 720, STEP = 1 / 60;
const OPEN = { x: 46, y: 30, w: 1188, h: 690 };   // barn doorway opening (fills the screen)
const CX = 640, CY = 380;                           // web center
const RX0 = 566, RY0 = 322;                         // full-size web radii (~90% of the screen)
const FONT_T = '"Creepster", "Chiller", fantasy, cursive';
const FONT_B = '"Fredoka", "Trebuchet MS", system-ui, sans-serif';
const FF = '#e6ff6e', PINK = '#ff7ac8', EYE = '#ff3b3b', LANT = '#ffb347', DEW = '#9effe6';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

/* ---------- utils ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function hash(n) { n = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return n - Math.floor(n); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------- glow sprites & light stamp ---------- */
function makeGlow(r, g, b) {
  const c = mk(128, 128), x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(0.25, `rgba(${r},${g},${b},.55)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return c;
}
const GL = {
  ff: makeGlow(230, 255, 110), dew: makeGlow(158, 255, 230), eye: makeGlow(255, 50, 50), lant: makeGlow(255, 170, 70),
  moon: makeGlow(200, 215, 255), pink: makeGlow(255, 120, 200), white: makeGlow(255, 255, 240), star: makeGlow(255, 230, 120)
};
function glow(spr, x, y, r, a = 1) { ctx.globalAlpha = a; ctx.drawImage(GL[spr], x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }
const stamp = mk(256, 256);
{ const x = stamp.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.45, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); }
const darkC = mk(W, H), dk = darkC.getContext('2d');

/* ---------- the barn (pre-rendered) ---------- */
const bg = mk(W, H);
function drawBarn() {
  const g = bg.getContext('2d');
  // plank walls
  for (let x = 0; x < W; x += 44) {
    const c = hash(x) * 12;
    g.fillStyle = `rgb(${46 + c | 0},${30 + c * 0.5 | 0},${30 + c * 0.6 | 0})`; g.fillRect(x, 0, 44, H);
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x, 0, 3, H);
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    for (let k = 0; k < 5; k++) { const gx = x + 8 + hash(x + k) * 30; g.beginPath(); g.moveTo(gx, 0); g.bezierCurveTo(gx + 4, H * .3, gx - 4, H * .6, gx + 2, H); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,.55)'; for (const ny of [90, 360, 640]) { g.beginPath(); g.arc(x + 22, ny + hash(x) * 10, 2.2, 0, 7); g.fill(); }
  }
  // the doorway: night sky
  const sky = g.createLinearGradient(0, OPEN.y, 0, OPEN.y + OPEN.h);
  sky.addColorStop(0, '#070b26'); sky.addColorStop(0.7, '#141a48'); sky.addColorStop(1, '#1b1d3c');
  g.fillStyle = sky; g.fillRect(OPEN.x, OPEN.y, OPEN.w, OPEN.h);
  // hills, fence, tree silhouettes
  g.fillStyle = '#0a0d24'; g.beginPath(); g.moveTo(OPEN.x, 600);
  for (let x = OPEN.x; x <= OPEN.x + OPEN.w; x += 24) g.lineTo(x, 585 + Math.sin(x * 0.012) * 22 + Math.sin(x * 0.031) * 8);
  g.lineTo(OPEN.x + OPEN.w, 720); g.lineTo(OPEN.x, 720); g.closePath(); g.fill();
  g.fillStyle = '#05060f'; g.beginPath(); g.moveTo(OPEN.x, 660);
  for (let x = OPEN.x; x <= OPEN.x + OPEN.w; x += 16) g.lineTo(x, 650 + Math.sin(x * 0.02) * 6 - (hash(x) * 6));
  g.lineTo(OPEN.x + OPEN.w, 720); g.lineTo(OPEN.x, 720); g.closePath(); g.fill();
  g.strokeStyle = '#05060f'; g.lineWidth = 5;
  for (let x = OPEN.x + 20; x < OPEN.x + OPEN.w; x += 54) { g.beginPath(); g.moveTo(x, 662); g.lineTo(x, 620); g.stroke(); }
  g.lineWidth = 3; g.beginPath(); g.moveTo(OPEN.x, 632); g.lineTo(OPEN.x + OPEN.w, 630); g.moveTo(OPEN.x, 648); g.lineTo(OPEN.x + OPEN.w, 646); g.stroke();
  g.fillStyle = '#05060f'; g.fillRect(250, 470, 14, 150); g.fillRect(1010, 500, 10, 110);
  g.beginPath(); g.arc(257, 450, 56, 0, 7); g.arc(218, 484, 38, 0, 7); g.arc(298, 480, 40, 0, 7); g.fill();
  g.beginPath(); g.arc(1015, 486, 34, 0, 7); g.arc(992, 506, 24, 0, 7); g.arc(1040, 504, 24, 0, 7); g.fill();
  // timber door frame
  const beam = (x, y, w, h) => {
    g.fillStyle = '#4b3326'; g.fillRect(x, y, w, h);
    g.fillStyle = 'rgba(255,210,160,.06)'; g.fillRect(x, y, w, 4);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(x, y + h - 4, w, 4);
  };
  beam(OPEN.x - 30, OPEN.y - 30, OPEN.w + 60, 30);
  beam(OPEN.x - 30, OPEN.y, 30, OPEN.h); beam(OPEN.x + OPEN.w, OPEN.y, 30, OPEN.h);
  g.save(); g.translate(OPEN.x, OPEN.y); g.rotate(Math.PI / 4); beam(-10, -10, 110, 18); g.restore();
  g.save(); g.translate(OPEN.x + OPEN.w, OPEN.y); g.rotate(Math.PI * 3 / 4); beam(-10, -8, 110, 18); g.restore();
  // hay bales
  const bale = (x, y, w, h) => {
    g.fillStyle = '#5a4520'; g.beginPath(); g.roundRect(x, y, w, h, 8); g.fill();
    g.strokeStyle = 'rgba(30,20,5,.6)'; g.lineWidth = 1.5;
    for (let i = 0; i < 26; i++) { const sx = x + rand(4, w - 4), sy = y + rand(4, h - 4); g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + rand(-8, 8), sy + rand(-3, 3)); g.stroke(); }
    g.strokeStyle = '#3a2a10'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + w * .3, y); g.lineTo(x + w * .3, y + h); g.moveTo(x + w * .7, y); g.lineTo(x + w * .7, y + h); g.stroke();
  };
  bale(52, 640, 150, 80); bale(150, 668, 120, 52);
  bale(1078, 640, 150, 80); bale(1010, 668, 120, 52);
}
drawBarn();

/* ---------- the web (rebuilt every level, it gets smaller) ---------- */
const webC = mk(W, H);
function rayToOpen(a) {
  const dx = Math.cos(a), dy = Math.sin(a); let t = 1e9;
  if (dx > 0) t = Math.min(t, (OPEN.x + OPEN.w - CX) / dx); if (dx < 0) t = Math.min(t, (OPEN.x - CX) / dx);
  if (dy > 0) t = Math.min(t, (OPEN.y + OPEN.h - CY) / dy); if (dy < 0) t = Math.min(t, (OPEN.y - CY) / dy);
  return { x: CX + dx * t, y: CY + dy * t };
}
function buildWeb(RX, RY) {
  const g = webC.getContext('2d'); g.clearRect(0, 0, W, H);
  const ex = (a, f) => CX + Math.cos(a) * RX * f, ey = (a, f) => CY + Math.sin(a) * RY * f;
  const n = 18, ang = []; for (let i = 0; i < n; i++) ang.push(i / n * Math.PI * 2 + (hash(i * 7) - .5) * 0.14);
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(205,215,255,.32)'; g.lineWidth = 1.2;
  for (let i = 0; i < n; i += 2) { const a = ang[i], e = rayToOpen(a); g.beginPath(); g.moveTo(ex(a, 1), ey(a, 1)); g.lineTo(e.x, e.y); g.stroke(); }
  g.strokeStyle = 'rgba(215,225,255,.6)'; g.lineWidth = 1.4;
  for (const a of ang) { g.beginPath(); g.moveTo(CX, CY); g.lineTo(ex(a, 1), ey(a, 1)); g.stroke(); }
  const rings = Math.max(6, Math.round(RY / 24));
  g.lineWidth = 1.1;
  for (let k = 1; k <= rings; k++) {
    const rr = k / rings; g.strokeStyle = `rgba(215,225,255,${k === rings ? .65 : .45})`; g.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = ang[i]; let a1 = ang[(i + 1) % n]; if (a1 < a0) a1 += Math.PI * 2;
      const m = (a0 + a1) / 2;
      if (i === 0) g.moveTo(ex(a0, rr), ey(a0, rr));
      g.quadraticCurveTo(ex(m, rr * 0.92), ey(m, rr * 0.92), ex(a1, rr), ey(a1, rr));
    }
    g.stroke();
  }
  g.fillStyle = 'rgba(215,225,255,.5)'; g.beginPath(); g.arc(CX, CY, 4, 0, 7); g.fill();
}

/* ---------- audio ---------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  startMusic();
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function sNoise(dur, f0, f1, type = 'bandpass', gain = .4, q = 1.2, delay = 0) {
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime + delay, src = AC.createBufferSource(); src.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(gain, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}
function sTone(f0, f1, dur, type = 'triangle', gain = .25, delay = 0) {
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime + delay, o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(gain, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const SFX = {
  swing() { sNoise(.13, 2200, 600, 'bandpass', .3, 1.4); },
  bonk() { sTone(320, 150, .12, 'triangle', .3); sNoise(.06, 900, 300, 'lowpass', .3); },
  fall() { sTone(900, 110, .55, 'sine', .12); },
  chime() { sTone(1320, 1760, .12, 'sine', .18); sTone(1760, 2640, .16, 'sine', .14, .06); },
  flash() { sNoise(.4, 3000, 9000, 'highpass', .25, .7); sTone(600, 2400, .3, 'sine', .14); },
  hurt() { sNoise(.3, 500, 100, 'lowpass', .6, .7); sTone(200, 70, .25, 'square', .13); },
  roar() { sNoise(1.3, 320, 70, 'lowpass', .7, .8); sTone(95, 50, 1.2, 'sawtooth', .16); sTone(140, 70, 1.0, 'sawtooth', .08, .1); },
  hiss() { sNoise(.6, 4000, 2500, 'highpass', .16, .5); },
  lunge() { sNoise(.25, 400, 120, 'lowpass', .5, .8); },
  bossHit() { sTone(170, 90, .14, 'square', .13); sNoise(.1, 700, 200, 'lowpass', .35); },
  bossDie() { sTone(300, 40, 1.4, 'sawtooth', .16); sNoise(1.4, 900, 60, 'lowpass', .5); },
  hop() { sTone(500, 900, .08, 'square', .05); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => sTone(f, f * 1.01, .25, 'triangle', .18, i * .09)); },
  over() { [392, 330, 262, 196].forEach((f, i) => sTone(f, f * .97, .3, 'triangle', .2, i * .16)); },
  pickup() { sTone(600, 1200, .15, 'sine', .2); },
  tick() { sTone(1200, 1000, .04, 'square', .05); },
  nope() { sTone(220, 180, .1, 'square', .06); },
  cricket() { [0, .07, .14].forEach(d => sTone(4300, 4200, .035, 'sine', .016, d)); },
  owl() { sTone(390, 365, .35, 'sine', .05); sTone(370, 345, .55, 'sine', .05, .45); }
};

/* ---------- optional soundtrack: drop a file at audio/theme.mp3 ---------- */
const music = new Audio('audio/theme.mp3');
music.loop = true; music.preload = 'auto'; music.volume = 0;
let musicOn = true, musicBlocked = false, musicMissing = false;
try { musicOn = localStorage.getItem('blink_music') !== 'off'; } catch (e) {}
music.addEventListener('error', () => { musicMissing = true; });
function startMusic() {
  if (!musicOn || musicMissing || !music.paused) return;
  const p = music.play(); if (p && p.then) p.then(() => { musicBlocked = false; }).catch(() => { musicBlocked = true; });
}
function toggleMusic() {
  if (musicMissing) return;
  musicOn = !musicOn; try { localStorage.setItem('blink_music', musicOn ? 'on' : 'off'); } catch (e) {}
  if (musicOn) startMusic(); else music.pause();
  showToast(musicOn ? '♪ music on' : 'music off');
}
const MUSIC_VOL = { title: 0.6, play: 0.45, pause: 0.18, clear: 0.6, over: 0.25 };
function updateMusic(dt) { if (!music.paused) music.volume = clamp(music.volume + ((MUSIC_VOL[state] ?? .45) - music.volume) * Math.min(1, dt * 3), 0, 1); }

/* ---------- input ---------- */
const keys = new Set(), keyEdge = new Set();
let pointerTap = false;
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys.has(e.code)) keyEdge.add(e.code); keys.add(e.code); initAudio();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('pointerdown', () => { initAudio(); pointerTap = true; });
addEventListener('blur', () => { keys.clear(); if (state === 'play') setState('pause'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') setState('pause'); music.pause(); }
  else if (musicOn && !musicBlocked && !musicMissing) music.play().catch(() => {});
});
let padIndex = -1, padPrev = [], padNow = [], padAxes = [0, 0], padAim = [0, 0], toast = null;
const showToast = text => { toast = { text, t: 0 }; };
addEventListener('gamepadconnected', e => { padIndex = e.gamepad.index; showToast('🎮 gamepad connected'); });
addEventListener('gamepaddisconnected', e => { if (e.gamepad.index === padIndex) { padIndex = -1; showToast('gamepad disconnected'); if (state === 'play') setState('pause'); } });
function dead(ax, ay, dz) { const m = Math.hypot(ax, ay); if (m < dz) return [0, 0]; const k = Math.min(1, (m - dz) / (0.95 - dz)) / m; return [ax * k, ay * k]; }
function pollPad() {
  padPrev = padNow; padNow = []; padAxes = [0, 0]; padAim = [0, 0];
  const pads = navigator.getGamepads ? navigator.getGamepads() : null; if (!pads) return;
  let gp = padIndex >= 0 ? pads[padIndex] : null;
  if (!gp || !gp.connected) { gp = null; for (const p of pads) if (p && p.connected) { gp = p; padIndex = p.index; break; } }
  if (!gp) return;
  for (let i = 0; i < gp.buttons.length; i++) { const b = gp.buttons[i]; padNow[i] = !!(b && (b.pressed || b.value > 0.5)); }
  padAxes = dead(gp.axes[0] || 0, gp.axes[1] || 0, 0.2);
  padAim = dead(gp.axes[2] || 0, gp.axes[3] || 0, 0.3);
}
const pb = i => !!padNow[i], pe = i => !!padNow[i] && !padPrev[i];
const kd = (...c) => c.some(k => keys.has(k)), ke = (...c) => c.some(k => keyEdge.has(k));
function inputMove() {
  let x = 0, y = 0;
  if (kd('KeyA', 'ArrowLeft') || pb(14)) x--; if (kd('KeyD', 'ArrowRight') || pb(15)) x++;
  if (kd('KeyW', 'ArrowUp') || pb(12)) y--; if (kd('KeyS', 'ArrowDown') || pb(13)) y++;
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  if (Math.hypot(padAxes[0], padAxes[1]) > Math.hypot(x, y)) { x = padAxes[0]; y = padAxes[1]; }
  return [x, y];
}
// A / X / RB / RT = flower swing · B / Y / LB / LT = flash · Start = pause · Select = music
const act = {
  swing: () => ke('Space', 'KeyJ') || pe(0) || pe(2) || pe(5) || pe(7),
  flash: () => ke('ShiftLeft', 'ShiftRight', 'KeyK', 'KeyE') || pe(1) || pe(3) || pe(4) || pe(6),
  pause: () => ke('Escape', 'KeyP') || pe(9),
  select: () => ke('Enter', 'Space', 'NumpadEnter') || pe(0) || pointerTap,
};
let navHold = 0, navDir = 0;
function menuNav(dt) {
  let d = 0; if (ke('ArrowUp', 'KeyW') || pe(12)) d = -1; if (ke('ArrowDown', 'KeyS') || pe(13)) d = 1;
  const sy = padAxes[1], sd = sy < -0.6 ? -1 : sy > 0.6 ? 1 : 0;
  if (sd) { if (navDir !== sd) { navDir = sd; navHold = .35; d = sd; } else { navHold -= dt; if (navHold <= 0) { navHold = .16; d = sd; } } } else navDir = 0;
  return d;
}
function rumble(s, w, ms) { try { const gp = navigator.getGamepads()[padIndex]; if (gp && gp.vibrationActuator) gp.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: s, weakMagnitude: w }).catch(() => {}); } catch (e) {} }

/* ---------- game ---------- */
let state = 'title', stateT = 0, menuIdx = 0, G = null, best = 0;
try { best = +localStorage.getItem('blink_best') || 0; } catch (e) {}
function setState(s) { state = s; stateT = 0; menuIdx = 0; }
function cfg(n) {
  return {
    size: Math.max(0.55, 1 - (n - 1) * 0.07),
    need: 5 + n,
    maxSp: Math.min(3 + n * 2, 15),
    spawnEvery: Math.max(0.7, 2.8 - n * 0.2),
    spSpeed: Math.min(60 + n * 9, 150),
    jumpers: n >= 3 ? 0.3 : 0,
    bossHP: 5 + n * 2,
    bossSpeed: Math.min(55 + n * 6, 110),
  };
}
function newGame() { G = { level: 0, score: 0, hp: 3, time: 0, parts: [], floats: [], shake: 0, flash: 0 }; startLevel(1); setState('play'); }
function startLevel(n) {
  const c = cfg(n);
  Object.assign(G, { level: n, cfg: c, RX: RX0 * c.size, RY: RY0 * c.size, drops: 0, need: c.need, levelT: 0, spiders: [], dewdrops: [], pickups: [], boss: null, bossDone: false, spawnT: 2, dropT: .5, pickT: 15, parts: [], floats: [], flashFx: 0, bossBanner: 0 });
  G.p = { x: CX, y: CY + RY0 * c.size * 0.3, vx: 0, vy: 0, fx: 0, fy: -1, r: 10, inv: 1.5, swingT: 0, swingCd: 0, swingA: -Math.PI / 2, petals: 6, petalT: 0, glow: 100, flashT: 0 };
  buildWeb(G.RX, G.RY);
}
function eNorm(x, y) { return Math.hypot((x - CX) / G.RX, (y - CY) / G.RY); }
function clampE(o, lim) { const e = eNorm(o.x, o.y); if (e > lim) { o.x = CX + (o.x - CX) * lim / e; o.y = CY + (o.y - CY) * lim / e; } return e; }
function ePt(a, f) { return [CX + Math.cos(a) * G.RX * f, CY + Math.sin(a) * G.RY * f]; }
function spawnSpider(x, y, type, quick) {
  const p = G.p;
  if (x == null) for (let k = 0; k < 20; k++) { [x, y] = ePt(rand(0, Math.PI * 2), .95); if (dist2(x, y, p.x, p.y) > 200 * 200) break; }
  type = type || (Math.random() < G.cfg.jumpers ? 'jumper' : 'crawler');
  G.spiders.push({ type, x, y, vx: 0, vy: 0, r: type === 'jumper' ? 12 : 11, stun: 0, knockT: 0, spawn: quick ? .5 : 0, falling: 0, id: rand(0, 1000), leg: rand(0, 6), state: 'walk', t: 0, jumpCd: rand(1, 2.5) });
}
function spawnDrop() {
  const p = G.p;
