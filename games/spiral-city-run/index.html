// ---------------------------------------------------------------------
// 7. INPUT - keyboard + gamepad merged into one set of "buttons"
// ---------------------------------------------------------------------
const keys = new Set();                        // keyboard codes held right now
const tapped = new Set();                      // keys pressed since the last frame (catches very quick taps)
let padIndex = -1;                             // which gamepad we listen to
const inp = { ax: 0, ay: 0, jump: false, sprint: false, brake: false, confirm: false, back: false, pause: false, mute: false, up: false, down: false };
let prevInp = { ...inp };
const pressed = k => inp[k] && !prevInp[k];    // true only on the frame a button goes down
const GAME_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Tab'];
addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();   // stop the page scrolling
  keys.add(e.code); tapped.add(e.code);
  audioInit();                                 // browsers need a key/click before sound
});
addEventListener('keyup', e => keys.delete(e.code));
// Input latch safety: forget held keys whenever focus is lost
addEventListener('blur', () => { keys.clear(); tapped.clear(); if (G.state === 'play') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { keys.clear(); if (G.state === 'play') pauseGame(); } });
addEventListener('pointerdown', () => { audioInit(); screenCv.focus(); });
addEventListener('gamepadconnected', e => { padIndex = e.gamepad.index; toast('GAMEPAD READY'); });
addEventListener('gamepaddisconnected', e => {
  if (e.gamepad.index !== padIndex) return;
  padIndex = -1; toast('GAMEPAD UNPLUGGED');
  if (G.state === 'play') pauseGame();
});
function pollInput() {
  prevInp = { ...inp };
  const k = c => keys.has(c) || tapped.has(c);   // held now, or tapped and released between frames
  let ax = 0, ay = 0;
  if (k('ArrowLeft') || k('KeyA')) ax -= 1;
  if (k('ArrowRight') || k('KeyD')) ax += 1;
  if (k('ArrowUp') || k('KeyW')) ay -= 1;
  if (k('ArrowDown') || k('KeyS')) ay += 1;
  let jump = k('Space') || k('KeyJ') || k('KeyZ');
  let sprint = k('ShiftLeft') || k('ShiftRight') || k('KeyK') || k('KeyX');
  let confirm = k('Enter') || k('Space') || k('KeyJ') || k('KeyZ');
  let back = k('Escape') || k('Backspace');
  let pause = k('Escape') || k('KeyP');
  let mute = k('KeyM');
  let brake = false;
  // gamepad (standard mapping)
  const pads = navigator.getGamepads ? navigator.getGamepads() : null;
  let gp = pads && padIndex >= 0 ? pads[padIndex] : null;
  if (!gp && pads) for (const p of pads) if (p && p.connected) { gp = p; padIndex = p.index; break; }
  if (gp) {
    const b = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
    let sx = gp.axes[0] || 0, sy = gp.axes[1] || 0;
    const m = Math.hypot(sx, sy);              // radial deadzone, rescaled so it ramps from 0
    if (m < 0.28) { sx = 0; sy = 0; } else { const s = (m - 0.28) / (1 - 0.28) / m; sx *= s; sy *= s; }
    if (Math.abs(sx) < 0.08) sx = 0;           // hard zero for tiny drift
    if (Math.abs(sy) < 0.08) sy = 0;
    if (b(14)) sx = -1; if (b(15)) sx = 1;     // d-pad wins over the stick
    if (b(12)) sy = -1; if (b(13)) sy = 1;
    if (Math.abs(sx) > Math.abs(ax)) ax = sx;
    if (Math.abs(sy) > Math.abs(ay)) ay = sy;
    jump = jump || b(0) || b(1);               // A / B jump
    sprint = sprint || b(2) || b(3) || b(5) || b(7);   // X / Y / RB / RT dash
    brake = b(4) || b(6);                      // LB / LT slow down
    confirm = confirm || b(0);
    back = back || b(1);
    pause = pause || b(9);                     // Start
    mute = mute || b(8);                       // Select / Back
  }
  inp.ax = clamp(ax, -1, 1); inp.ay = clamp(ay, -1, 1);
  inp.jump = jump; inp.confirm = confirm; inp.back = back; inp.pause = pause; inp.mute = mute;
  inp.sprint = sprint || inp.ay < -0.5;        // pushing up also dashes
  inp.brake = brake || inp.ay > 0.5;           // pulling down slows down
  inp.up = inp.ay < -0.5; inp.down = inp.ay > 0.5;   // menu navigation
  tapped.clear();
}

// ---------------------------------------------------------------------
// 8. GAME STATE
// ---------------------------------------------------------------------
const G = {
  state: 'loading',     // loading | title | count | play | pause | over | win
  t: 0,                 // clock that always runs (animations)
  time: 0,              // seconds left
  runTime: 0,           // seconds since GO
  count: 0,             // countdown before the run
  menu: 0,              // highlighted menu item
  menuT: 0,             // time spent on an end screen
  lap: 0,               // current lap (0-based)
  nextCP: 0,            // index of the next checkpoint
  obIdx: 0,             // first obstacle not yet far behind Sky
  banner: null,         // big lap/district banner
  toast: null,          // small message at the top
  shake: 0, sx: 0, sy: 0,   // screen shake
  camX: 0,              // camera's sideways follow
  rank: '', newBest: false,
  lastTick: 0,          // last whole second announced in hurry mode
};
const sky = {};                                // the runner (filled in by resetSky)
let obstacles = [], cars = [], parts = [], pops = [], streaks = [];
let checkpoints = [];                          // [{th, bonus, passed}]
let carTimerOn = 0, carTimerSame = 0;          // countdown to next car spawn
let bestTime = 0;                              // best finishing time ever (seconds)
try { bestTime = +localStorage.getItem('scr_best') || 0; } catch (e) {}
const cam = { px: 0, py: 0, rho: 0, cos: 1, sin: 0, th: 0 };

function resetSky() {
  Object.assign(sky, {
    th: -10 / R0, x: 10, vx: 0, v: 0,          // just behind the start line, right lane
    z: 0, vz: 0,                               // height + vertical speed (jumping)
    sprint: 1, tired: false,                   // dash meter
    stun: 0, inv: 0, boost: 0, slip: 0, slipDir: 0,
    anim: 0, sparks: 0, hits: 0,
  });
}
// Checkpoints every half lap. Each one gives enough time to reach the next
// at a decent pace; dashing and dodging well builds a cushion.
function buildCheckpoints() {
  checkpoints = [];
  for (let k = 1; k * Math.PI < THETA_FIN - 0.5; k++) checkpoints.push({ th: k * Math.PI, passed: false, bonus: 0 });
  // The pace the clock expects (pixels per second) starts gentle and gets
  // stricter toward the Core. Tuned with a bot playtest: a careful runner who
  // never dashes runs out near the end; dashing well leaves a cushion.
  const paceAt = i => lerp(160, 192, i / checkpoints.length);
  checkpoints.forEach((c, i) => {
    const next = i + 1 < checkpoints.length ? checkpoints[i + 1].th : THETA_FIN;
    c.bonus = (arcLen(next) - arcLen(c.th)) / paceAt(i + 1) + 1.0;
  });
  G.startTime = arcLen(checkpoints[0].th) / paceAt(0) + 2.5;
}
// Scatter obstacles and pickups down the whole road ("beats"), harder further in
const dTh = (th, px) => px / rArm(th);         // pixels along the road -> angle step there
function addOb(type, th, x, extra) { obstacles.push(Object.assign({ type, th, x, z: 0, alive: true }, extra || {})); }
function placeBeat(th, p) {
  const roll = Math.random();
  const lanes = LANES.slice().sort(() => Math.random() - 0.5);   // shuffled lanes
  if (roll < 0.25) {                           // a weaving trail of sparks
    const l0 = pick(LANES), l1 = clamp(l0 + pick([-20, 0, 20]), -30, 30);
    for (let i = 0; i < 6; i++) addOb('spark', th + dTh(th, i * 13), lerp(l0, l1, i / 5));
  } else if (roll < 0.43) {                    // cones (never all four lanes)
    const n = 1 + (Math.random() < 0.4 + p * 0.5 ? 1 : 0) + (p > 0.5 && Math.random() < 0.4 ? 1 : 0);
    for (let i = 0; i < n; i++) addOb('cone', th + dTh(th, rand(-6, 6)), lanes[i] + rand(-3, 3));
  } else if (roll < 0.57 && p > 0.08) {        // barrier with one gap; sparks show the way
    const gap = pick(LANES);
    for (let x = -35; x <= 35; x += 10) if (Math.abs(x - gap) > 11) addOb('bar', th, x);
    for (let i = 1; i <= 3; i++) addOb('spark', th - dTh(th, i * 12), gap);
  } else if (roll < 0.67 && p > 0.2) {         // full barrier: jump it, grab the air sparks
    for (let x = -35; x <= 35; x += 10) addOb('bar', th, x);
    const lx = pick(LANES);
    for (let i = -1; i <= 1; i++) addOb('aspark', th + dTh(th, i * 9), lx, { z: 18 });
  } else if (roll < 0.77 && p > 0.05) {        // glitch puddle
    addOb('pud', th, pick(LANES));
  } else if (roll < 0.87) {                    // boost pads
    addOb('boost', th, pick(LANES));
    if (Math.random() < 0.5) addOb('boost', th + dTh(th, 26), pick(LANES));
  } else if (roll < 0.895 && p > 0.12) {       // bonus clock (rare)
    addOb('clock', th, pick(LANES));
  } else {                                     // a cone guarding a line of sparks
    const l = pick(LANES);
    addOb('cone', th, l);
    for (let i = 1; i <= 4; i++) addOb('spark', th + dTh(th, i * 12), l);
  }
}
function buildCourse() {
  obstacles = [];
  let S = 230;                                 // first beat a little after the start
  const end = arcLen(THETA_FIN) - 60;
  while (S < end) {
    const th = thetaAt(S), p = th / THETA_FIN;
    const nearGate = checkpoints.some(c => Math.abs(c.th - th) * rArm(th) < 45);
    if (!nearGate) placeBeat(th, p);
    S += rand(85, 140) - p * 28;               // beats come faster deeper in
  }
  obstacles.sort((a, b) => a.th - b.th);       // sorted so we can scan a window cheaply
}

function startRun() {
  resetSky(); buildCheckpoints(); buildCourse();
  cars = []; parts = []; pops = []; streaks = [];
  carTimerOn = 2.5; carTimerSame = 1.2;
  G.time = G.startTime; G.runTime = 0; G.lap = 0; G.nextCP = 0; G.obIdx = 0;
  G.camX = sky.x * 0.35; G.count = 3.2; G.lastCount = 4; G.state = 'count';
  G.banner = { a: 'LAP 1/' + LAPS, b: DISTRICTS[0], t: 0 };
  tempoMul = 1; G.hurry = false;
  audioInit(); musicStart(); musicVolume(0.55);
}
function pauseGame() { G.state = 'pause'; G.menu = 0; sfx('pause'); musicVolume(0.18); }
function toast(s) { G.toast = { s, t: 0 }; }
function pop(s, col, sx, sy) { pops.push({ s, col: col || PAL.white, x: sx == null ? W / 2 : sx, y: sy == null ? SKY_Y - 34 : sy, t: 0 }); }
function burst(sx, sy, col, n, spd) {          // little square particles
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(20, spd || 70);
    parts.push({ x: sx, y: sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.6), t: 0, col });
  }
}
function puff(n) {                             // dust behind Sky's feet
  for (let i = 0; i < n; i++) parts.push({ x: W / 2 + (sky.x - G.camX) + rand(-3, 3), y: SKY_Y + rand(-1, 2), vx: rand(-12, 12), vy: sky.v * 0.6 + rand(0, 30), life: rand(0.2, 0.4), t: 0, col: '#5d5a78' });
}
const skyScreen = () => [W / 2 + (sky.x - G.camX), SKY_Y];   // Sky's spot on screen

// Sky takes a real hit (car or barrier)
function hurt() {
  if (sky.inv > 0) return;
  sky.stun = 0.55; sky.inv = 1.5; sky.v *= 0.2; sky.hits++;
  sky.boost = 0;
  G.shake = 0.35; sfx('hit'); rumble(0.9, 0.6, 260);
  const lost = Math.min(sky.sparks, 5);        // drop some sparks
  sky.sparks -= lost;
  const [sx, sy] = skyScreen();
  burst(sx, sy - 8, PAL.teal, 6 + lost * 2, 90);
  pop(lost ? 'OUCH! -' + lost : 'OUCH!', PAL.red);
}

function updateSky(dt) {
  const p = clamp(sky.th / THETA_FIN, 0, 1);
  // --- sideways movement ---
  let ax = inp.ax;
  if (sky.stun > 0) ax *= 0.3;
  sky.vx += (ax * 100 - sky.vx) * Math.min(1, dt * (sky.slip > 0 ? 2 : 14));
  if (sky.slip > 0) { sky.vx += sky.slipDir * 150 * dt; sky.slip -= dt; }   // skidding on glitch
  sky.x += sky.vx * dt;
  if (sky.x < -SKY_LIMIT) { sky.x = -SKY_LIMIT; sky.vx = 0; }
  if (sky.x > SKY_LIMIT) { sky.x = SKY_LIMIT; sky.vx = 0; }
  // --- forward speed ---
  const base = 150 + 18 * p;                   // a little faster deeper in
  const wantDash = inp.sprint && !sky.tired && sky.stun <= 0;
  let target = base;
  if (wantDash) target = base + 80;
  if (inp.brake) target = base * 0.55;
  if (sky.boost > 0) { target = Math.max(target, 310); sky.boost -= dt; }
  if (sky.stun > 0) { target = 25; sky.stun -= dt; }
  sky.v += (target - sky.v) * Math.min(1, dt * (sky.v < target ? 2.4 : 4));
  // --- dash meter ---
  if (wantDash && sky.boost <= 0) {
    sky.sprint -= 0.34 * dt;
    if (sky.sprint <= 0) { sky.sprint = 0; sky.tired = true; sfx('tired'); }
  } else {
    sky.sprint = Math.min(1, sky.sprint + 0.16 * dt);
    if (sky.tired && sky.sprint > 0.35) sky.tired = false;
  }
  // --- jumping ---
  if (pressed('jump') && sky.z <= 0 && sky.stun <= 0) { sky.vz = 155; sfx('jump'); }
  if (sky.z > 0 || sky.vz > 0) {
    sky.z += sky.vz * dt; sky.vz -= 540 * dt;
    if (sky.z <= 0) { sky.z = 0; sky.vz = 0; sfx('land'); puff(4); }
  }
  // --- run forward along the spiral ---
  sky.th += sky.v / rArm(sky.th) * dt;
  sky.anim += sky.v * dt / 9;                  // next run frame every 9px
  if (sky.inv > 0) sky.inv -= dt;
  if (sky.z === 0 && sky.v > 185 && Math.random() < dt * 22) puff(1);
}

// Cars: oncoming ones on the left lanes, slower same-direction ones on the right
function spawnCar(dir) {
  const r = rArm(sky.th), ahead = 250;
  const th = sky.th + ahead / r;
  if (th > THETA_FIN - 0.05) return;           // none past the finish
  const lane = dir < 0 ? pick([-30, -10]) : pick([10, 30]);
  if (cars.some(c => Math.abs(c.x - lane) < 14 && Math.abs(c.th - th) * r < 70)) return;   // lane busy
  const p = clamp(sky.th / THETA_FIN, 0, 1);
  cars.push({
    th, x: lane, lane, dir,
    v: dir < 0 ? rand(60, 85) + 35 * p : rand(70, 105),
    paint: (Math.random() * CARS.length) | 0,
    blink: 0, toLane: lane,
    changeT: dir > 0 && p > 0.3 && Math.random() < 0.4 ? rand(0.4, 2.2) : -1,   // will change lanes
  });
}
function updateCars(dt, spawn) {
  const p = clamp(sky.th / THETA_FIN, 0, 1);
  if (spawn) {
    carTimerOn -= dt;
    if (carTimerOn <= 0) { spawnCar(-1); carTimerOn = lerp(3.2, 1.05, p) * rand(0.6, 1.4); }
    carTimerSame -= dt;
    if (carTimerSame <= 0) { spawnCar(1); carTimerSame = lerp(4.0, 2.0, p) * rand(0.6, 1.4); }
  }
  for (const c of cars) {
    c.th += c.dir * c.v / rArm(c.th) * dt;     // drive along the road
    if (c.changeT > 0) {                       // blinker on, then switch lanes
      c.changeT -= dt;
      if (c.changeT <= 0) { c.toLane = c.lane === 10 ? 30 : 10; c.blink = 0.7; }
    }
    if (c.blink > 0) { c.blink -= dt; if (c.blink <= 0) c.lane = c.toLane; }
    c.x += (c.lane - c.x) * Math.min(1, dt * 2.5);
  }
  const r = rArm(sky.th);
  cars = cars.filter(c => { const d = (c.th - sky.th) * r; return d > -140 && d < 420; });
}

// Touching things
function collide() {
  const r = rArm(sky.th);
  while (G.obIdx < obstacles.length && (obstacles[G.obIdx].th - sky.th) * r < -110) G.obIdx++;   // skip far-behind
  const [sx, sy] = skyScreen();
  for (let i = G.obIdx; i < obstacles.length; i++) {
    const o = obstacles[i];
    const dS = (o.th - sky.th) * r;            // along-road distance (+ = ahead)
    if (dS > 24) break;
    if (!o.alive || dS < -24) continue;
    const dx = Math.abs(o.x - sky.x);
    switch (o.type) {
      case 'spark':
        if (Math.abs(dS) < 8 && dx < 9 && sky.z < 12) {
          o.alive = false; sky.sparks++; sky.sprint = Math.min(1, sky.sprint + 0.03);
          sfx('spark'); burst(sx + (o.x - sky.x), sy - 6, PAL.teal, 5, 50);
        }
        break;
      case 'aspark':
        if (Math.abs(dS) < 9 && dx < 10 && Math.abs(sky.z - o.z) < 10) {
          o.alive = false; sky.sparks += 5; sfx('big');
          burst(sx + (o.x - sky.x), sy - 6 - o.z, PAL.pink, 8, 70); pop('+5', PAL.pink, sx, sy - 40);
        }
        break;
      case 'clock':
        if (Math.abs(dS) < 8 && dx < 9 && sky.z < 12) {
          o.alive = false; G.time += 2; sfx('clock'); pop('+2 SEC', PAL.yellow);
          burst(sx + (o.x - sky.x), sy - 6, PAL.yellow, 8, 60);
        }
        break;
      case 'cone':
        if (sky.z < 5 && Math.abs(dS) < 5 && dx < 7) {
          o.alive = false;                     // cone goes flying
          o.fly = { x: 0, y: 0, z: 0, vx: (o.x >= sky.x ? 1 : -1) * rand(50, 110), vy: -sky.v * 0.5, vz: 120, rot: 0, t: 0 };
          sky.v *= 0.6; G.shake = Math.max(G.shake, 0.12); sfx('cone'); rumble(0.3, 0.3, 90);
        }
        break;
      case 'bar':
        if (sky.z < 8 && Math.abs(dS) < 5 && dx < 8) hurt();
        break;
      case 'pud':
        if (sky.z < 2 && Math.abs(dS) < 6 && dx < 11 && sky.slip <= 0) {
          sky.slip = 0.55; sky.slipDir = Math.random() < 0.5 ? -1 : 1; sky.v *= 0.85; sfx('slip');
        }
        break;
      case 'boost':
        if (sky.z < 3 && Math.abs(dS) < 8 && dx < 9 && !o.used) {
          o.used = true; sky.boost = 1.0; sfx('boost'); rumble(0.2, 0.5, 120);
        }
        break;
    }
  }
  for (const c of cars) {                      // hover cars always hurt
    if (Math.abs((c.th - sky.th) * r) < 13 && Math.abs(c.x - sky.x) < 10) hurt();
  }
}

// Checkpoints, laps, finish
function progress() {
  if (G.nextCP < checkpoints.length && sky.th >= checkpoints[G.nextCP].th) {
    const c = checkpoints[G.nextCP];
    c.passed = true; G.time += c.bonus; G.nextCP++;
    sfx('check'); pop('CHECKPOINT +' + c.bonus.toFixed(1), PAL.teal, W / 2, 96);   // below the lap banner
  }
  const lap = lapOf(sky.th);
  if (lap !== G.lap && sky.th > 0) {
    G.lap = lap; G.banner = { a: 'LAP ' + (lap + 1) + '/' + LAPS, b: DISTRICTS[lap], t: 0 };
    sfx('lap');
  }
  if (sky.th >= THETA_FIN) finish();
}
function finish() {
  G.state = 'win'; G.menu = 0; G.menuT = 0;
  const total = arcLen(THETA_FIN);             // rank against par paces
  const t = G.runTime;
  G.rank = t < total / 192 ? 'S' : t < total / 178 ? 'A' : t < total / 165 ? 'B' : 'C';
  G.newBest = !bestTime || t < bestTime;
  if (G.newBest) { bestTime = t; try { localStorage.setItem('scr_best', String(t)); } catch (e) {} }
  musicStop(); sfx('win'); rumble(0.4, 0.8, 300);
  tempoMul = 1;
}
function timeUp() {
  G.time = 0; G.state = 'over'; G.menu = 0; G.menuT = 0;
  musicStop(); sfx('timeup'); rumble(0.6, 0.3, 400);
  tempoMul = 1;
}
function fmtTime(s) {                          // 83.4 -> "1:23.4"
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
}

function updateCamera(dt) {
  G.camX += (sky.x * 0.35 - G.camX) * Math.min(1, dt * 5);   // follow Sky sideways a little
  const th = sky.th, x = G.camX;
  const r = rArm(th) - x, c = Math.cos(th), s = Math.sin(th);
  cam.px = CX + r * c; cam.py = CY + r * s; cam.th = th;
  const fx = -B * c - r * s, fy = -B * s + r * c;   // road direction here
  cam.rho = -Math.PI / 2 - Math.atan2(fy, fx);     // turn the world so that direction is "up"
  cam.cos = Math.cos(cam.rho); cam.sin = Math.sin(cam.rho);
  if (G.shake > 0) { G.shake -= dt; G.sx = rand(-1, 1) * G.shake * 10; G.sy = rand(-1, 1) * G.shake * 10; }
  else { G.sx = G.sy = 0; }
}
// Map image position -> screen position, through the rotating camera
function toScreen(wx, wy) {
  const dx = wx - cam.px, dy = wy - cam.py;
  return [W / 2 + dx * cam.cos - dy * cam.sin + G.sx, SKY_Y + dx * cam.sin + dy * cam.cos + G.sy];
}
const roadScreen = (th, x) => toScreen(...worldPoint(th, x));

// Menus shared by pause / time up / finish
const MENUS = { pause: ['RESUME', 'RESTART', 'QUIT TO TITLE'], over: ['TRY AGAIN', 'TITLE'], win: ['RUN AGAIN', 'TITLE'] };
function menuInput(items, onPick) {
  if (pressed('up')) { G.menu = (G.menu + items.length - 1) % items.length; sfx('menu'); }
  if (pressed('down')) { G.menu = (G.menu + 1) % items.length; sfx('menu'); }
  if (pressed('confirm')) { sfx('select'); onPick(items[G.menu]); }
}
function toTitle() { G.state = 'title'; musicStop(); musicStart(); musicVolume(0.45); tempoMul = 1; }

function update(dt) {
  G.t += dt;
  if (pressed('mute')) {                       // music on/off from anywhere
    musicOn = !musicOn;
    try { localStorage.setItem('scr_music', musicOn ? 'on' : 'off'); } catch (e) {}
    musicVolume(G.state === 'pause' ? 0.18 : 0.55); toast(musicOn ? 'MUSIC ON' : 'MUSIC OFF');
  }
  switch (G.state) {
    case 'loading':
      genStep(24);
      if (gen.done) G.state = 'title';
      return;
    case 'title':
      if (pressed('confirm') || pressed('pause')) { sfx('select'); startRun(); }
      return;
    case 'count': {
      G.count -= dt;
      const n = Math.ceil(G.count - 0.2);      // 3, 2, 1
      if (n !== G.lastCount && n >= 1 && n <= 3) { G.lastCount = n; sfx('count'); }
      if (G.count <= 0.2 && G.lastCount !== 0) { G.lastCount = 0; G.state = 'play'; sfx('go'); }
      updateCars(dt, false);
      break;
    }
    case 'play':
      if (pressed('pause')) { pauseGame(); return; }
      G.time -= dt; G.runTime += dt;
      updateSky(dt); updateCars(dt, true); collide(); progress();
      if (G.state === 'play') {
        const hurry = G.time < 10;             // last ten seconds: faster music + ticks
        if (hurry !== G.hurry) { G.hurry = hurry; tempoMul = hurry ? 1.14 : 1; }
        if (hurry && Math.ceil(G.time) !== G.lastTick) { G.lastTick = Math.ceil(G.time); sfx('tick'); }
        if (G.time <= 0) timeUp();
      }
      break;
    case 'pause':
      if (pressed('back') || pressed('pause')) { G.state = 'play'; musicVolume(0.55); sfx('select'); return; }
      menuInput(MENUS.pause, it => {
        if (it === 'RESUME') { G.state = 'play'; musicVolume(0.55); }
        else if (it === 'RESTART') startRun();
        else toTitle();
      });
      return;
    case 'over':
      G.menuT += dt;
      sky.v = Math.max(0, sky.v - 240 * dt);   // Sky jogs to a stop
      sky.th += sky.v / rArm(sky.th) * dt; sky.anim += sky.v * dt / 9;
      updateCars(dt, false);
      if (G.menuT > 1) menuInput(MENUS.over, it => it === 'TRY AGAIN' ? startRun() : toTitle());
      break;
    case 'win':
      G.menuT += dt;
      sky.v = sky.th < THETA_END - 0.05 ? 150 : Math.max(0, sky.v - 300 * dt);   // jog into the plaza
      sky.x += (0 - sky.x) * Math.min(1, dt * 2);
      sky.th += sky.v / rArm(sky.th) * dt; sky.anim += sky.v * dt / 9;
      updateCars(dt, false);
      if (Math.random() < dt * 30) burst(rand(0, W), rand(0, H * 0.6), pick([PAL.teal, PAL.pink, PAL.yellow, PAL.blue]), 1, 40);
      if (G.menuT > 1.6) menuInput(MENUS.win, it => it === 'RUN AGAIN' ? startRun() : toTitle());
      break;
  }
  // things that animate in every in-game state
  updateCamera(dt);
  for (const o of obstacles) if (o.fly) {      // flying cones
    const f = o.fly; f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.vz -= 400 * dt; f.rot += dt * 14;
    if (f.t > 1.2) o.fly = null;
  }
  parts = parts.filter(q => { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.t < q.life; });
  pops = pops.filter(q => { q.t += dt; q.y -= 22 * dt; return q.t < 1.1; });
  if (sky.v > 205 || sky.boost > 0) {          // speed lines at the screen edges
    if (Math.random() < dt * 40) streaks.push({ x: Math.random() < 0.5 ? rand(4, 50) : rand(206, 252), y: rand(-20, H), len: rand(8, 18) });
  }
  streaks = streaks.filter(s => { s.y += 520 * dt; return s.y < H + 20; });
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 2.6) G.banner = null; }
}

// ---------------------------------------------------------------------
// 9. DRAWING
// ---------------------------------------------------------------------
// 50% dither overlay (checkerboard of dark pixels) for dimming the screen
const DITHER = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 2;
  const g = c.getContext('2d'); g.fillStyle = '#05050a'; g.fillRect(0, 0, 1, 1); g.fillRect(1, 1, 1, 1);
  return c;
})();
function dim(ctx, x, y, w, h) {
  ctx.save(); ctx.fillStyle = ctx.createPattern(DITHER, 'repeat'); ctx.fillRect(x, y, w, h); ctx.restore();
}
// A chunky 16-bit window box
function box(ctx, x, y, w, h, edge) {
  ctx.fillStyle = PAL.void; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = edge || PAL.teal; ctx.fillRect(x + 1, y + 1, w - 2, 1); ctx.fillRect(x + 1, y + h - 2, w - 2, 1);
  ctx.fillRect(x + 1, y + 1, 1, h - 2); ctx.fillRect(x + w - 2, y + 1, 1, h - 2);
  ctx.fillStyle = '#1a1830'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
}

function drawSky(ctx) {
  let [sx, sy] = skyScreen();
  sx = Math.round(sx + G.sx); sy = Math.round(sy + G.sy);
  ctx.drawImage(SHADOW_SKY, sx - 6, sy - 3);   // shadow stays on the ground
  if (sky.inv > 0 && ((G.t * 16) | 0) % 2) return;   // flicker while invincible
  let spr = SKY_IDLE;
  if (sky.stun > 0) spr = SKY_HURT;
  else if (sky.z > 0) spr = SKY_JUMP;
  else if (sky.v > 5) spr = SKY_RUN[(sky.anim | 0) & 3];
  const lift = Math.round(sky.z * 0.9);
  const s = 1 + sky.z / 80;                    // a bit bigger in the air = closer to the camera
  const w = Math.round(16 * s), h = Math.round(20 * s);
  const top = sy - h + 2 - lift;
  ctx.drawImage(spr, sx - (w >> 1), top, w, h);
  // the pink scarf tails flutter down her back; longer when she's fast
  const len = 3 + Math.min(7, sky.v / 35) | 0;
  for (const side of [-1, 1]) {
    for (let i = 0; i < len; i++) {
      const wob = Math.round(Math.sin(G.t * 14 + i * 0.9 + side) * Math.min(2, i * 0.45));
      ctx.fillStyle = i === len - 1 ? '#b02a88' : PAL.pink;
      ctx.fillRect(sx + (side < 0 ? -2 : 1) + wob, top + Math.round(8 * s) + i, 1, 1);
    }
  }
}

function drawCar(ctx, c, sx, sy) {
  const spr = c.dir > 0 ? CARS[c.paint].up : CARS[c.paint].down;
  const rot = c.th - sky.th;                   // the road bends: tilt the car with it
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(sy));
  if (Math.abs(rot) > 0.02) ctx.rotate(rot);
  ctx.drawImage(SHADOW_CAR, -8 + 3, -12 + 4);  // shadow offset = it hovers
  ctx.drawImage(GLOW_CAR, -10, -13);           // teal underglow
  if (c.dir < 0) ctx.drawImage(BEAM, -11, 8);  // oncoming headlights reach toward Sky
  ctx.drawImage(spr, -7, -13);                 // the car body, lifted 3px
  if (c.blink > 0 && ((G.t * 8) | 0) % 2) {    // turn signal
    ctx.fillStyle = PAL.yellow;
    const right = c.toLane > c.lane;
    ctx.fillRect(right ? 6 : -8, -12, 2, 2); ctx.fillRect(right ? 6 : -8, 5, 2, 2);
  }
  ctx.restore();
}

// Checkpoint / goal gate: two pylons and a glowing banner over the road
function drawGate(ctx, th, label, colA, colB) {
  const [lx, ly] = roadScreen(th, -49), [rx, ry] = roadScreen(th, 49);
  const lift = 13;
  // banner: thick line from pylon top to pylon top, striped
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(rx - lx), Math.abs(ry - ly))));
  for (let i = 0; i <= n; i++) {
    const x = Math.round(lx + (rx - lx) * i / n), y = Math.round(ly + (ry - ly) * i / n) - lift;
    ctx.fillStyle = PAL.void; ctx.fillRect(x, y - 3, 1, 6);
    ctx.fillStyle = ((i / 6) | 0) % 2 ? colB : colA; ctx.fillRect(x, y - 2, 1, 4);
  }
  for (const [x, y] of [[lx, ly], [rx, ry]]) { // pylons
    const px = Math.round(x), py = Math.round(y);
    ctx.fillStyle = PAL.void; ctx.fillRect(px - 2, py - lift - 3, 5, lift + 4);
    ctx.fillStyle = '#55506e'; ctx.fillRect(px - 1, py - lift - 2, 3, lift + 2);
    ctx.fillStyle = colA; ctx.fillRect(px - 1, py - lift - 4, 3, 2);
  }
  text(ctx, label, (lx + rx) / 2, (ly + ry) / 2 - lift - 12, colA, 1, 'center', null, PAL.void);
}

// Pulsing rings of light around the Core (seen near the end)
function drawCoreGlow(ctx) {
  const [cx, cy] = toScreen(CX, CY);
  if (cx < -120 || cx > W + 120 || cy < -120 || cy > H + 120) return;
  for (let k = 0; k < 3; k++) {
    const rr = 40 + ((G.t * 30 + k * 30) % 90);
    ctx.fillStyle = k % 2 ? PAL.pink : PAL.teal;
    const steps = Math.ceil(rr * 2.2);
    for (let i = 0; i < steps; i += 2) {       // dotted ring
      const a = i / steps * TAU;
      ctx.fillRect(Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr), 1, 1);
    }
  }
}

function drawWorld(ctx) {
  ctx.fillStyle = '#0c1233'; ctx.fillRect(0, 0, W, H);   // bay color past the map edge
  // the whole city, turned so the road ahead points up (Mode 7 style)
  ctx.save();
  ctx.translate(W / 2 + G.sx, SKY_Y + G.sy);
  ctx.rotate(cam.rho);
  ctx.drawImage(mapCanvas, -cam.px, -cam.py);
  ctx.restore();
  if (sky.th > THETA_END - TAU) drawCoreGlow(ctx);
  const r = rArm(sky.th);
  const flat = [], list = [];                  // ground decals first, then everything by depth
  for (let i = G.obIdx; i < obstacles.length; i++) {
    const o = obstacles[i];
    const d = (o.th - sky.th) * r;
    if (d > 250) break;
    if (!o.alive && !o.fly) continue;
    const [sx, sy] = roadScreen(o.th, o.x);
    if (o.type === 'pud' || o.type === 'boost') flat.push([o, sx, sy]); else list.push({ y: sy, o, sx, sy });
  }
  for (const c of cars) {
    const d = (c.th - sky.th) * r;
    if (d < -80 || d > 300) continue;
    const [sx, sy] = roadScreen(c.th, c.x);
    list.push({ y: sy + 6, car: c, sx, sy });
  }
  list.push({ y: SKY_Y + 0.5, sky: true });
  // decals
  for (const [o, sx, sy] of flat) {
    if (o.type === 'pud') ctx.drawImage(PUDDLE[((G.t * 6) | 0) % 3], Math.round(sx) - 11, Math.round(sy) - 5);
    else ctx.drawImage(BOOST[((G.t * 10) | 0) % 3], Math.round(sx) - 8, Math.round(sy) - 8);
  }
  // sprites, far (top) to near (bottom)
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.sky) { drawSky(ctx); continue; }
    if (it.car) { drawCar(ctx, it.car, it.sx, it.sy); continue; }
    const o = it.o, sx = Math.round(it.sx), sy = Math.round(it.sy);
    const bob = Math.round(Math.sin(G.t * 5 + o.th * 40) * 1.5);
    switch (o.type) {
      case 'spark': ctx.drawImage(SPARK_T[((G.t * 6 + o.x + 100) | 0) & 1], sx - 3, sy - 6 + bob); break;   // & 1 keeps the frame 0/1 even for left lanes
      case 'aspark':
        ctx.drawImage(SHADOW_SKY, sx - 6, sy - 2);
        ctx.drawImage(SPARK_P[((G.t * 8) | 0) % 2], sx - 3, sy - 4 - o.z + bob); break;
      case 'clock': ctx.drawImage(CLOCK, sx - 4, sy - 7 + bob); break;
      case 'bar': ctx.drawImage(BARRIER, sx - 5, sy - 4); break;
      case 'cone':
        if (o.fly) {                           // tumbling through the air
          const f = o.fly;
          ctx.save(); ctx.translate(sx + Math.round(f.x), sy + Math.round(f.y) - Math.round(Math.max(0, f.z))); ctx.rotate(f.rot);
          ctx.drawImage(CONE, -3, -3); ctx.restore();
        } else ctx.drawImage(CONE, sx - 3, sy - 4);
        break;
    }
  }
  // checkpoint gates and the goal
  for (const c of checkpoints) {
    const d = (c.th - sky.th) * r;
    if (d > -60 && d < 260) drawGate(ctx, c.th, c.passed ? 'NICE!' : 'CHECK', c.passed ? PAL.pink : PAL.teal, PAL.void);
  }
  const dg = (THETA_FIN - sky.th) * r;
  if (dg > -80 && dg < 280) drawGate(ctx, THETA_FIN, 'GOAL', PAL.yellow, PAL.white);
  // particles + speed lines
  for (const q of parts) { ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); }
  ctx.fillStyle = '#8a86a3';
  for (const s of streaks) ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, Math.round(s.len));
}

function drawHUD(ctx) {
  // time left (top-left), red and flashing in the last 10 seconds
  text(ctx, 'TIME', 8, 6, PAL.yellow, 1, 'left', null, PAL.void);
  const low = G.time < 10;
  const tcol = low && ((G.t * 4) | 0) % 2 ? PAL.red : PAL.white;
  text(ctx, Math.max(0, G.time).toFixed(1), 8, 15, tcol, 2, 'left', null, PAL.void);   // outlined so rooftops don't hide it
  // lap (top-center)
  text(ctx, 'LAP ' + (G.lap + 1) + '/' + LAPS, W / 2, 6, PAL.teal, 1, 'center', null, PAL.void);
  // sparks + run time (top-right)
  ctx.drawImage(SPARK_T[0], W - 46, 5);
  text(ctx, 'x' + String(sky.sparks).padStart(3, '0'), W - 8, 6, PAL.white, 1, 'right', null, PAL.void);
  text(ctx, fmtTime(G.runTime), W - 8, 16, PAL.grey, 1, 'right', null, PAL.void);
  // dash meter (bottom-left)
  text(ctx, 'DASH', 8, H - 14, sky.tired ? PAL.pink : PAL.teal, 1, 'left', null, PAL.void);
  ctx.fillStyle = PAL.void; ctx.fillRect(34, H - 15, 44, 9);
  ctx.fillStyle = '#2a2838'; ctx.fillRect(35, H - 14, 42, 7);
  const fillCol = sky.tired ? (((G.t * 6) | 0) % 2 ? PAL.pink : '#6a1f55') : (sky.boost > 0 ? PAL.yellow : PAL.teal);
  ctx.fillStyle = fillCol; ctx.fillRect(35, H - 14, Math.round(42 * sky.sprint), 7);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(35, H - 14, Math.round(42 * sky.sprint), 1);
  // minimap (bottom-right) with Sky's blinking dot
  if (minimap) {
    ctx.drawImage(minimap, W - 50, H - 50);
    const [mx, my] = miniPos(clamp(sky.th, THETA_START, THETA_END), 0);
    if (((G.t * 4) | 0) % 2 === 0) { ctx.fillStyle = PAL.white; ctx.fillRect(W - 50 + mx - 1, H - 50 + my - 1, 3, 3); }
    ctx.fillStyle = PAL.yellow; ctx.fillRect(W - 50 + mx, H - 50 + my, 1, 1);
  }
  // lap banner sliding in
  if (G.banner) {
    const b = G.banner, t = b.t;
    const slide = t < 0.25 ? (1 - t / 0.25) * W : t > 2.3 ? -((t - 2.3) / 0.3) * W : 0;
    const bw = Math.max(textW(b.b, 2), textW(b.a)) + 24;
    box(ctx, Math.round(W / 2 - bw / 2 + slide), 34, bw, 32, PAL.pink);
    text(ctx, b.a, W / 2 + slide, 39, PAL.yellow, 1, 'center');
    text(ctx, b.b, W / 2 + slide, 49, PAL.white, 2, 'center');
  }
  // floating messages
  for (const p of pops) {
    if (p.t > 0.8 && ((p.t * 16) | 0) % 2) continue;
    text(ctx, p.s, p.x, Math.round(p.y), p.col, 1, 'center', null, PAL.void);
  }
}

function drawMenu(ctx, items, y) {
  items.forEach((it, i) => {
    const sel = i === G.menu;
    text(ctx, it, W / 2, y + i * 13, sel ? PAL.yellow : PAL.grey, 1, 'center');
    if (sel && ((G.t * 3) | 0) % 2 === 0) text(ctx, '>', W / 2 - textW(it) / 2 - 10, y + i * 13, PAL.yellow);
  });
}

function drawTitle(ctx) {
  ctx.fillStyle = PAL.void; ctx.fillRect(0, 0, W, H);
  if (overview) {                              // the whole spiral city, slowly turning
    ctx.save();
    ctx.translate(W / 2, H / 2 + 58);
    ctx.rotate(G.t * 0.12);
    const s = 1.05;
    ctx.drawImage(overview, -overview.width / 2 * s, -overview.height / 2 * s, overview.width * s, overview.height * s);
    ctx.restore();
  }
  dim(ctx, 0, 0, W, 112);                      // darken behind the logo
  ctx.fillStyle = 'rgba(5,5,10,0.5)'; ctx.fillRect(0, 0, W, 112);
  text(ctx, 'SPIRAL CITY', W / 2, 18, PAL.pink, 2, 'center', null, PAL.void);
  const wob = Math.round(Math.sin(G.t * 3) * 2);
  text(ctx, 'RUN', W / 2 + 3, 39 + wob + 3, PAL.teal, 5, 'center', null, null);   // teal drop shadow
  text(ctx, 'RUN', W / 2, 39 + wob, PAL.yellow, 5, 'center', null, PAL.void);
  text(ctx, 'RACE THE SPIRAL TO THE CORE', W / 2, 84, PAL.white, 1, 'center');
  if (bestTime) text(ctx, 'BEST ' + fmtTime(bestTime), W / 2, 97, PAL.teal, 1, 'center');
  // Sky running in place, big
  const f = SKY_RUN[((G.t * 10) | 0) & 3];
  ctx.drawImage(SHADOW_SKY, W / 2 - 12, 150, 24, 8);
  ctx.drawImage(f, W / 2 - 16, 116, 32, 40);
  if (((G.t * 2) | 0) % 2 === 0) text(ctx, 'PRESS START', W / 2, 166, PAL.yellow, 1, 'center', null, PAL.void);
  box(ctx, 8, 174, W - 16, 38, PAL.purple);   // controls card
  text(ctx, 'MOVE  ARROWS / STICK', 16, 180, PAL.white);
  text(ctx, 'JUMP  SPACE / A', 16, 190, PAL.white);
  text(ctx, 'DASH  SHIFT / X', 16, 200, PAL.white);
  text(ctx, 'PAUSE ESC', 140, 180, PAL.grey);
  text(ctx, 'MUSIC M', 140, 190, PAL.grey);
  text(ctx, padIndex >= 0 ? 'PAD READY' : 'PAD? PRESS A', 140, 200, padIndex >= 0 ? PAL.teal : PAL.grey);
  text(ctx, 'QUARTERBITGAMES', W / 2, 215, '#5d5a78', 1, 'center', null);
}

function drawLoading(ctx) {
  ctx.fillStyle = PAL.void; ctx.fillRect(0, 0, W, H);
  text(ctx, 'BUILDING SPIRAL CITY', W / 2, 96, PAL.teal, 1, 'center');
  const p = gen.row / MAP;
  box(ctx, 48, 110, 160, 12, PAL.purple);
  ctx.fillStyle = PAL.pink; ctx.fillRect(51, 113, Math.round(154 * p), 6);
  text(ctx, Math.round(p * 100) + '%', W / 2, 130, PAL.grey, 1, 'center');
}

function render(ctx) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (G.state === 'loading') drawLoading(ctx);
  else if (G.state === 'title') drawTitle(ctx);
  else {
    drawWorld(ctx);
    drawHUD(ctx);
    if (G.state === 'count') {                 // 3 2 1 GO
      const n = Math.ceil(G.count - 0.2);
      if (n >= 1) text(ctx, String(n), W / 2, 70, PAL.yellow, 5, 'center', null, PAL.void);
    }
    if (G.state === 'play' && G.runTime < 0.8) text(ctx, 'GO!', W / 2, 70, PAL.teal, 5, 'center', null, PAL.void);
    if (G.state === 'pause') {
      dim(ctx, 0, 0, W, H);
      box(ctx, 56, 60, 144, 88, PAL.teal);
      text(ctx, 'PAUSED', W / 2, 70, PAL.white, 2, 'center');
      drawMenu(ctx, MENUS.pause, 96);
      text(ctx, musicOn ? 'MUSIC ON  (M)' : 'MUSIC OFF (M)', W / 2, 136, PAL.dim, 1, 'center');
    }
    if (G.state === 'over') {
      dim(ctx, 0, 0, W, H);
      text(ctx, 'TIME UP!', W / 2, 52, PAL.red, 3, 'center', null, PAL.void);
      const pct = Math.round(clamp(sky.th / THETA_FIN, 0, 1) * 100);
      box(ctx, 40, 86, 176, 74, PAL.red);
      text(ctx, 'MADE IT TO', W / 2, 94, PAL.grey, 1, 'center');
      text(ctx, DISTRICTS[G.lap], W / 2, 105, PAL.white, 1, 'center');
      text(ctx, pct + '% OF THE WAY IN', W / 2, 116, PAL.teal, 1, 'center');
      if (G.menuT > 1) drawMenu(ctx, MENUS.over, 132);
    }
    if (G.state === 'win') {
      if (G.menuT > 0.6) {
        dim(ctx, 0, 0, W, H);
        text(ctx, 'CORE REACHED!', W / 2, 26, PAL.teal, 2, 'center', null, PAL.void);
        box(ctx, 28, 50, 200, 122, PAL.yellow);
        text(ctx, 'TIME', 44, 62, PAL.grey); text(ctx, fmtTime(G.runTime), 150, 62, PAL.white, 1, 'right');
        text(ctx, 'SPARKS', 44, 74, PAL.grey); text(ctx, String(sky.sparks), 150, 74, PAL.white, 1, 'right');
        text(ctx, 'HITS', 44, 86, PAL.grey); text(ctx, String(sky.hits), 150, 86, PAL.white, 1, 'right');
        text(ctx, 'BEST', 44, 98, PAL.grey); text(ctx, fmtTime(bestTime), 150, 98, PAL.teal, 1, 'right');
        text(ctx, 'RANK', 186, 60, PAL.grey, 1, 'center');
        const rc = { S: PAL.pink, A: PAL.yellow, B: PAL.teal, C: PAL.blue }[G.rank];
        text(ctx, G.rank, 186, 72, rc, 4, 'center', null, PAL.void);
        if (G.newBest && ((G.t * 4) | 0) % 2 === 0) text(ctx, 'NEW BEST!', W / 2, 112, PAL.pink, 1, 'center');
        if (G.menuT > 1.6) drawMenu(ctx, MENUS.win, 132);
      }
    }
  }
  if (G.toast) {                               // small message top-center
    G.toast.t += 1 / 60;
    if (G.toast.t > 1.8) G.toast = null;
    else { const w = textW(G.toast.s) + 12; box(ctx, W / 2 - w / 2, H - 30, w, 15, PAL.blue); text(ctx, G.toast.s, W / 2, H - 26, PAL.white, 1, 'center'); }
  }
}

// ---------------------------------------------------------------------
// 10. MAIN LOOP + DISPLAY
//     The game draws into a 256x224 buffer. That buffer is stretched to the
//     window at 4:3, exactly how an SNES picture looked on a TV.
// ---------------------------------------------------------------------
const screenCv = document.getElementById('screen');
const sctx = screenCv.getContext('2d');
const bufCv = document.createElement('canvas');
bufCv.width = W; bufCv.height = H;
const bctx = bufCv.getContext('2d');
bctx.imageSmoothingEnabled = false;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  let h = innerHeight, w = h * 4 / 3;          // 4:3 TV shape
  if (w > innerWidth) { w = innerWidth; h = w * 3 / 4; }
  screenCv.style.width = Math.floor(w) + 'px'; screenCv.style.height = Math.floor(h) + 'px';
  screenCv.width = Math.round(Math.floor(w) * dpr); screenCv.height = Math.round(Math.floor(h) * dpr);
}
addEventListener('resize', fit);
fit();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);   // cap big gaps (tab switches)
  last = now;
  pollInput();
  update(dt);
  render(bctx);
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(bufCv, 0, 0, screenCv.width, screenCv.height);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
screenCv.focus();
</script>
