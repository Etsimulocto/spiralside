  body { display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none; }

  #screen { display:block; image-rendering:pixelated; image-rendering:crisp-edges; outline:none; }
</style>

<body>
<canvas id="screen" tabindex="0"></canvas>
<script>
'use strict';
// =====================================================================
//  SPIRAL CITY RUN  -  a QuarterbitGames original
//  Top-down 16-bit runner. Spiral City is one road that winds inward to
//  the Core. The camera turns the city under Sky (like SNES Mode 7) so
//  she always runs "up" the screen while the turns get tighter.
//
//  One file, no build step, no assets required. Everything (map, sprites,
//  font, music, sound) is generated in code.
//
//  Layout of this file:
//    1. constants + spiral math
//    2. helpers (colors, hashing, dithering)
//    3. pixel font
//    4. sprites (Sky, cars, props)
//    5. city map generator
//    6. audio (music sequencer + sound effects)
//    7. input (keyboard + gamepad)
//    8. game state, course building, update
//    9. drawing (world, HUD, screens)
//   10. main loop + display scaling
// =====================================================================

// ---------------------------------------------------------------------
// 1. CONSTANTS + SPIRAL MATH
// ---------------------------------------------------------------------
const TAU = Math.PI * 2;                       // a full turn in radians
const W = 256, H = 224;                        // real SNES resolution
const R0 = 1060;                               // radius where the road starts (outer edge of the city)
const PITCH = 176;                             // distance between one lap of road and the next, in pixels
const B = PITCH / TAU;                         // spiral tightness: radius lost per radian travelled
const ROAD_HALF = 44;                          // half the road width (road is 88px wide, 4 lanes)
const SIDEWALK = 8;                            // sidewalk width each side of the road
const LANES = [-30, -10, 10, 30];              // lane centers. negative = left (oncoming), positive = right
const SKY_LIMIT = 38;                          // how far Sky can move left/right from the road center
const R_PLAZA = 150;                           // radius of the Core plaza in the middle of the city
const THETA_START = -1.4;                      // road begins a bit "before" angle 0 (the bridge in)
const THETA_END = (R0 - R_PLAZA) / B;          // angle where the road reaches the plaza (about 5.2 laps)
const THETA_FIN = THETA_END - 0.3;             // the finish line, just before the plaza
const R_COAST = R0 + 68;                       // the island's shoreline; water outside this
const MAP = Math.ceil((R_COAST + 200) * 2 / 8) * 8;   // size of the generated city image (square)
const CX = MAP / 2, CY = MAP / 2;              // city center inside that image
const SKY_Y = 166;                             // where Sky stands on screen (lower half, so you see ahead)
const LAPS = Math.ceil(THETA_FIN / TAU);       // number of laps from start to finish (6)
const DISTRICTS = ['OUTER DOCKS', 'NEON MARKET', 'SIGNAL HEIGHTS', 'BLOOM GARDENS', 'THE COIL', 'THE CORE'];

// Radius of the road's center line at spiral angle th
const rArm = th => R0 - B * th;
// Distance along the road (in pixels) from angle 0 to angle th
const arcLen = th => R0 * th - B * th * th / 2;
// Inverse of arcLen: which angle is S pixels down the road
const thetaAt = S => (R0 - Math.sqrt(R0 * R0 - 2 * B * S)) / B;
// World position (inside the map image) of a point on the road.
// x is the sideways offset: positive = toward the city center (screen right)
function worldPoint(th, x) {
  const r = rArm(th) - x;                      // actual radius of that point
  return [CX + r * Math.cos(th), CY + r * Math.sin(th)];
}
// Which lap (0-based) a road angle belongs to
const lapOf = th => Math.max(0, Math.min(LAPS - 1, Math.floor(th / TAU)));

// ---------------------------------------------------------------------
// 2. HELPERS
// ---------------------------------------------------------------------
// "#rrggbb" -> one 32-bit pixel value in canvas memory order (ABGR, little endian)
function px32(hex) {
  const n = parseInt(hex.slice(1), 16);        // the 24-bit color number
  const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (255 << 24 | b << 16 | g << 8 | r) >>> 0;
}
// Lighten (+) or darken (-) a "#rrggbb" color by amt (0-255 steps)
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, v + amt));
  const r = c(n >> 16 & 255), g = c(n >> 8 & 255), b = c(n & 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
// Fast integer hash -> number 0..1. Same input always gives the same output,
// so the city looks identical every time it is generated.
function hash(n) {
  n = (n ^ 61) ^ (n >>> 16);
  n = (n + (n << 3)) | 0;
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}
// Hash of two integers
const hash2 = (a, b) => hash(Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663));
// 4x4 ordered-dither matrix, the classic 16-bit way to fake gradients
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
// Small math helpers
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

// Bloomcore palette, used everywhere
const PAL = {
  void: '#101014', teal: '#00F6D6', blue: '#4DA3FF', pink: '#FF4BCB',
  yellow: '#FFD93D', white: '#F3F7FF', purple: '#7B5FFF', red: '#FF4B5C',
  grey: '#8a86a3', dim: '#5d5a78',
};

// ---------------------------------------------------------------------
// 3. PIXEL FONT (5x7, drawn from bits, cached per color)
// ---------------------------------------------------------------------
// Each entry: the character, then 7 rows encoded as one base-32 digit each
// (a 5-bit row). Generated from a readable table; see README.
const FONT_SRC = "AEHHVHHH|BUHHUHHU|CEHGGGHE|DUHHHHHU|EVGGUGGV|FVGGUGGG|GEHGNHHF|HHHHVHHH|IE44444E|J72222IC|KHIKOKIH|LGGGGGGV|MHRLLHHH|NHHPLJHH|OEHHHHHE|PUHHUGGG|QEHHHLID|RUHHUKIH|SFGGE11U|TV444444|UHHHHHHE|VHHHHHA4|WHHHLLLA|XHHA4AHH|YHHA4444|ZV1248GV|0EHJLPHE|14C4444E|2EH1248V|3V2421HE|426AIV22|5VGU11HE|668GUHHE|7V124888|8EHHEHHE|9EHHF12C|:0CC0CC0|.00000CC|!4444404|?EH12404|-000V000|+044V440|/122488G|'4480000|,0000C48|>8421248|<248G842|x00HA4AH|(2488842|)8422248|*4LEVEL4|=00V0V00|%OP248J3|#AAVAVAA|^4EL4440";
const B32 = '0123456789ABCDEFGHIJKLMNOPQRSTUV';
const GLYPHS = {};                             // char -> array of 7 row bitmasks
const GLYPH_ORDER = [];                        // chars in sheet order
FONT_SRC.split('|').forEach(e => {
  GLYPHS[e[0]] = [...e.slice(1)].map(c => B32.indexOf(c));
  GLYPH_ORDER.push(e[0]);
});
const fontCache = {};                          // color -> canvas holding every glyph in that color
function fontSheet(color) {
  if (fontCache[color]) return fontCache[color];
  const c = document.createElement('canvas');
  c.width = GLYPH_ORDER.length * 6; c.height = 7;
  const g = c.getContext('2d');
  g.fillStyle = color;
  GLYPH_ORDER.forEach((ch, i) => {             // paint each glyph's lit bits
    GLYPHS[ch].forEach((row, y) => {
      for (let x = 0; x < 5; x++) if (row & (16 >> x)) g.fillRect(i * 6 + x, y, 1, 1);
    });
  });
  return (fontCache[color] = c);
}
// Pixel width of a string at a given scale
const textW = (s, sc = 1) => s.length * 6 * sc - sc;
// Draw text. align: 'left' | 'center' | 'right'. shadow: color for a 1px drop shadow,
// or 'outline' style via outline color (draws all 8 neighbors)
function text(ctx, s, x, y, color, sc = 1, align = 'left', shadow = PAL.void, outline = null) {
  s = String(s).toUpperCase().replace(/X(?=\d)/g, 'x');   // keep "x" glyph for counts like x12
  const w = textW(s, sc);
  if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  const put = (col, ox, oy) => {               // one pass of the whole string in one color
    const sheet = fontSheet(col);
    for (let i = 0; i < s.length; i++) {
      const gi = GLYPH_ORDER.indexOf(s[i] === 'x' ? 'x' : s[i]);
      if (gi < 0) continue;                    // spaces and unknown chars are just gaps
      ctx.drawImage(sheet, gi * 6, 0, 5, 7, x + ox + i * 6 * sc, y + oy, 5 * sc, 7 * sc);
    }
  };
  if (outline) {                               // thick outline: draw around in 8 directions
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) if (ox || oy) put(outline, ox * sc, oy * sc);
  } else if (shadow) put(shadow, sc, sc);      // simple drop shadow
  put(color, 0, 0);
}

// ---------------------------------------------------------------------
// 4. SPRITES
// ---------------------------------------------------------------------
// Turn a list of strings + a palette into a canvas. '.' = transparent.
function spriteFrom(rows, pal) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.' || !pal[ch]) return;
    g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
// Build a sprite from a grid of palette indexes, then add a dark outline
// around everything (the 16-bit "sticker" look).
function spriteFromGrid(grid, w, h, colors) {
  const out = grid.slice();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (grid[y * w + x]) continue;             // only empty pixels can become outline
    const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < w && yy < h && grid[yy * w + xx] > 1;
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) out[y * w + x] = 1;
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let i = 0; i < w * h; i++) if (out[i]) {
    g.fillStyle = colors[out[i]]; g.fillRect(i % w, (i / w) | 0, 1, 1);
  }
  return c;
}

// --- SKY (our runner), seen from behind and above, 16x20 ---
// Palette slots: 1 outline, 2 hair, 3 hair shine, 4 skin, 5 jacket, 6 jacket shade,
// 7 pants, 8 shoes, 9 scarf, 10 scarf dark, 11 hair dark
const SKY_COLORS = [null, '#101014', '#00F6D6', '#9ffff2', '#f0c39b', '#F3F7FF', '#a9b5d6', '#2b3a6b', '#FFD93D', '#FF4BCB', '#b02a88', '#00a896'];
// legL / legR: how far each leg reaches below the jacket. armL / armR: arm swing
// (negative = forward/up). pose: 'run' | 'jump' | 'hurt'
function makeSky(legL, legR, armL, armR, pose) {
  const w = 16, h = 20, grid = new Array(w * h).fill(0);
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < w && y < h) grid[y * w + x] = c; };
  // legs first (they sit under the jacket)
  const leg = (x0, len) => {
    for (let y = 12; y < 13 + len; y++) { set(x0, y, 7); set(x0 + 1, y, 7); }
    set(x0, 13 + len, 8); set(x0 + 1, 13 + len, 8);          // yellow shoes
  };
  leg(5, legL); leg(9, legR);
  // arms: 2px wide jacket sleeves with a skin-colored hand on the end
  const arm = (x0, swing) => {
    if (pose === 'hurt') {                     // arms flung out sideways
      const dir = x0 < 8 ? -1 : 1;
      for (let i = 0; i < 3; i++) { set(x0 + dir * i, 8, 5); set(x0 + dir * i, 9, 6); }
      set(x0 + dir * 3, 8, 4); set(x0 + dir * 3, 9, 4);
      return;
    }
    const top = 8 + swing, bot = 11 + swing;
    for (let y = top; y <= bot; y++) { set(x0, y, 5); set(x0 + 1, y, 6); }
    const hy = swing < 0 ? top - 1 : bot + 1; // hand at the leading end
    set(x0, hy, 4); set(x0 + 1, hy, 4);
  };
  arm(2, armL); arm(12, armR);
  // jacket body (rows 7-12)
  for (let y = 7; y <= 12; y++) for (let x = 4; x <= 11; x++) {
    let c = 5;                                 // white jacket
    if (x === 4 || x === 11 || y === 12) c = 6;   // shaded edges and hem
    if (x === 7 && y >= 9) c = 6;              // back seam
    set(x, y, c);
  }
  set(4, 7, 0); set(11, 7, 0);                 // round off the shoulders
  // pink scarf wrapped around the neck
  for (let x = 5; x <= 10; x++) { set(x, 6, 9); set(x, 7, x % 2 ? 9 : 10); }
  // head: teal hair seen from behind, with a shine
  // big squarish chibi head (16-bit proportions): row widths from top to bottom
  const HEAD = [[5, 10], [4, 11], [4, 11], [4, 11], [4, 11], [5, 10]];
  HEAD.forEach(([x0, x1], y) => {
    for (let x = x0; x <= x1; x++) {
      let c = 2;                               // teal hair
      if (y <= 1 && x <= 7) c = 3;             // shine on the top-left
      if (y >= 4 || x === x1) c = 11;          // darker underside and right side
      if (y === 5 && (x === 6 || x === 9)) c = 2;   // a few strands catching light
      set(x, y, c);
    }
  });
  set(3, 3, 4); set(12, 3, 4);                 // ears peeking out
  set(8, 0, 2); set(9, 0, 3);                  // little cowlick on top
  return spriteFromGrid(grid, w, h, SKY_COLORS);
}
// Four running frames (legs and arms swap), plus jump and hurt
const SKY_RUN = [
  makeSky(1, 4, -2, 1, 'run'),
  makeSky(2, 3, -1, 0, 'run'),
  makeSky(4, 1, 1, -2, 'run'),
  makeSky(3, 2, 0, -1, 'run'),
];
const SKY_JUMP = makeSky(0, 0, -3, -3, 'run');
const SKY_HURT = makeSky(2, 2, 0, 0, 'hurt');
const SKY_IDLE = makeSky(2, 2, 0, 0, 'run');

// --- HOVER CARS, 14x21, front at the top ---
const CAR_ROWS = [
  '...kkkkkkkk...',
  '..kLbbbbbbLk..',
  '.kbbbbbbbbbbk.',
  '.kbbbbbbbbbbk.',
  'kbBggggggggBbk',
  'kbBgGggggggBbk',
  'kbBggggggggBbk',
  'kbbbbbbbbbbbbk',
  'kbBbbbssbbbBbk',
  'kbBbbbssbbbBbk',
  'kbBbbbssbbbBbk',
  'kbBbbbssbbbBbk',
  'kbBbbbssbbbBbk',
  'kbbbbbbbbbbbbk',
  'kbBggggggggBbk',
  'kbBggggggggBbk',
  'kbbbbbbbbbbbbk',
  '.kbbbbbbbbbbk.',
  '.kbbbbbbbbbbk.',
  '..kRbbbbbbRk..',
  '...kkkkkkkk...',
];
// Body color, shade, stripe for each paint job
const CAR_PAINTS = [
  ['#FF4BCB', '#b02a88', '#F3F7FF'],
  ['#4DA3FF', '#2a5fa8', '#FFD93D'],
  ['#FFD93D', '#b8962a', '#101014'],
  ['#7B5FFF', '#4b38a8', '#00F6D6'],
  ['#F3F7FF', '#a9b3cc', '#FF4BCB'],
  ['#00F6D6', '#009e8a', '#101014'],
];
// Each paint job gets an "up" version (same direction as Sky) and a flipped
// "down" version (oncoming, headlights facing Sky)
const CARS = CAR_PAINTS.map(([b, s, st]) => {
  const pal = { k: '#101014', b, B: s, s: st, g: '#1b2340', G: '#8fb4ff', L: '#fff6c8', R: '#FF4B5C' };
  const up = spriteFrom(CAR_ROWS, pal);
  const down = document.createElement('canvas');   // vertical flip
  down.width = up.width; down.height = up.height;
  const dg = down.getContext('2d'); dg.translate(0, up.height); dg.scale(1, -1); dg.drawImage(up, 0, 0);
  return { up, down };
});

// --- PROPS ---
const CONE = spriteFrom([
  '.kkkkk.',
  'kOoooOk',
  'kowwwok',
  'kowowok',
  'kowwwok',
  'kOoooOk',
  '.kkkkk.',
], { k: '#101014', o: '#ff8a2a', O: '#b8541a', w: '#F3F7FF' });
const BARRIER = spriteFrom([
  'kkkkkkkkkk',
  'kyyddyyddk',
  'kyddyyddyk',
  'kddyyddyyk',
  'kkkkkkkkkk',
  '.kk....kk.',
], { k: '#101014', y: '#FFD93D', d: '#2a2833' });
// Bloom spark (2 animation frames). c = main color slot
function sparkSprite(main, bright) {
  const pal = { w: '#F3F7FF', c: main, C: bright, W: '#ffffff', k: '#101014' };
  return [
    spriteFrom(['...w...', '..wcw..', '.wcCcw.', 'wcCWCcw', '.wcCcw.', '..wcw..', '...w...'], pal),
    spriteFrom(['.......', '...w...', '..wCw..', '.wCWCw.', '..wCw..', '...w...', '.......'], pal),
  ];
}
const SPARK_T = sparkSprite('#00F6D6', '#9ffff2');   // teal = 1 point
const SPARK_P = sparkSprite('#FF4BCB', '#ffb3ea');   // pink = 5 points (air sparks)
const CLOCK = spriteFrom([
  '..kkkkk..',
  '.kyyyyyk.',
  'kyywkwyyk',
  'kyyykyyyk',
  'kyyykkkyk',
  'kyyyyyyyk',
  'kyywyyyyk',
  '.kyyyyyk.',
  '..kkkkk..',
], { k: '#101014', y: '#FFD93D', w: '#F3F7FF' });
// Boost pad: dark plate with teal chevrons; 2 frames so the arrows "run"
function boostSprite(phase) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  g.fillStyle = '#101014'; g.fillRect(0, 0, 16, 16);
  g.fillStyle = '#1d2a33'; g.fillRect(1, 1, 14, 14);
  for (let i = 0; i < 3; i++) {                // three stacked chevrons ^
    const y0 = 2 + i * 5;
    g.fillStyle = (i + phase) % 3 === 0 ? '#ffffff' : '#00F6D6';
    for (let k = 0; k < 6; k++) {              // each chevron is two diagonal strokes
      g.fillRect(8 - 1 - k, y0 + k * 0.6 + 0 | 0, 1, 2);
      g.fillRect(8 + k, y0 + k * 0.6 + 0 | 0, 1, 2);
    }
  }
  return c;
}
const BOOST = [boostSprite(0), boostSprite(1), boostSprite(2)];
// Glitch puddle: shimmering neon oil, 22x10, 3 frames
function puddleSprite(phase) {
  const c = document.createElement('canvas'); c.width = 22; c.height = 10;
  const g = c.getContext('2d');
  const cols = ['#2a1f4a', '#7B5FFF', '#FF4BCB', '#4DA3FF', '#00F6D6'];
  for (let y = 0; y < 10; y++) for (let x = 0; x < 22; x++) {
    const dx = (x - 10.5) / 11, dy = (y - 4.5) / 5;
    const d = dx * dx + dy * dy;
    if (d > 1) continue;                       // outside the oval
    let ci = d > 0.75 ? 0 : 1 + ((x + y * 2 + phase * 2) >> 2) % 4;   // diagonal neon bands
    if (d > 0.75 && (x + y) % 2) ci = 1;       // dithered rim
    g.fillStyle = cols[ci]; g.fillRect(x, y, 1, 1);
  }
  return c;
}
const PUDDLE = [puddleSprite(0), puddleSprite(1), puddleSprite(2)];
// Dithered oval (every other pixel) - the 16-bit way to fake see-through glow/shadow
function ditherOval(w, h, color, solidCore) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = color;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (x + 0.5 - w / 2) / (w / 2), dy = (y + 0.5 - h / 2) / (h / 2);
    const d = dx * dx + dy * dy;
    if (d > 1) continue;
    if (d < solidCore || (x + y) % 2 === 0) g.fillRect(x, y, 1, 1);
  }
  return c;
}
const SHADOW_SKY = ditherOval(12, 5, '#06060a', 0.35);    // Sky's shadow on the ground
const SHADOW_CAR = ditherOval(16, 24, '#06060a', 0.3);    // hover car shadow
const GLOW_CAR = ditherOval(20, 27, '#00F6D6', 0);        // teal underglow
// Headlight beam for oncoming cars: dithered yellow wedge pointing down the screen
const BEAM = (() => {
  const c = document.createElement('canvas'); c.width = 22; c.height = 40;
  const g = c.getContext('2d'); g.fillStyle = '#fff6c8';
  for (let y = 0; y < 40; y++) {
    const half = 4 + y * 0.18;                 // wedge widens as it goes
    for (let x = 0; x < 22; x++) {
      if (Math.abs(x + 0.5 - 11) > half) continue;
      const keep = y < 14 ? (x + y) % 2 === 0 : (x % 2 === 0 && y % 2 === 0);  // fades out
      if (keep) g.fillRect(x, y, 1, 1);
    }
  }
  return c;
})();

// ---------------------------------------------------------------------
// 5. CITY MAP GENERATOR
//    Every pixel of the city is decided by math: which lap of road is
//    nearest, how far from its center, which block, which building.
// ---------------------------------------------------------------------
// Roof colors for each district (one district per lap)
const DIST_ROOFS = [
  ['#3b4a55', '#4a3d36', '#2f4148', '#45484f'],   // OUTER DOCKS: steel and rust
  ['#4a2f5a', '#3a2f63', '#5a2f4a', '#33284f'],   // NEON MARKET: purples
  ['#2c3c66', '#26345a', '#34466e', '#3a3a62'],   // SIGNAL HEIGHTS: blues
  ['#2f4a3f', '#3a4a36', '#2c3f4a', '#45403a'],   // BLOOM GARDENS: greens
  ['#26262f', '#2c2438', '#212c32', '#322a3a'],   // THE COIL: near-black
  ['#4a4a62', '#545472', '#3e4a66', '#5a5070'],   // THE CORE: silver
];
const DIST_NEON = [['#4DA3FF', '#FFD93D'], ['#FF4BCB', '#7B5FFF'], ['#FFD93D', '#4DA3FF'], ['#00F6D6', '#FFD93D'], ['#00F6D6', '#FF4BCB'], ['#F3F7FF', '#00F6D6']];
const DIST_LIT = ['#FFD93D', '#FF4BCB', '#4DA3FF', '#FFD93D', '#00F6D6', '#00F6D6'];
const DIST_PARK = [0.05, 0.06, 0.06, 0.32, 0.04, 0.12];   // chance a block is a park
// Pre-packed roof shades: highlight edge, base, shadow edge, gravel dither
const ROOF = DIST_ROOFS.map(list => list.map(h => ({
  hi: px32(shadeHex(h, 26)), base: px32(h), lo: px32(shadeHex(h, -24)), dith: px32(shadeHex(h, -11)),
})));
const NEON32 = DIST_NEON.map(p => p.map(px32));
const NEON32_DIM = DIST_NEON.map(p => p.map(h => px32(shadeHex(h, -90))));
const LIT32 = DIST_LIT.map(px32);
// Every other fixed color the city uses, pre-packed
const Q = {
  outline: px32('#121019'), alley: px32('#17151f'),
  asph: px32('#25232f'), asphSpeck: px32('#2d2b39'), gutter: px32('#1d1b26'),
  asphLit: px32('#3a3650'), asphLitSpeck: px32('#45405e'),
  laneLine: px32('#8d8aa6'), edgeLine: px32('#b9b6d0'), yellowLine: px32('#c9a227'),
  startA: px32('#F3F7FF'), startB: px32('#101014'), cpA: px32('#00F6D6'), cpB: px32('#007a6b'),
  rail: px32('#8a86a3'),
  curb: px32('#6e6a86'), walk: px32('#3b3850'), walkLit: px32('#55506e'), walkSeam: px32('#302d42'),
  post: px32('#101014'), lamp: px32('#FFE98A'),
  water: px32('#0c1233'), wave: px32('#1d2f63'), waveDim: px32('#142050'), foam: px32('#5a7ab0'),
  seawall: px32('#5a566e'),
  plazaA: px32('#3a3650'), plazaB: px32('#433e5c'), plazaSeam: px32('#2c2940'), inlay: px32('#0f6f66'),
  plazaWall: px32('#6e6a86'),
  coreRing: px32('#00F6D6'), coreDark: px32('#16161f'), corePink: px32('#FF4BCB'), coreWhite: px32('#F3F7FF'),
  glass: px32('#1b2238'), ac: px32('#6e6b84'), acDark: px32('#4a475c'), fan: px32('#2a2838'),
  tank: px32('#7a5a40'), tankDark: px32('#4e3828'),
  heli: px32('#3a3a48'), heliRing: px32('#c9c6dd'), heliH: px32('#FFD93D'),
  grass: px32('#1f3d2a'), grassD: px32('#23452f'), treeD: px32('#173322'), treeL: px32('#3c8a4a'), tree: px32('#2a5e36'),
  path: px32('#4a4560'), hedge: px32('#14301e'),
  lot: px32('#2a2833'), stall: px32('#6e6a86'),
  tileA: px32('#3c3852'), tileB: px32('#423d5a'), fountain: px32('#2f7fbf'), fountainHi: px32('#9fd8ff'),
  yard: px32('#2f2d3a'), ware: px32('#44465a'), wareRidge: px32('#55576e'), wareDark: px32('#383a4c'),
};
const CONTAINERS = ['#8a4a3a', '#2a5a8a', '#2a7a70', '#a88a2a', '#7a3a6a'].map(h => [px32(h), px32(shadeHex(h, -30))]);
const CAR32 = CAR_PAINTS.map(p => px32(p[0]));

// Brightness (0..1+) of streetlight pools at road distance s, sideways x.
// Lights stand every 48px, alternating sides of the road.
function lightLevel(s, x) {
  let best = 0;
  const k0 = Math.round(s / 48);
  for (let k = k0 - 1; k <= k0 + 1; k++) {
    const lx = (k & 1) ? 49 : -49;             // which side this lamp is on
    const ds = s - k * 48, dx = x - lx;
    const d = Math.sqrt(ds * ds + dx * dx);
    if (d < 30) best = Math.max(best, (1 - d / 30) * 1.15);
  }
  return best;
}

// The road surface, its paint, the bridge and the special lines
function roadPixel(px, py, th, x, ax, r) {
  const sR = th * rArm(th);                    // distance along the road (for dashes)
  if (r > R_COAST - 4 && ax > 41) return ax > 43 ? Q.outline : Q.rail;   // bridge railings
  const dStart = arcLen(th);                   // start line at distance 0
  if (Math.abs(dStart) < 4) return ((Math.floor(ax / 3) + Math.floor((dStart + 4) / 3)) & 1) ? Q.startA : Q.startB;
  const dFin = (th - THETA_FIN) * rArm(th);    // finish line
  if (Math.abs(dFin) < 4) return ((Math.floor(ax / 3) + Math.floor((dFin + 4) / 3)) & 1) ? Q.startA : Q.startB;
  const cpK = Math.round(th / Math.PI);        // checkpoint lines every half lap
  if (cpK >= 1 && th < THETA_FIN - 0.4) {
    const dc = (th - cpK * Math.PI) * rArm(th);
    if (Math.abs(dc) < 1.3) return (Math.floor(ax / 4) & 1) ? Q.cpA : Q.cpB;
  }
  if (Math.abs(ax - 1.5) < 0.55) return Q.yellowLine;        // double yellow center line
  if (Math.abs(ax - 40) < 0.6) return Q.edgeLine;            // solid white edge lines
  if (Math.abs(ax - 20) < 0.55 && (((sR % 22) + 22) % 22) < 11) return Q.laneLine;   // dashed lane lines
  const speck = hash2(px, py) > 0.93;          // asphalt grit
  if (lightLevel(sR, x) > bayer(px, py)) return speck ? Q.asphLitSpeck : Q.asphLit;  // dithered lamp light
  if (ax > 41) return Q.gutter;                // dark gutter at the road edge
  return speck ? Q.asphSpeck : Q.asph;
}

// Sidewalks with curbs, tile seams and streetlight posts
function sidewalkPixel(px, py, th, x, ax) {
  if (ax <= ROAD_HALF + 2) return Q.curb;
  const s = th * rArm(th);
  const k = Math.round(s / 48), lx = (k & 1) ? 49 : -49;
  if (Math.sign(lx) === Math.sign(x) && Math.abs(s - k * 48) < 1.6 && Math.abs(x - lx) < 1.6) {
    return (Math.abs(s - k * 48) < 0.6 && Math.abs(x - lx) < 0.6) ? Q.lamp : Q.post;   // lamp head
  }
  if ((((s % 8) + 8) % 8) < 1) return Q.walkSeam;
  if (lightLevel(s, x) > bayer(px, py) + 0.15) return Q.walkLit;
  return Q.walk;
}

// The bay around the island: waves, foam, city-light reflections
function waterPixel(px, py, r) {
  if (r < R_COAST + 2) return Q.foam;
  const w = Math.sin(px * 0.23 + Math.sin(py * 0.07) * 2.2) + Math.sin(py * 0.19 + px * 0.05);   // small ripples
  if (w > 1.6) return Q.wave;
  if (r < R_COAST + 40 && hash2(px, py) > 0.992) return NEON32[(px + py) % 6][py & 1];   // reflections
  if (w > 1.15 && ((px ^ py) & 1)) return Q.waveDim;
  return Q.water;
}

// The Core plaza in the middle, with the Core itself at the very center
function plazaPixel(px, py, r, ang) {
  if (r > R_PLAZA - 3) return Q.plazaWall;
  if (r < 40) {                                // the Core
    if (r > 36) return Q.coreRing;
    if (r > 33) return Q.outline;
    if (r < 4) return Q.coreWhite;
    const f = (r / 9 + ang / TAU) % 1;         // a pink spiral painted on the Core
    return f < 0.2 ? Q.corePink : Q.coreDark;
  }
  if ((((r / 30 - ang / TAU) % 1) + 1) % 1 < 0.05) return Q.inlay;   // teal spiral inlay in the tiles
  if (((ang * 32 / TAU) % 1) < 0.06) return Q.plazaSeam;              // radial seams
  return (Math.floor(r / 10) & 1) ? Q.plazaA : Q.plazaB;              // tile rings
}

// Parks: grass, hedges, a path and trees
function parkPixel(px, py, u, v, L, D) {
  if (u === 0 || v === 0 || u === L - 1 || v === D - 1) return Q.hedge;
  if (Math.abs(v - D / 2) < 1) return Q.path;
  const gx = Math.floor(px / 9), gy = Math.floor(py / 9);
  const h = hash2(gx + 7, gy + 3);
  if (h > 0.35) {                              // a tree in this little cell
    const tx = gx * 9 + 4.5 + (hash2(gx, gy) - 0.5) * 2, ty = gy * 9 + 4.5 + (hash2(gy, gx) - 0.5) * 2;
    const dx = px + 0.5 - tx, dy = py + 0.5 - ty, d = dx * dx + dy * dy;
    if (d < 11) return (dx + dy < -2) ? Q.treeL : (d > 7 ? Q.treeD : Q.tree);
  }
  return ((px + py) & 1) && hash2(px, py) > 0.6 ? Q.grassD : Q.grass;
}

// Parking lots: stalls and a few parked cars
function lotPixel(px, py, u, v, L, D, cell, row) {
  if (u === 0 || v === 0 || u === L - 1 || v === D - 1) return Q.outline;
  const top = v < D * 0.38, bot = v > D * 0.62;
  if (!top && !bot) return Q.lot;              // driving aisle
  if (u % 7 === 0) return Q.stall;             // stall lines
  const slot = (u / 7) | 0;
  if (hash2(cell * 3 + row, slot + (top ? 0 : 50)) > 0.45 && u % 7 >= 2 && u % 7 <= 5) {
    const inner = top ? v >= 3 && v <= D * 0.38 - 2 : v >= D * 0.62 + 2 && v <= D - 4;
    if (inner) return CAR32[(hash2(cell, slot) * CAR32.length) | 0];
  }
  return Q.lot;
}

// Little paved squares with a fountain
function squarePixel(px, py, u, v, L, D) {
  if (u === 0 || v === 0 || u === L - 1 || v === D - 1) return Q.outline;
  const dx = u - L / 2, dy = v - D / 2, d = Math.sqrt(dx * dx + dy * dy);
  if (d < 7) return d > 5.5 ? Q.plazaWall : (((u + v) & 3) === 0 ? Q.fountainHi : Q.fountain);
  return ((u >> 2) + (v >> 2)) & 1 ? Q.tileA : Q.tileB;
}

// A building rooftop: outline, lit edges, neon sign, AC units, tanks, skylights...
function roofPixel(px, py, u, v, L, D, h, dist, row, cell, big) {
  const pal = ROOF[dist][(h * 1000 | 0) % 4];
  if (u === 0 || v === 0 || u === L - 1 || v === D - 1) return Q.outline;
  // neon sign along the edge that faces the road
  const rv = big ? Math.min(v, D - 1 - v) : (row === 1 ? D - 1 - v : v);
  const h2 = hash(cell * 13 + row * 5 + 1);
  const signLen = 8 + ((h2 * 100) | 0) % 16;
  if (h2 > 0.42 && (rv === 2 || rv === 3) && u >= 3 && u < 3 + signLen) {
    const col = h2 > 0.72 ? 1 : 0;
    return (u - 3) % 5 === 4 ? NEON32_DIM[dist][col] : NEON32[dist][col];   // letters with gaps
  }
  if (u === 1 || v === 1) return pal.hi;       // lit top-left edge
  if (u === L - 2 || v === D - 2) return pal.lo;   // shadow bottom-right edge
  const h3 = hash(cell * 17 + row * 3 + 5);
  // helipad on big towers
  if (big && h3 > 0.55) {
    const dx = u - L / 2, dy = v - D / 2, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 10) {
      if (d > 8.6) return Q.heliRing;
      if (Math.abs(dy) <= 4 && (Math.abs(Math.abs(dx) - 3) < 0.6 || (Math.abs(dy) < 0.6 && Math.abs(dx) <= 3))) return Q.heliH;
      return Q.heli;
    }
  }
  // rooftop garden
  if (h3 < 0.12 && u > 3 && v > 3 && u < L - 4 && v < D - 4) {
    if ((u + v * 3) % 7 === 0) return Q.treeL;
    return ((u + v) & 1) ? Q.grass : Q.grassD;
  }
  // AC unit
  const ax0 = 4 + ((hash(cell * 3 + row) * (L - 12)) | 0), ay0 = 4 + ((hash(cell * 5 + row + 2) * (D - 10)) | 0);
  if (u >= ax0 && u < ax0 + 6 && v >= ay0 && v < ay0 + 4) {
    if (u === ax0 + 2 && v === ay0 + 1 || u === ax0 + 3 && v === ay0 + 2) return Q.fan;
    return (u === ax0 + 5 || v === ay0 + 3) ? Q.acDark : Q.ac;
  }
  // water tank
  if (h2 < 0.3) {
    const tx = L - 7, ty = 6, dx = u - tx, dy = v - ty, d = dx * dx + dy * dy;
    if (d < 10) return d > 5 ? Q.tankDark : Q.tank;
  }
  // skylight / window grid, some lit
  if (h3 > 0.3 && u >= 4 && u <= L - 5 && v >= 5 && v <= D - 6 && (u - 4) % 5 < 2 && (v - 5) % 5 < 2) {
    const lit = hash2(cell * 31 + (((u - 4) / 5) | 0), row * 97 + (((v - 5) / 5) | 0)) > 0.55;
    return lit ? LIT32[dist] : Q.glass;
  }
  // plain roof with a little gravel dither
  return ((u + v) & 1) === 0 && hash2(px >> 1, py >> 1) > 0.72 ? pal.dith : pal.base;
}

// One block in the ring between two laps of road
function blockPixel(px, py, g, ta) {
  const dist = lapOf(ta);
  if (g > 72) return parkPixel(px, py, 1, 1, 9, 9);   // ring of gardens around the plaza
  const rMid = rArm(ta) - PITCH / 2;
  const s = ta * rMid;                         // position along the ring
  const cell = Math.floor(s / 34);             // which block
  const u = s - cell * 34;                     // position across the block
  const big = hash(cell * 7 + 3) > 0.86;       // some towers fill both rows
  let row, v, D;
  if (big) { row = 2; v = g; D = 73; }
  else if (g < 34) { row = 0; v = g; D = 34; }
  else if (g < 38) return Q.alley;
  else { row = 1; v = g - 38; D = 35; }
  if (u < 3) return Q.alley;                   // alley between blocks
  const u0 = Math.floor(u - 3), vi = Math.floor(v), L = 31;
  const h = hash(cell * 7 + row + 11);
  const pp = DIST_PARK[dist];
  if (h < pp) return parkPixel(px, py, u0, vi, L, D);
  if (h < pp + 0.06) return lotPixel(px, py, u0, vi, L, D, cell, row);
  if (h < pp + 0.09) return squarePixel(px, py, u0, vi, L, D);
  return roofPixel(px, py, u0, vi, L, D, h, dist, row, cell, big);
}

// The docks outside the first lap: container yards and warehouses on a grid
function dockPixel(px, py) {
  const cx = Math.floor(px / 46), cy = Math.floor(py / 30);
  const lx = px - cx * 46, ly = py - cy * 30;
  if (lx < 3 || ly < 3) return Q.alley;
  const u = lx - 3, v = ly - 3, L = 43, D = 27;
  if (u === 0 || v === 0 || u === L - 1 || v === D - 1) return Q.outline;
  const h = hash2(cx + 500, cy + 900);
  if (h < 0.5) {                               // container yard
    const ci = Math.floor((u - 2) / 10), cr = Math.floor((v - 2) / 6);
    const iu = (u - 2) % 10, iv = (v - 2) % 6;
    if (u >= 2 && v >= 2 && iu < 9 && iv < 5 && hash2(cx * 9 + ci, cy * 9 + cr) > 0.25) {
      const col = CONTAINERS[(hash2(ci + cx, cr + cy) * CONTAINERS.length) | 0];
      return (iu % 2 === 0 || iv === 4) ? col[1] : col[0];   // ribbed metal
    }
    return Q.yard;
  }
  if (v % 4 === 0) return Q.wareRidge;         // warehouse roof ridges
  if (u > 4 && u < L - 5 && v % 8 === 2 && u % 6 < 3) return LIT32[0];   // skylights
  return (u + v) % 2 && hash2(px, py) > 0.8 ? Q.wareDark : Q.ware;
}

// The master function: what color is the city at image pixel (px, py)?
function cityPixel(px, py) {
  const dx = px + 0.5 - CX, dy = py + 0.5 - CY;
  const r = Math.sqrt(dx * dx + dy * dy);      // distance from the city center
  let ang = Math.atan2(dy, dx);                // direction from the center
  if (ang < 0) ang += TAU;
  const t = (R0 - r) / B;                      // spiral angle whose road radius equals r
  const k = Math.round((t - ang) / TAU);       // how many laps in
  const th = ang + k * TAU;                    // nearest road's spiral angle
  const x = rArm(th) - r;                      // sideways distance from that road's center
  const ax = Math.abs(x);
  const realRoad = th >= THETA_START && th <= THETA_END;
  if (realRoad && ax <= ROAD_HALF) return roadPixel(px, py, th, x, ax, r);
  if (r > R_COAST) return waterPixel(px, py, r);
  if (r > R_COAST - 3) return Q.seawall;
  if (r < R_PLAZA) return plazaPixel(px, py, r, ang);
  if (realRoad && ax <= ROAD_HALF + SIDEWALK) return sidewalkPixel(px, py, th, x, ax);
  // in the ring of blocks between two laps
  let g, ta;
  if (x > 0) { g = x - (ROAD_HALF + SIDEWALK); ta = th; }          // inward of this road
  else { g = PITCH + x - (ROAD_HALF + SIDEWALK); ta = th - TAU; }  // outward: belongs to the lap before
  if (ta < THETA_START || g < 0) return dockPixel(px, py);         // outside the first lap: the docks
  return blockPixel(px, py, g, ta);
}

// Generation runs a few rows per frame so the page never freezes
const mapCanvas = document.createElement('canvas');
mapCanvas.width = mapCanvas.height = MAP;
const gen = { row: 0, done: false, img: null, buf: null, ctx: null };
let overview = null, minimap = null;           // small versions for the title and HUD
function genStep(budgetMs) {
  if (gen.done) return;
  if (!gen.img) {                              // first call: allocate the pixel buffer
    gen.ctx = mapCanvas.getContext('2d');
    gen.img = gen.ctx.createImageData(MAP, MAP);
    gen.buf = new Uint32Array(gen.img.data.buffer);
  }
  const t0 = performance.now();
  while (gen.row < MAP && performance.now() - t0 < budgetMs) {
    const y = gen.row, o = y * MAP;
    for (let x = 0; x < MAP; x++) gen.buf[o + x] = cityPixel(x, y);
    gen.row++;
  }
  if (gen.row >= MAP) {                        // finished: upload and build the small maps
    gen.ctx.putImageData(gen.img, 0, 0);
    gen.img = gen.buf = null;
    gen.done = true;
    buildOverviews();
  }
}
// Shrink the city in halves (keeps it smooth) for the spinning title backdrop,
// and draw the HUD minimap as a clean pixel spiral
function buildOverviews() {
  let src = mapCanvas;
  while (src.width > 400) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.round(src.width / 2);
    const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, c.width, c.height);
    src = c;
  }
  overview = src;
  minimap = document.createElement('canvas');
  minimap.width = minimap.height = 46;
  const m = minimap.getContext('2d');
  const sc = 21 / R_COAST;                     // world -> minimap scale
  for (let y = 0; y < 46; y++) for (let x = 0; x < 46; x++) {   // dark disc
    const d = Math.hypot(x + 0.5 - 23, y + 0.5 - 23);
    if (d < 22.5) { m.fillStyle = d > 21.5 ? '#3b3850' : ((x + y) & 1 ? '#101014' : '#16141f'); m.fillRect(x, y, 1, 1); }
  }
  m.fillStyle = '#2f6f8a';                     // the road
  for (let th = THETA_START; th <= THETA_END; th += 0.01) {
    const [wx, wy] = worldPoint(th, 0);
    m.fillRect(Math.floor(23 + (wx - CX) * sc), Math.floor(23 + (wy - CY) * sc), 1, 1);
  }
  m.fillStyle = '#FF4BCB'; m.fillRect(22, 22, 2, 2);   // the Core
}
const miniPos = (th, x) => {                   // where a road point lands on the minimap
  const [wx, wy] = worldPoint(th, x), sc = 21 / R_COAST;
  return [Math.floor(23 + (wx - CX) * sc), Math.floor(23 + (wy - CY) * sc)];
};

// ---------------------------------------------------------------------
// 6. AUDIO - a tiny 16-bit style band (pulse lead + echo, arps, triangle
//    bass, noise drums) and all the sound effects. Starts on first input.
// ---------------------------------------------------------------------
let AC = null, master = null, musicBus = null, sfxBus = null, echoIn = null, noiseBuf = null;
const waves = {};                              // custom pulse waveforms
let musicOn = true;
try { musicOn = localStorage.getItem('scr_music') !== 'off'; } catch (e) {}
const mf = n => 440 * Math.pow(2, (n - 69) / 12);   // MIDI note number -> Hz
// A pulse (square-ish) wave with a given duty cycle, built from harmonics
function pulseWave(duty) {
  const n = 48, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
  return AC.createPeriodicWave(re, im);
}
// Create the audio graph (only allowed after the player presses something)
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;                            // very old browser: play silently
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
  musicBus = AC.createGain(); musicBus.gain.value = musicOn ? 0.55 : 0; musicBus.connect(master);
  sfxBus = AC.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
  // SNES-style echo: a filtered feedback delay the lead and arps are sent into
  const delay = AC.createDelay(1); delay.delayTime.value = 0.19;
  const fb = AC.createGain(); fb.gain.value = 0.32;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const wet = AC.createGain(); wet.gain.value = 0.4;
  echoIn = AC.createGain();
  echoIn.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(musicBus);
  // one second of white noise, reused by drums and crunchy effects
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  waves.p25 = pulseWave(0.25); waves.p125 = pulseWave(0.125);
  if (G.state === 'title' || G.state === 'play' || G.state === 'count') musicStart();
}
// Play one note. wave: 'square' | 'triangle' | 'sine' | a PeriodicWave.
// slideTo: optional pitch to glide to. send: optional extra output (echo)
function osc(wave, f, t, dur, vol, out, slideTo, send) {
  const o = AC.createOscillator();
  if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);            // quick attack, decay, release
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(vol * 0.55, t + Math.max(0.012, dur * 0.5));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out);
  if (send) g.connect(send);
  o.start(t); o.stop(t + dur + 0.03);
}
// A burst of filtered noise (drums, crashes, whooshes)
function noise(t, dur, vol, out, type, freq) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(out);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);

// --- the song: "Spiral City Run" theme, 8 bars in A minor, loops ---
const BPM = 148;
const ROOTS = [45, 41, 48, 43, 45, 41, 43, 40];   // bass roots: Am F C G Am F G E
const CHORDS = [[57, 60, 64, 69], [53, 57, 60, 65], [55, 60, 64, 67], [55, 59, 62, 67],
                [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67], [56, 59, 64, 68]];
// Lead melody per bar: [step, note, length in 16ths]
const LEAD_BARS = [
  [[0, 76, 2], [2, 81, 2], [4, 76, 2], [6, 72, 2], [8, 74, 4], [12, 72, 2], [14, 71, 2]],
  [[0, 69, 4], [4, 72, 2], [6, 77, 4], [10, 76, 2], [12, 72, 4]],
  [[0, 67, 2], [2, 72, 2], [4, 76, 2], [6, 79, 4], [10, 76, 2], [12, 74, 2], [14, 72, 2]],
  [[0, 74, 6], [6, 71, 2], [8, 67, 4]],
  [[0, 76, 2], [2, 81, 2], [4, 76, 2], [6, 72, 2], [8, 74, 4], [12, 72, 2], [14, 71, 2]],
  [[0, 69, 2], [2, 72, 2], [4, 77, 2], [6, 81, 4], [10, 79, 2], [12, 77, 2], [14, 76, 2]],
  [[0, 74, 4], [4, 79, 4], [8, 83, 4], [12, 79, 4]],
  [[0, 80, 6], [6, 76, 2], [8, 71, 4], [12, 68, 4]],
];
const LEAD_MAP = {};                           // absolute step (0-127) -> [note, length]
LEAD_BARS.forEach((bar, bi) => bar.forEach(([s, n, l]) => { LEAD_MAP[bi * 16 + s] = [n, l]; }));
let seqStep = 0, seqTime = 0, seqTimer = null, tempoMul = 1;
function musicStart() {
  if (!AC || seqTimer) return;
  seqStep = 0; seqTime = AC.currentTime + 0.08;
  seqTimer = setInterval(seqTick, 25);         // look-ahead scheduler
}
function musicStop() { if (seqTimer) clearInterval(seqTimer); seqTimer = null; }
function musicVolume(v) { if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? v : 0, AC.currentTime, 0.05); }
function seqTick() {
  const sd = 60 / (BPM * tempoMul) / 4;        // length of one 16th note
  while (seqTime < AC.currentTime + 0.12) {

    seqTime += sd; seqStep = (seqStep + 1) % 128;
  }
}
function playStep(i, t, sd) {
  const bar = i >> 4, s = i & 15;
  // drums
  if (s === 0 || s === 8 || (s === 10 && bar % 2 === 1)) {   // kick: sine with a fast pitch drop
    osc('sine', 150, t, 0.13, 0.55, musicBus, 42);
  }
  if (s === 4 || s === 12) {                   // snare: noise + a little tone
    noise(t, 0.12, 0.28, musicBus, 'bandpass', 1900); osc('triangle', 190, t, 0.07, 0.18, musicBus, 120);
  }
  if (s % 2 === 1) noise(t, s === 15 ? 0.06 : 0.03, 0.09, musicBus, 'highpass', 7000);   // hats
  // bass: root / octave bounce, fifth at the end of the bar
  if (s % 2 === 0) {
    const root = ROOTS[bar];
    const n = s === 14 ? root + 7 : (s % 4 === 2 ? root + 12 : root);
    osc('triangle', mf(n), t, sd * 1.8, 0.3, musicBus);
  }
  // arpeggio sparkle
  osc(waves.p125, mf(CHORDS[bar][s % 4] + 12), t, sd * 0.9, 0.032, musicBus, null, echoIn);
  // lead
  const L = LEAD_MAP[i];
  if (L) osc(waves.p25, mf(L[0]), t, sd * L[1] * 0.95, 0.085, musicBus, null, echoIn);
}

// Controller rumble, if the pad supports it
