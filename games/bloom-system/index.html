<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLOOM SYSTEM</title>
<link rel="icon" type="image/png" href="art/icon-64.png">
<link rel="apple-touch-icon" href="art/icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BLOOM SYSTEM (web) - BloomPetz + DND from the Happy Jarz ESP32 box,
   redrawn big for the browser, plus a USB mode that drives the real box.
   ===================================================================== */
:root {
  --bg: #06080b;
  --glass: #020406;
  --oled: #00e5ff;          /* the box's default text color */
  --oled2: #9ff6ff;
  --dim: #4f6b76;
  --line: rgba(0, 229, 255, .28);
  --brass: #c9a24a;
  --copper: #c8743a;
  --pink: #FF4BCB;
  --yellow: #FFD93D;
  --teal: #00F6D6;
  --red: #ff5a6a;
  --green: #7cf08a;
  --purple: #b48cff;
  --font: 'VT323', 'Courier New', monospace;
  --title: 'Silkscreen', 'VT323', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 20%, #10161c, var(--bg) 70%); color: var(--oled); font-family: var(--font); font-size: 21px; overflow: hidden; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
input { font-family: inherit; }
.hidden { display: none !important; }

/* the wood + brass box around the screen */
#frame { height: 100%; max-width: 1340px; margin: 0 auto; display: grid; grid-template-rows: 1fr auto; gap: 10px; padding: 12px; }
#bezel {
  min-height: 0; border-radius: 18px; padding: 14px;
  background: repeating-linear-gradient(92deg, rgba(0,0,0,.08) 0 3px, transparent 3px 11px), linear-gradient(160deg, #6a4428, #46301c 55%, #3a2614);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.6);
}
#glass {
  height: 100%; display: flex; flex-direction: column; background: var(--glass); border: 3px solid var(--brass); border-radius: 10px;
  box-shadow: inset 0 0 40px rgba(0,229,255,.06), 0 0 0 2px #2a1c0e; position: relative; overflow: hidden;
}
#glass::after {             /* faint scanlines */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 3px);
}
#bar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.led { width: 12px; height: 12px; border-radius: 50%; background: #2a1040; box-shadow: 0 0 6px currentColor; transition: background .15s, box-shadow .15s; }
#brand { font-family: var(--title); font-size: 16px; letter-spacing: .12em; color: var(--oled); text-shadow: 0 0 8px rgba(0,229,255,.6); }
#clock { margin-left: auto; color: var(--oled2); }
.tab { background: none; border: 1px solid var(--line); padding: 2px 10px; border-radius: 4px; color: var(--dim); }
.tab.on { color: var(--oled); border-color: var(--oled); box-shadow: 0 0 8px rgba(0,229,255,.35); }
#screen { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px; position: relative; text-shadow: 0 0 6px rgba(0,229,255,.35); }

/* shared bits */
.glow { color: var(--oled2); text-shadow: 0 0 10px rgba(0,229,255,.8); }
.dim { color: var(--dim); }
.btn {
  background: rgba(0,229,255,.05); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; text-align: left;
  transition: background .1s, border-color .1s, box-shadow .1s;
}
.btn:hover { border-color: rgba(0,229,255,.6); }
.btn.sel { background: rgba(0,229,255,.17); border-color: var(--oled2); box-shadow: 0 0 12px rgba(0,229,255,.35); color: var(--oled2); }
.btn.done { border-style: dashed; }
.btn[disabled] { opacity: .4; }
.h1 { font-family: var(--title); font-size: 22px; letter-spacing: .08em; margin: 0 0 8px; }
.h2 { font-family: var(--title); font-size: 15px; letter-spacing: .1em; color: var(--oled2); margin: 0 0 6px; }
.panel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: rgba(0,229,255,.025); }
.hint { color: var(--dim); font-size: 18px; }
.barwrap { height: 12px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: rgba(0,0,0,.4); }
.barwrap i { display: block; height: 100%; background: var(--oled); box-shadow: 0 0 8px var(--oled); }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #031015; border: 1px solid var(--oled); padding: 4px 14px; border-radius: 6px; z-index: 30; box-shadow: 0 0 14px rgba(0,229,255,.4); animation: pop .2s ease-out; }
@keyframes pop { from { transform: translate(-50%, 8px); opacity: 0; } }

/* launcher */
.launch { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.logo { font-family: var(--title); font-size: clamp(28px, 5vw, 54px); letter-spacing: .14em; color: var(--oled2); text-shadow: 0 0 18px rgba(0,229,255,.9); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: 16px; width: 100%; justify-content: center; }
.card { padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 190px; justify-content: center; text-align: center; }
.card .big { font-size: 44px; line-height: 1; white-space: pre; }
.card .t { font-family: var(--title); font-size: 18px; letter-spacing: .1em; }

/* bloompetz */
.pets { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.25fr); gap: 16px; height: 100%; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.petcv { width: min(300px, 70vw); aspect-ratio: 1; image-rendering: pixelated; }
.bubble { min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--oled2); max-width: 90%; text-align: center; }
.art { font-size: 30px; white-space: pre; color: var(--yellow); text-shadow: 0 0 10px rgba(255,217,61,.6); }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.acts .btn { text-align: center; padding: 10px 4px; }
.util { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.util .btn { text-align: center; }
.ticker { margin-top: 10px; color: var(--teal); min-height: 26px; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); gap: 16px; justify-content: center; margin-top: 20px; }
.slot { min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.slot canvas { width: 120px; height: 120px; image-rendering: pixelated; }
.simon { display: flex; flex-direction: column; align-items: center; gap: 14px; height: 100%; justify-content: center; }
.pad4 { display: grid; grid-template-columns: repeat(3, 92px); grid-template-rows: repeat(3, 92px); gap: 8px; }
.pad4 button { border: 2px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.03); font-size: 44px; transition: background .08s, box-shadow .08s; }
.pad4 button.lit { color: #000; text-shadow: none; }
.statgrid { display: grid; grid-template-columns: 260px 1fr; gap: 14px; height: 100%; min-height: 0; }
.catlist { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
.catlist .btn { padding: 3px 10px; display: flex; justify-content: space-between; }
.statrow { display: grid; grid-template-columns: 220px 1fr 110px; gap: 10px; align-items: center; padding: 3px 0; }
.statrow.hot { color: var(--yellow); }
.form { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.form label { display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 10px; }
.form input { background: #031015; border: 1px solid var(--line); color: var(--oled2); font-size: 24px; padding: 4px 10px; border-radius: 4px; outline: none; }
.form input:focus { border-color: var(--oled); box-shadow: 0 0 10px rgba(0,229,255,.35); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .btn { padding: 2px 8px; white-space: pre; }

/* dnd */
.dnd { display: grid; grid-template-columns: 250px 1fr 230px; gap: 12px; height: 100%; min-height: 0; }
.dnd .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
#map { width: 100%; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #010203; }
.feed { flex: 1; min-height: 120px; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
.feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed div:first-child { color: var(--yellow); }
.kv { display: flex; justify-content: space-between; gap: 6px; }
.enemyrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; font-size: 19px; }
.overlay { position: absolute; inset: 0; background: rgba(1,3,5,.86); display: flex; align-items: center; justify-content: center; z-index: 5; padding: 14px; }
.menu { width: min(620px, 100%); max-height: 100%; overflow-y: auto; }
.menu .btn { display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px; gap: 8px; }
.menu .btn small { color: var(--dim); }
.symgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 5px; }
.rar0 { color: var(--oled2); } .rar1 { color: var(--green); } .rar2 { color: #6fb6ff; } .rar3 { color: var(--purple); } .rar4 { color: var(--yellow); }

/* device (USB) */
.devwrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.devoled { background: #000; border: 3px solid #1b2b33; border-radius: 8px; padding: 18px 20px; font-size: clamp(22px, 4.2vw, 46px); line-height: 1.15; white-space: pre; color: var(--oled); text-shadow: 0 0 10px rgba(0,229,255,.8); overflow-x: auto; }
.devlog { max-height: 180px; overflow-y: auto; font-size: 17px; color: var(--dim); white-space: pre-wrap; }

/* the six copper touch pads under the screen */
#pads { display: flex; justify-content: center; gap: 26px; align-items: center; }
.pad {
  width: 58px; height: 58px; border-radius: 50%; border: none; font-size: 26px; color: #2a1608;
  background: radial-gradient(circle at 35% 30%, #f0b27a, #c8743a 55%, #7a3f1a); box-shadow: 0 3px 0 #4a2610, 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 3px rgba(120,190,170,.18);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad.hit { transform: translateY(2px); box-shadow: 0 1px 0 #4a2610, 0 0 14px rgba(255,180,100,.8); }
.dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 4px 6px; }
.dpad .pad:nth-child(1) { grid-column: 2; }
.dpad .pad:nth-child(2) { grid-column: 1; grid-row: 2; }
.dpad .pad:nth-child(3) { grid-column: 2; grid-row: 2; }
.dpad .pad:nth-child(4) { grid-column: 3; grid-row: 2; }
.ab { display: flex; gap: 14px; }
.ab .pad { font-family: var(--title); font-size: 20px; }

@media (max-width: 980px) {
  html, body { overflow: auto; font-size: 19px; }
  #bar { flex-wrap: wrap; gap: 6px 10px; }
  #clock { font-size: 17px; }
  #screen { padding-bottom: 150px; }
  .mapwrap { order: -1; }
  #frame { height: auto; min-height: 100%; padding: 6px; }
  #bezel { padding: 8px; }
  #glass { min-height: 80vh; }
  .pets, .dnd, .statgrid { grid-template-columns: 1fr; height: auto; }
  .cards, .slots { grid-template-columns: 1fr; }
  .card { min-height: 120px; }
  .util { grid-template-columns: repeat(3, 1fr); }
  .statrow { grid-template-columns: 1fr 1fr 90px; }
  #pads { position: sticky; bottom: 0; background: rgba(6,8,11,.9); padding: 6px 0; gap: 14px; }
  .pad { width: 50px; height: 50px; }
  .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); }
}
</style>
</head>
<body>
<div id="frame">
  <div id="bezel">
    <div id="glass">
      <div id="bar">
        <span class="led" id="led1"></span><span class="led" id="led2"></span>
        <span id="brand">BLOOM SYSTEM</span>
        <span id="clock"></span>
        <button class="tab on" id="tabPlay" title="Play in the browser">PLAY</button>
        <button class="tab" id="tabDev" title="Connect the real BloomPetz box over USB">BOX &middot; USB</button>
        <button class="tab" id="tabSnd" title="Sound (M)">&#9835;</button>
      </div>
      <div id="screen"></div>
    </div>
  </div>
  <div id="pads">
    <div class="dpad">
      <button class="pad" data-k="UP">&#9650;</button>
      <button class="pad" data-k="LEFT">&#9664;</button>
      <button class="pad" data-k="DOWN">&#9660;</button>
      <button class="pad" data-k="RIGHT">&#9654;</button>
    </div>
    <div class="ab"><button class="pad" data-k="A">A</button><button class="pad" data-k="B">B</button></div>
  </div>
</div>

function strHash(s) { let h = 2166136261 >>> 0; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }

// Tiny blip sounds
let AC = null, master = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C(); master = AC.createGain(); master.gain.value = SV.sound ? 0.35 : 0; master.connect(AC.destination);
}
function beep(f, dur = 0.08, type = 'square', vol = 0.3, slide) {
  if (!AC || !SV.sound) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const later = (ms, f) => setTimeout(f, ms);
const SFX = {
  move: () => beep(220, 0.03, 'square', 0.06),
  sel: () => beep(660, 0.04, 'square', 0.1),
  ok: () => { beep(784, 0.06); later(60, () => beep(1175, 0.09)); },
  back: () => beep(392, 0.06, 'square', 0.1),
  bad: () => beep(170, 0.14, 'square', 0.2),
  coin: () => { beep(988, 0.05, 'square', 0.14); later(50, () => beep(1319, 0.1, 'square', 0.14)); },
  hit: () => beep(150, 0.12, 'sawtooth', 0.25, 60),
  swing: () => beep(620, 0.05, 'triangle', 0.15, 300),
  level: () => [523, 659, 784, 1047].forEach((f, i) => later(i * 90, () => beep(f, 0.1, 'triangle', 0.25))),
  door: () => beep(330, 0.16, 'triangle', 0.2, 660),

};
function toggleSound() { audioInit(); SV.sound = !SV.sound; if (master) master.gain.value = SV.sound ? 0.35 : 0; save(); $('tabSnd').classList.toggle('on', SV.sound); toast(SV.sound ? 'sound on' : 'sound off'); }

// Input: everything becomes one of the box's six buttons
const KEYMAP = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', KeyA: 'A', KeyZ: 'A', Enter: 'A', Space: 'A', NumpadEnter: 'A', KeyB: 'B', KeyX: 'B', Escape: 'B', Backspace: 'B' };
let MODE = 'play';                              // 'play' (browser games) or 'device' (USB box)
function press(k) {
  audioInit();
  const pad = document.querySelector('.pad[data-k="' + k + '"]');
  if (pad) { pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 120); }
  if (MODE === 'device') { BOX.key(k); return; }
  VIEWS[UI.view].key(k);
}
addEventListener('keydown', e => {
  const typing = e.target.tagName === 'INPUT';
  if (typing && !['Escape', 'Enter', 'ArrowUp', 'ArrowDown', 'NumpadEnter'].includes(e.code)) return;   // let people type names
  if (e.code === 'KeyM' && !typing) { toggleSound(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (e.repeat && (k === 'A' || k === 'B')) return;   // A/B are taps; arrows may repeat
  press(k);
});
document.querySelectorAll('.pad').forEach(p => p.addEventListener('pointerdown', e => { e.preventDefault(); press(p.dataset.k); }));
// Gamepad: d-pad or stick for directions (with hold-repeat), A/X = A, B/Y = B
const GP = { prev: {}, rep: {} };
function pollPad(now) {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let g = null;
  for (const p of list) if (p && p.connected) { g = p; break; }
  if (!g) return;
  const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
  const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
  const st = { UP: b(12) || ay < -0.6, DOWN: b(13) || ay > 0.6, LEFT: b(14) || ax < -0.6, RIGHT: b(15) || ax > 0.6, A: b(0) || b(2), B: b(1) || b(3) };
  for (const k in st) {
    if (st[k] && !GP.prev[k]) { press(k); GP.rep[k] = now + 320; }
    else if (st[k] && DIRS.includes(k) && now >= GP.rep[k]) { press(k); GP.rep[k] = now + 130; }
    GP.prev[k] = st[k];
  }
}
// Move a highlight around a grid of items {r, c} toward the pressed direction
function gridMove(items, sel, k) {
  const cur = items[sel];
  let best = sel, bd = 1e9;
  items.forEach((it, i) => {
    if (i === sel) return;
    const dr = it.r - cur.r, dc = it.c - cur.c;
    const ok = k === 'UP' ? dr < 0 : k === 'DOWN' ? dr > 0 : k === 'LEFT' ? (dr === 0 && dc < 0) : (dr === 0 && dc > 0);
    if (!ok) return;
    const d = Math.abs(dr) * 10 + Math.abs(dc - (k === 'UP' || k === 'DOWN' ? 0 : 0));
    if (d < bd) { bd = d; best = i; }
  });
  if (best !== sel) SFX.move();
  return best;
}

function go(v, sel) { UI.view = v; UI.sel = sel || 0; if (VIEWS[v].enter) VIEWS[v].enter(); render(); }
function render() { if (MODE === 'device') BOX.render(); else VIEWS[UI.view].render(); }
// Clicking anything with data-i selects it and presses A
$('screen').addEventListener('click', e => {
  if (MODE === 'device') return;
  audioInit();
  const k = e.target.closest('[data-k]');            // on-screen arrow pads (memory game)
  if (k) { press(k.dataset.k); return; }
  const c = e.target.closest('[data-cat]');          // stat categories
  if (c) { PET.statCat = +c.dataset.cat; PET.statTop = false; SFX.move(); render(); return; }
  const el = e.target.closest('[data-i]');
  if (!el || el.tagName === 'INPUT') return;
  if (UI.view === 'dnd') T.sel = +el.dataset.i; else UI.sel = +el.dataset.i;
  VIEWS[UI.view].key('A');
});

      card(0, p ? (p.art || '(=^.^=)') : '(=^.^=)', 'BLOOMPETZ', p ? esc(p.name) + ' &middot; ' + energyWord(p.food) : 'no pet yet. make one!') +

    if (DIRS.includes(k)) { UI.sel = gridMove([{ r: 0, c: 0 }, { r: 0, c: 1 }, { r: 0, c: 2 }], UI.sel, k); render(); return; }

  },
};

const PET = { sub: 'home', bubble: '', bubbleUntil: 0, mood: '', moodUntil: 0, sayI: rnd(SAYINGS.length), sayAt: 0, tick: '', tickAt: 0, simon: null, statCat: 0, statTop: false, edit: null, hot: new Set() };
const activePet = () => SV.pets[SV.active];
function energyWord(e) { return e >= 76 ? 'Full' : e >= 51 ? 'Good' : e >= 26 ? 'Peckish' : e > 0 ? 'Hungry' : 'Empty'; }
function makePet(name, type, art) {
  return { name, type, art, id: (Math.random() * 4294967296) >>> 0, created: dayKey(), lastDay: dayKey(),
    lifeActions: 0, lifeTouches: 0, lifeTreats: 0, food: 100, treats: 0, mask: 0, stats: new Array(200).fill(0) };
}
// Midnight: daily actions and treats reset; food carries over (the stomach never resets)
function dailyReset(p) {
  const t = dayKey();
  if (p.lastDay !== t) { p.lastDay = t; p.mask = 0; p.treats = 0; save(); petSay('a new day!', 'happy'); }
}
const actionDone = (p, i) => !!(p.mask & (1 << i));
// Faster answers grow more: 0.6s or less = 0.0050, 6s or more = 0.0001 (firmware gainFromResponseMs)
function gainFromMs(ms) { const x = 1 - clamp((ms - 600) / (6000 - 600), 0, 1); return GAIN_MIN + x * (GAIN_MAX - GAIN_MIN); }
// 80%: a stat from one of the action's four favored categories. 20%: any of the 200.
function chooseStat(a) { if (rnd(100) < 80) { const cat = ACTION_FAVORED[a][rnd(4)]; return cat * 10 + rnd(10); } return rnd(200); }
function applyGrowth(p, a, base) {
  const hit = new Set(), gains = [];
  let tries = 0;
  while (gains.length < ROLLS && tries < 200) {
    tries++;
    const s = chooseStat(a);
    if (hit.has(s)) continue;
    hit.add(s);
    const g = clamp(base * (rr(850, 1151) / 1000), GAIN_MIN, GAIN_MAX);   // small wobble per stat
    p.stats[s] = Math.min(1, p.stats[s] + g);
    gains.push([s, g]);
  }
  return gains;
}
function petSay(text, mood) { PET.bubble = text; PET.bubbleUntil = performance.now() + 3600; if (mood) { PET.mood = mood; PET.moodUntil = performance.now() + 3600; } const b = $('petBubble'); if (b) b.textContent = text; }

// A pixel critter grown from the pet's id (color) and type (body shape)
const spriteCache = new Map();
// Body shape from the type: common words get the obvious look, anything else is hashed
function petShape(type) {
  const t = String(type || '').toLowerCase();
  if (/cat|kit|fox|lynx|tiger|lion|wolf|dog/.test(t)) return 1;      // pointy ears
  if (/bun|rabbit|hare/.test(t)) return 2;                            // long ears
  if (/bot|robot|droid|alien|bug|ant|bee/.test(t)) return 3;          // antenna
  if (/drag|demon|devil|goat|bull|imp|dino/.test(t)) return 4;        // horns
  if (/plant|sprout|bloom|seed|leaf|flower|tree|moss/.test(t)) return 5;   // sprout
  if (/slime|blob|ghost|jelly|bean/.test(t)) return 0;                // tuft
  return strHash(t.toUpperCase()) % 6;
}
function petSprite(p, mood, blink) {
  const key = p.id + '|' + p.type + '|' + mood + '|' + blink;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const R = mulberry(p.id), shape = petShape(p.type), hue = Math.floor(R() * 360);
  const W = 32, H = 32, g = new Array(W * H).fill(0);
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) g[y * W + x] = v; };
  const cx = 16, cy = 20, rx = 10 + Math.floor(R() * 3), ry = 8 + Math.floor(R() * 3);
  const top = cy - ry;
  // extras behind/above the body
  if (shape === 1) for (let i = 0; i < 5; i++) for (let j = 0; j <= i; j++) { set(cx - 7 + j, top - 4 + i, i === 4 ? 2 : 2); set(cx + 7 - j, top - 4 + i, 2); }   // cat ears
  if (shape === 2) for (let y = top - 9; y < top + 1; y++) { set(cx - 5, y, 2); set(cx - 4, y, y < top - 2 ? 4 : 2); set(cx + 4, y, 2); set(cx + 5, y, y < top - 2 ? 4 : 2); }   // bunny ears
  if (shape === 3) { for (let y = top - 6; y < top + 1; y++) set(cx, y, 3); set(cx - 1, top - 8, 8); set(cx, top - 8, 8); set(cx - 1, top - 7, 8); set(cx, top - 7, 8); set(cx + 1, top - 8, 8); set(cx + 1, top - 7, 8); }   // antenna
  if (shape === 4) for (let i = 0; i < 4; i++) { set(cx - 6 - (i >> 1), top - i, 8); set(cx + 6 + (i >> 1), top - i, 8); }   // little horns
  if (shape === 5) { set(cx, top - 1, 3); set(cx, top - 2, 3); set(cx - 1, top - 3, 8); set(cx - 2, top - 3, 8); set(cx - 2, top - 4, 8); set(cx + 1, top - 4, 8); set(cx + 2, top - 5, 8); set(cx + 1, top - 5, 8); }   // sprout
  if (shape === 0) { set(cx, top - 1, 2); set(cx + 1, top - 2, 2); set(cx - 1, top - 1, 2); }   // tuft
  // body + belly
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) {
      set(x, y, dy > 0.5 ? 3 : 2);
      if (dx * dx * 1.7 + (dy - 0.35) * (dy - 0.35) * 2.4 < 0.4) set(x, y, 4);
    }
  }
  for (const fx of [cx - 5, cx + 3]) { set(fx, cy + ry, 3); set(fx + 1, cy + ry, 3); set(fx + 2, cy + ry, 3); }   // feet
  // face
  const ey = cy - 3, ex = [cx - 5, cx + 3];
  if (blink || mood === 'sleep') ex.forEach(x => { set(x, ey + 1, 5); set(x + 1, ey + 1, 5); });
  else if (mood === 'happy') ex.forEach(x => { set(x - 1, ey + 1, 5); set(x, ey, 5); set(x + 1, ey, 5); set(x + 2, ey + 1, 5); });
  else if (mood === 'sad') ex.forEach((x, i) => { set(x, ey, 5); set(x + 1, ey, 5); set(x, ey + 1, 5); set(x + 1, ey + 1, 5); set(i ? x + 2 : x - 1, ey - 1, 5); });
  else ex.forEach(x => { set(x, ey, 5); set(x + 1, ey, 5); set(x, ey + 1, 5); set(x + 1, ey + 1, 5); set(x, ey, 6); });
  set(cx - 7, ey + 3, 7); set(cx - 6, ey + 3, 7); set(cx + 5, ey + 3, 7); set(cx + 6, ey + 3, 7);   // cheeks
  if (mood === 'sad') { set(cx - 1, ey + 5, 9); set(cx, ey + 4, 9); set(cx + 1, ey + 5, 9); }
  else { set(cx - 1, ey + 4, 9); set(cx, ey + 5, 9); set(cx + 1, ey + 4, 9); }
  if (mood === 'sleep') { set(cx + 9, top - 3, 6); set(cx + 10, top - 3, 6); set(cx + 10, top - 4, 6); set(cx + 9, top - 5, 6); set(cx + 10, top - 5, 6); }
  // dark outline around everything
  const out = g.slice();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (g[y * W + x]) continue;
    const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < W && yy < H && g[yy * W + xx] > 1 && g[yy * W + xx] !== 6;
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) out[y * W + x] = 1;
  }
  const pal = [null, '#05070a', 'hsl(' + hue + ',75%,62%)', 'hsl(' + hue + ',62%,44%)', 'hsl(' + hue + ',85%,84%)', '#0b0b14', '#ffffff', '#ff7aa8', 'hsl(' + ((hue + 150) % 360) + ',85%,60%)', '#3a1020'];
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx2 = c.getContext('2d');
  for (let i = 0; i < W * H; i++) if (out[i]) { cx2.fillStyle = pal[out[i]]; cx2.fillRect(i % W, (i / W) | 0, 1, 1); }
  spriteCache.set(key, c);
  return c;
}
function petMood(p) {
  if (performance.now() < PET.moodUntil && PET.mood) return PET.mood;
  const h = new Date().getHours();
  if (p.food <= 0) return 'sad';
  if (h >= 23 || h < 6) return 'sleep';
  return '';
}
function drawPetCanvas(cv, p, t, bigBounce) {
  if (!cv) return;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, cv.width, cv.height);
  const mood = petMood(p);
  const blink = ((t / 160) | 0) % 28 === 0;
  const bob = Math.round(Math.sin(t / (mood === 'sleep' ? 900 : 380)) * (bigBounce ? 1.5 : 1));
  g.fillStyle = 'rgba(0,229,255,.12)';        // glowing floor shadow
  g.beginPath(); g.ellipse(cv.width / 2, cv.height - 5, 11, 2.5, 0, 0, Math.PI * 2); g.fill();
  g.drawImage(petSprite(p, mood, blink), (cv.width - 32) / 2, cv.height - 36 + bob);
}

// --- the views ---
const PET_UTIL = ['FEED', 'TREAT', 'STATS', 'EDIT', 'SLOTS'];

    const age = Math.max(0, Math.round((new Date(String(p.lastDay).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')) - new Date(String(p.created).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'))) / 86400000));
    const sel = UI.sel;
    $('screen').innerHTML = '<div class="pets"><div class="stage panel">' +

      '<div class="dim">' + esc(p.type) + ' &middot; slot ' + (SV.active + 1) + '/3 &middot; ' + age + ' days old</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;min-width:0">' +
      '<div class="panel"><div class="kv"><span>ENERGY ' + Math.round(p.food * 10) / 10 + '</span><span class="glow">' + energyWord(p.food) + '</span></div>' +
      '<div class="barwrap"><i style="width:' + p.food + '%"></i></div>' +
      '<div class="kv" style="margin-top:6px"><span>TREATS ' + p.treats + '/3</span><span>TODAY ' + done + '/8</span><span class="dim">LIFE ' + p.lifeActions + ' acts &middot; ' + p.lifeTreats + ' treats</span></div></div>' +
      '<div class="h2">DAILY ACTIONS</div><div class="acts">' + ACTIONS.map((a, i) =>
        '<button class="btn' + (sel === i ? ' sel' : '') + (actionDone(p, i) ? ' done' : '') + '" data-i="' + i + '"><div class="glow">' + esc(ACTION_GLYPH[i]) + '</div>' + a + (actionDone(p, i) ? ' <span class="dim">*</span>' : '') + '</button>').join('') + '</div>' +

  renderSimon() {
    const S = PET.simon, p = activePet();
    const cell = (d, r, c) => '<button style="grid-row:' + r + ';grid-column:' + c + (S.lit === d ? ';background:' + DIR_LED[d] + ';box-shadow:0 0 24px ' + DIR_LED[d] : '') + '" class="' + (S.lit === d ? 'lit' : '') + '" data-k="' + DIRS[d] + '">' + DIR_ARROW[d] + '</button>';
    let body = '';

        : '<div class="h2">FUN ONLY TODAY</div><div class="dim">You already did ' + ACTIONS[S.a] + ' today. It still counts as a hang.</div>';

    } else if (S.phase === 'fail') body = '<div class="h2" style="color:var(--red)">WRONG &mdash; ' + esc(p.name) + ' o_o</div><div class="hint">A retry &middot; B back</div>';
    else body = '<div class="h2">' + (S.phase === 'input' ? [0, 1, 2].map(i => i < S.idx ? 'X' : '_').join(' ') : '&nbsp;') + '</div><div class="hint">' + (S.phase === 'input' ? 'repeat the arrows &middot; B cancel' : 'watch...') + '</div>';
    $('screen').innerHTML = '<div class="simon"><div class="h1 glow">' + ACTIONS[S.a] + '</div><div class="h2">' + esc(S.msg) + '</div>' +
      '<div class="pad4">' + cell(0, 1, 2) + cell(2, 2, 1) + '<div style="grid-row:2;grid-column:2;display:flex;align-items:center;justify-content:center"><canvas id="petCv" width="40" height="40" style="width:88px;height:88px;image-rendering:pixelated"></canvas></div>' + cell(3, 2, 3) + cell(1, 3, 2) + '</div>' + body + '</div>';
  },
  renderStats() {
    const p = activePet(), cat = PET.statCat;

    let rows, title;

      title = 'TOP 20 OF 200';

    } else {

    }
    const max = Math.max(0.0001, ...rows.map(r => r[1]));
    $('screen').innerHTML = '<div class="statgrid"><div class="catlist">' + STAT_CATS.map(([n], i) =>
      '<button class="btn' + (i === cat && !PET.statTop ? ' sel' : '') + '" data-cat="' + i + '"><span>' + esc(n) + '</span><span class="dim">' + (catAvg(i) * 100).toFixed(3) + '%</span></button>').join('') + '</div>' +
      '<div style="min-width:0;overflow-y:auto"><div class="h1 glow">' + esc(title) + '</div><div class="hint" style="margin-bottom:8px">' + esc(p.name) + ' has 200 developmental stats, 20 categories of 10. ' + (PET.statTop ? 'A: back to categories' : 'A: show the top 20') + ' &middot; B back</div>' +
      rows.map(([i, v]) => '<div class="statrow' + (PET.hot.has(i) ? ' hot' : '') + '"><span>' + pretty(STAT_NAMES[i]) + (PET.statTop ? ' <span class="dim">' + STAT_CATS[(i / 10) | 0][0] + '</span>' : '') + '</span><div class="barwrap"><i style="width:' + (v / max * 100) + '%"></i></div><span style="text-align:right">' + pct4(v) + '</span></div>').join('') + '</div></div>';
  },
  renderEdit() {
    const e = PET.edit;
    $('screen').innerHTML = '<div class="form"><div class="h1 glow">' + (e.creating ? 'CREATE PET &middot; SLOT ' + (e.slot + 1) : 'EDIT PET') + '</div>' +
      '<div style="display:flex;gap:16px;align-items:center"><canvas id="editCv" width="40" height="40" style="width:140px;height:140px;image-rendering:pixelated"></canvas><div class="art" id="editArt">' + esc(e.art) + '</div></div>' +
      '<label>NAME <input id="fName" maxlength="12" value="' + esc(e.name) + '" placeholder="up to 12"></label>' +
      '<label>TYPE <input id="fType" maxlength="12" value="' + esc(e.type) + '" placeholder="cat, slime, robot..."></label>' +
      '<label>ART <input id="fArt" maxlength="16" value="' + esc(e.art) + '" placeholder="up to 16 ASCII"></label>' +
      '<div class="presets">' + ART_PRESETS.map(a => '<button class="btn" data-preset="' + esc(a) + '">' + esc(a) + '</button>').join('') + '</div>' +
      '<div class="hint">Same limits as the box: name and type up to 12, art up to 16 printable ASCII characters. The type picks your pet\'s body shape; the color is its own.</div>' +

    const upd = () => { e.name = ascii($('fName').value, 12); e.type = ascii($('fType').value, 12); e.art = ascii($('fArt').value, 16); $('editArt').textContent = e.art; };
    ['fName', 'fType', 'fArt'].forEach(id => $(id).addEventListener('input', upd));

  saveEdit() {
    const e = PET.edit;
    if (!e.name.trim()) { toast('your pet needs a name'); SFX.bad(); $('fName').focus(); return; }
    if (e.creating) { SV.pets[e.slot] = makePet(e.name.trim(), e.type.trim() || 'BLOOM', e.art || '(=^.^=)'); SV.active = e.slot; petSay('hi! i am ' + e.name.trim().toLowerCase() + '!', 'happy'); }
    else { const p = activePet(); p.name = e.name.trim(); p.type = e.type.trim() || p.type; p.art = e.art || p.art; spriteCache.clear(); }

  },
  cancelEdit() { SFX.back(); PET.sub = activePet() ? 'home' : 'slots'; UI.sel = 0; render(); },
  key(k) {
    const s = PET.sub;
    if (s === 'slots') {
      if (k === 'B') { SFX.back(); go('launcher', 0); return; }
      if (DIRS.includes(k)) { UI.sel = gridMove([{ r: 0, c: 0 }, { r: 0, c: 1 }, { r: 0, c: 2 }], UI.sel, k); render(); return; }
      if (k === 'A') {
        SFX.sel();
        if (SV.pets[UI.sel]) { SV.active = UI.sel; save(); PET.sub = 'home'; UI.sel = 0; }
        else { PET.edit = { slot: UI.sel, creating: true, name: '', type: '', art: pick(ART_PRESETS) }; PET.sub = 'edit'; }
        render();
      }
      return;
    }
    if (s === 'edit') {
      if (k === 'B') return this.cancelEdit();
      if (k === 'A') return this.saveEdit();
      if (k === 'UP' || k === 'DOWN') {                  // hop between the three text boxes
        const ids = ['fName', 'fType', 'fArt'];
        const i = ids.indexOf(document.activeElement && document.activeElement.id);
        $(ids[(i + (k === 'DOWN' ? 1 : 2)) % 3]).focus();
      }
      return;
    }
    if (s === 'simon') return this.simonKey(k);
    if (s === 'stats') {
      if (k === 'B') { SFX.back(); PET.sub = 'home'; UI.sel = 10; render(); return; }
      if (k === 'A') { PET.statTop = !PET.statTop; SFX.sel(); render(); return; }
      if (k === 'UP' || k === 'LEFT') { PET.statCat = (PET.statCat + 19) % 20; PET.statTop = false; SFX.move(); }
      if (k === 'DOWN' || k === 'RIGHT') { PET.statCat = (PET.statCat + 1) % 20; PET.statTop = false; SFX.move(); }
      render(); return;
    }
    // home
    if (k === 'B') { SFX.back(); go('launcher', 0); return; }
    if (DIRS.includes(k)) { UI.sel = gridMove(this.items(), UI.sel, k); render(); return; }
    if (k !== 'A') return;
    const p = activePet();
    if (UI.sel < 8) return this.startAction(UI.sel);
    const u = PET_UTIL[UI.sel - 8];
    if (u === 'FEED') {
      dailyReset(p);
      if (p.food > 0.01) { petSay(p.name + ' ' + energyWord(p.food).toLowerCase() + '. still has food.', ''); SFX.bad(); }
      else { p.food = 100; save(); petSay('yum! energy 100', 'happy'); SFX.yum(); setLeds('#00d81a', '#78b400', 900); }
    } else if (u === 'TREAT') {
      dailyReset(p);
      if (p.treats >= TREAT_LIMIT) { petSay(p.name + ' says nope. no more treats today.', 'sad'); SFX.bad(); setLeds('#8c0028', '#8c0028', 700); }
      else {
        const st = rnd(200), g = rr(1, 51) / 10000;
        p.stats[st] = Math.min(1, p.stats[st] + g); p.treats++; p.lifeTreats++;
        PET.hot = new Set([st]); save();
        petSay('yum! ' + pretty(STAT_NAMES[st]) + ' +' + (g * 100).toFixed(4) + '%', 'happy'); SFX.yum(); setLeds('#f05000', '#c80090', 900);
      }

  if (T.screen !== 'play') return;
  for (const e of T.enemies.slice()) {
    if (!T.enemies.includes(e) || now < e.next) continue;
    e.next = now + rr(e.mmin, e.mmax + 1);
    const dxp = T.px - e.x, dyp = T.py - e.y;
    if (Math.abs(dxp) + Math.abs(dyp) === 1) {
      const total = rr(1, 21) + e.hit + Math.trunc(e.dex / 3);
      log(e.name + ' ATTACK'); log('ROLL ' + total);
      if (total >= effAc()) { if (damagePlayer(rr(e.dmin, e.dmax + 1), e.name)) return; }
      else log('MISS');
      continue;
    }
    let dx = 0, dy = 0;
    if (Math.abs(dxp) + Math.abs(dyp) <= 10) {   // chase when close
      if (Math.abs(dxp) >= Math.abs(dyp) && dxp !== 0) dx = Math.sign(dxp); else if (dyp !== 0) dy = Math.sign(dyp);
    } else { const r = rnd(4); dx = r === 0 ? 1 : r === 1 ? -1 : 0; dy = r === 2 ? 1 : r === 3 ? -1 : 0; }
    const nx = e.x + dx, ny = e.y + dy;
    if (!walkable(nx, ny) || (nx === T.px && ny === T.py) || enemyAt(nx, ny) || 'c^$!w+'.includes(T.map[ny][nx])) continue;
    e.x = nx; e.y = ny;
  }
}

const price = id => Math.min(65000, ITEMS[id].price + D.room * (1 + ITEMS[id].rarity));
function rollShop(force) {

}
function buy(i) {
  const id = D.shop[i], pr = price(id);

  if (D.inv.length >= 288) { log('INVENTORY FULL'); SFX.bad(); return; }

}
function equip(id, cat) {
  const it = ITEMS[id], n = D.inv.filter(x => x === id).length;
  if (cat === 0 && it.type === 'W') D.eq.weapon = id;
  else if (cat === 1 && it.type === 'A') D.eq.armor = id;
  else if (cat === 2 && it.type === 'D') D.eq.shield = id;
  else if (cat === 3 && it.type === 'R') { if (D.eq.ring2 === id && n < 2) { log('NEED SECOND RING'); SFX.bad(); return; } D.eq.ring1 = id; }
  else if (cat === 4 && it.type === 'R') { if (D.eq.ring1 === id && n < 2) { log('NEED SECOND RING'); SFX.bad(); return; } D.eq.ring2 = id; }
  else if (cat === 5 && it.type === 'C') D.eq.charm = id;

}
function useItem(invIndex) {

  if (!it || it.type !== 'H') return;
  const cap = effMax();
  D.hp = it.heal >= 9999 ? cap : Math.min(cap, D.hp + it.heal);
  D.inv.splice(invIndex, 1); log('USED ' + it.name); log('HP ' + D.hp + '/' + cap); SFX.yum(); dsave();

// Draw the room: glyph tiles, theme-tinted walls, tier-colored foes, aim arrows, hit marks
function drawMap(now) {
  const c = $('map');

  const g = c.getContext('2d'), cw = 24, ch = 30;
  g.fillStyle = '#010203'; g.fillRect(0, 0, c.width, c.height);
  const hue = (D.theme * 37) % 360;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '30px VT323, monospace';
  const glyph = (ch2, x, y, col, glow) => { g.fillStyle = col; g.shadowColor = col; g.shadowBlur = glow || 0; g.fillText(ch2, x * cw + cw / 2, y * ch + ch / 2 + 1); g.shadowBlur = 0; };
  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
    const t = T.map[y][x];
    if (t === '#') {
      g.fillStyle = 'hsl(' + hue + ',30%,16%)'; g.fillRect(x * cw, y * ch, cw, ch);
      g.fillStyle = 'hsl(' + hue + ',35%,26%)'; g.fillRect(x * cw, y * ch, cw, 3);
      g.fillStyle = 'hsl(' + hue + ',30%,11%)'; g.fillRect(x * cw, y * ch + ch - 3, cw, 3);
    } else if (t === '.') { g.fillStyle = 'hsl(' + hue + ',25%,22%)'; g.fillRect(x * cw + cw / 2 - 1, y * ch + ch / 2 - 1, 2, 2); }
    else if (t === '+') { g.fillStyle = 'rgba(255,217,61,.15)'; g.fillRect(x * cw, y * ch, cw, ch); glyph('+', x, y, '#FFD93D', 10); }
    else if (t === 'c') glyph('c', x, y, '#e0a050', 6);
    else if (t === '^') glyph('^', x, y, '#ff5a6a', 6);
    else if (t === '$') glyph('$', x, y, '#FFD93D', 8);
    else if (t === '!') glyph('!', x, y, '#FF4BCB', 8);
    else if (t === 'w') glyph('w', x, y, '#9ff6ff', 8);
  }
  for (const e of T.enemies) {
    glyph(e.glyph, e.x, e.y, TIER_COL[e.tier], 8);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(e.x * cw + 3, e.y * ch + ch - 4, cw - 6, 3);
    g.fillStyle = TIER_COL[e.tier]; g.fillRect(e.x * cw + 3, e.y * ch + ch - 4, (cw - 6) * Math.max(0, e.hp) / e.maxHp, 3);
  }
  glyph('@', T.px, T.py, '#ffffff', 14);
  if (now < T.armedUntil) {                     // aiming: arrows around you
    g.globalAlpha = 0.5 + 0.5 * Math.sin(now / 60);
    [['^', 0, -1], ['v', 0, 1], ['<', -1, 0], ['>', 1, 0]].forEach(([a, dx, dy]) => glyph(a, T.px + dx, T.py + dy, '#ffa04a', 6));
    g.globalAlpha = 1;
  }
  T.flashes = T.flashes.filter(f => f.until > now);
  for (const f of T.flashes) glyph('x', f.x, f.y, '#ff3040', 14);
}
function dndTick(now) {
  if (!D || !T.loaded) return;

// 6. BOX MODE: talk to the real ESP32 over Web Serial (Chrome / Edge)
//    Same protocol as the Pi Mini: read BP|SCREEN mirror lines, send
//    KEY UP/DOWN/LEFT/RIGHT/A/B, and hand over the time with SET HOSTTIME.
// ---------------------------------------------------------------------
const BOX = {
  port: null, reader: null, connected: false, lines: ['', '', '', ''], cols: 16, fw: '', pet: '', log: [], timer: 0, timeAt: null, statusAt: 0,

      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      (this.connected ? '<button class="btn sel" id="boxOff">DISCONNECT</button>' : '<button class="btn sel" id="boxOn"' + (sup ? '' : ' disabled') + '>CONNECT BOX</button>') +
      '<button class="btn" id="boxBack">BACK TO BROWSER GAMES</button>' +
      '<span class="dim" id="boxStatus">' + this.statusText() + '</span></div>' +
      '<div class="devoled" id="boxOled">' + this.oledText() + '</div>' +
      '<div class="hint">' + (this.connected ? 'Your arrows, A, B, the copper pads below and any gamepad now press the box\'s buttons. The box keeps its own saves; this page just mirrors its screen and sends the time once a minute so its clock is right.' : 'Plug the box in with USB, then CONNECT BOX and pick its port. Close the Pi Mini or anything else using the port first.') + '</div>' +
      '<details class="panel"><summary class="dim">serial log</summary><div class="devlog" id="boxLog"></div></details></div>';
    if ($('boxOn')) $('boxOn').onclick = () => this.connect();
    if ($('boxOff')) $('boxOff').onclick = () => this.disconnect();
    $('boxBack').onclick = () => setMode('play');
    this.renderLog();
  },
  statusText() { return this.connected ? 'connected' + (this.fw ? ' &middot; fw ' + esc(this.fw) : '') + (this.pet ? ' &middot; ' + esc(this.pet) : '') + (this.timeAt ? ' &middot; time sent ' + this.timeAt.getHours() + ':' + String(this.timeAt.getMinutes()).padStart(2, '0') : '') : 'not connected'; },
  oledText() { const w = this.cols; return this.lines.map(l => esc(l.padEnd(w).slice(0, w))).join('\n'); },
  renderLog() { const el = $('boxLog'); if (el) el.textContent = this.log.join('\n'); },
  refreshScreen() { const o = $('boxOled'); if (o) o.innerHTML = this.oledText(); const s = $('boxStatus'); if (s) s.innerHTML = this.statusText(); },
  async connect() {

  async open(port) {

  async readLoop() {

        }
      } catch (e) { this.note('read stopped: ' + e.message); break; }
      finally { try { this.reader.releaseLock(); } catch (e) {} }
    }
    this.closed();
  },
  handle(line) {
    const m = line.match(/^BP\|SCREEN\|1=(.*)\|2=(.*)\|3=(.*)\|4=(.*)$/);
    if (m) {
      this.lines = [m[1], m[2], m[3], m[4]];
      this.cols = this.lines.some(l => l.length > 16) ? 21 : 16;   // DND frames use the full 21 columns
      this.refreshScreen();
      const now = Date.now();
      if (now - this.statusAt > 1500) { this.statusAt = now; this.send('GET STATUS'); }
      return;
    }
    if (line.startsWith('BP|STATUS|')) {
      const f = Object.fromEntries(line.split('|').slice(2).map(p => p.split('=')).filter(p => p.length === 2));
      this.pet = f.occupied === '1' ? (f.name || '').trim() : 'no pet';
      this.refreshScreen(); return;
    }
    if (line.startsWith('BP|IDENTITY|')) { const f = line.match(/fw=([^|]*)/); this.fw = f ? f[1] : ''; }
    if (line.startsWith('BP|BOOT|')) { this.send('GET STATUS'); this.sendTime(); }
    this.note(line);
  },
  async disconnect() {
    clearInterval(this.timer);
    try { if (this.reader) await this.reader.cancel(); } catch (e) {}
    try { if (this.port) await this.port.close(); } catch (e) {}
    this.closed();
  },
  closed() {
    if (!this.connected && !this.port) return;
    this.connected = false; this.port = null; clearInterval(this.timer); this.note('disconnected');
    if (MODE === 'device') this.render();
  },
  key(k) {
    if (this.connected) { this.send('KEY ' + k); return; }
    if (k === 'A') this.connect();
    if (k === 'B') setMode('play');
  },
};
if (BOX.supported) navigator.serial.addEventListener('disconnect', e => { if (BOX.port && e.target === BOX.port) BOX.closed(); });

// ---------------------------------------------------------------------
// 7. MODE SWITCH, MAIN LOOP, BOOT
// ---------------------------------------------------------------------
function setMode(m) {
  MODE = m;
  $('tabPlay').classList.toggle('on', m === 'play');
  $('tabDev').classList.toggle('on', m === 'device');
  if (m === 'play' && UI.view === 'launcher') UI.sel = 0;
  SFX.sel(); render();
}
$('tabPlay').onclick = () => { audioInit(); setMode('play'); };
$('tabDev').onclick = () => { audioInit(); setMode('device'); };
$('tabSnd').onclick = toggleSound;
$('tabSnd').classList.toggle('on', SV.sound);
function petsTick(now) {
  const p = activePet();
  if (PET.sub === 'slots') document.querySelectorAll('.slotcv').forEach(cv => { const sp = SV.pets[+cv.dataset.slot]; if (sp) drawPetCanvas(cv, sp, now, false); });
  if (!p) return;
  if (PET.sub === 'edit') {
    const e = PET.edit;
    drawPetCanvas($('editCv'), { id: e.creating ? (e.previewId || (e.previewId = (Math.random() * 4294967296) >>> 0)) : p.id, type: e.type, food: 100 }, now, true);
    return;
  }
  drawPetCanvas($('petCv'), p, now, PET.sub === 'simon');
  if (PET.sub !== 'home') return;
  // sayings rotate every 10 seconds (the box's HOME ticker)
  if (now > PET.bubbleUntil && PET.bubble) { PET.bubble = ''; const b = $('petBubble'); if (b) b.textContent = SAYINGS[PET.sayI]; }
  if (now - PET.sayAt > 10000) { PET.sayAt = now; PET.sayI = (PET.sayI + 1) % SAYINGS.length; if (!PET.bubble) { const b = $('petBubble'); if (b) b.textContent = SAYINGS[PET.sayI]; } }
  if (now - PET.tickAt > 4000) {                // live stat ticker
    PET.tickAt = now;
    const nz = p.stats.map((v, i) => [i, v]).filter(x => x[1] > 0);
    const [i, v] = nz.length && rnd(3) ? pick(nz) : [rnd(200), 0];
    PET.tick = p.name + '  ' + pretty(STAT_NAMES[i]) + ' ' + pct4(v || p.stats[i]);
    const t = $('petTicker'); if (t) t.textContent = PET.tick;
  }
}
let lastClock = 0;
function frame(now) {
  pollPad(now);
  if (MODE === 'play') {
    if (UI.view === 'pets') petsTick(now);
    if (UI.view === 'dnd') dndTick(now);
  }
  if (now - lastClock > 1000) {
    lastClock = now; $('clock').textContent = clockLine();
    const p = activePet();
    if (p && MODE === 'play' && UI.view === 'pets' && PET.sub === 'home' && p.lastDay !== dayKey()) { dailyReset(p); render(); }
  }
  requestAnimationFrame(frame);
}
addEventListener('visibilitychange', () => { if (document.hidden) { if (D) dsave(); save(); } });
addEventListener('beforeunload', () => { if (D) SV.dnd = D; save(); });
setLeds('#2a1040', '#102a40', 0);
render();
requestAnimationFrame(frame);
</script>
