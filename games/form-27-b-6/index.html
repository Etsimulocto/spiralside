<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form 27-B/6</title>
<link rel="icon" type="image/png" href="art/icon-64.png">
<link rel="apple-touch-icon" href="art/icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FORM 27-B/6 - a cozy, pointless, complicated idle game about paperwork
   Layout: top nameplate bar / three columns: window+coffee | desk | trays
   ===================================================================== */
:root {
  --wall: #34424a;          /* rainy-day wall */
  --wall2: #2a353c;
  --wood: #7a4f33;          /* desk */
  --wood2: #6a432b;
  --paper: #f3ead3;         /* forms */
  --paper2: #e9dec2;
  --ink: #23306e;           /* blue pen ink */
  --type: #2b2a26;          /* typewriter text */
  --red: #b8322a;           /* stamps / returned slips */
  --teal: #00F6D6;          /* Spiralside accents, used sparingly */
  --pink: #FF4BCB;
  --yellow: #FFD93D;
  --soft: #c9d3d8;
  --type-font: 'Special Elite', 'Courier New', Courier, monospace;
  --hand-font: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --pix-font: 'VT323', 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1d2428; color: var(--soft); overflow: hidden; }
body { font-family: var(--type-font); -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- top nameplate bar ---------- */
#top {
  height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: linear-gradient(#4a3424, #3a281b); border-bottom: 3px solid #241810;
  box-shadow: 0 2px 10px rgba(0,0,0,.4); position: relative; z-index: 5;
}
.plate {                    /* brass desk nameplate */
  background: linear-gradient(#d9b45a, #b48a35); color: #3a2a10; padding: 4px 12px; border-radius: 3px;
  box-shadow: inset 0 1px 0 #f3d98a, 0 1px 2px rgba(0,0,0,.5); line-height: 1.05; white-space: nowrap;
}
.plate b { display: block; font-size: 11px; letter-spacing: .12em; }
.plate span { font-size: 15px; }
.stats { display: flex; align-items: center; gap: 14px; flex: 1; flex-wrap: nowrap; overflow: hidden; }
.stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #e8dcc0; white-space: nowrap; }
.stat b { font-size: 18px; color: #fff3d0; }
.stat small { color: #b9a988; font-size: 12px; }
.bar { width: 74px; height: 9px; background: #241810; border: 1px solid #1a110b; border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; background: #5d7bd6; transition: width .4s; }
.bar.calm i { background: #7fbf8e; }
.clock { margin-left: auto; font-family: var(--pix-font); font-size: 20px; color: #ffd98a; white-space: nowrap; }
#sndBtn { background: #2a1d14; color: #e8dcc0; border: 1px solid #5a4030; border-radius: 4px; padding: 3px 8px; font-size: 13px; }

/* ---------- the office: three columns ---------- */
#office {
  height: calc(100% - 54px); display: grid;
  grid-template-columns: minmax(230px, 24%) 1fr minmax(210px, 21%);
  background: linear-gradient(var(--wall), var(--wall2));
}
#left, #right { position: relative; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* window with rain */
#window {
  position: relative; border: 10px solid #5b4636; border-radius: 3px; background: #46525a;
  box-shadow: inset 0 0 0 2px #2c221a, 0 4px 14px rgba(0,0,0,.4); aspect-ratio: 4 / 3; cursor: pointer; flex-shrink: 0;
}
#window::after {            /* window cross bars */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent calc(50% - 3px), #5b4636 calc(50% - 3px), #5b4636 calc(50% + 3px), transparent calc(50% + 3px)),
              linear-gradient(transparent calc(50% - 3px), #5b4636 calc(50% - 3px), #5b4636 calc(50% + 3px), transparent calc(50% + 3px));
}
#rain { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#sill { position: absolute; left: -10px; right: -10px; bottom: -18px; height: 10px; background: #6b5240; border-radius: 2px; box-shadow: 0 3px 4px rgba(0,0,0,.4); }
#plantCv { position: absolute; left: 16px; bottom: 8px; width: 48px; height: 64px; image-rendering: pixelated; }
.hint { font-size: 11px; color: #8fa0a8; text-align: center; margin-top: 10px; }

/* coffee station */
#coffee {
  background: rgba(0,0,0,.18); border-radius: 6px; padding: 10px; display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center;
}
#mugCv { width: 72px; height: 72px; image-rendering: pixelated; cursor: pointer; }
#coffeeTxt { font-size: 13px; color: #e6d9bd; min-height: 34px; }
.btnrow { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.btn {
  background: #e9dec2; color: #2b2a26; border: 1px solid #8a7a5a; border-bottom-width: 3px; border-radius: 4px;
  padding: 4px 9px; font-size: 13px;
}
.btn:active { transform: translateY(1px); border-bottom-width: 2px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.red { background: #f0c9c0; border-color: #8a3a30; }
.btn.go { background: #cfe6c8; border-color: #4f7a46; }
#cork {                    /* corkboard with a pinned Bylaw of the Day */
  flex: 1; min-height: 120px; border: 6px solid #6b5240; border-radius: 3px; padding: 14px; display: flex; align-items: flex-start; justify-content: center;
  background: radial-gradient(#b08a5a 1px, transparent 1.5px) 0 0 / 6px 6px, #a07a4a; box-shadow: 0 4px 10px rgba(0,0,0,.35); overflow: hidden;
}
#cork .note { background: #fff6a8; color: #3a3420; padding: 10px 12px 12px; font-size: 13px; line-height: 1.35; transform: rotate(1.5deg); box-shadow: 2px 3px 6px rgba(0,0,0,.3); position: relative; max-width: 100%; }
#cork .note::before { content: ''; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #c0392b; box-shadow: 0 2px 2px rgba(0,0,0,.4); }
#cork .note b { display: block; font-size: 11px; letter-spacing: .14em; margin-bottom: 4px; }
#radiator {
  height: 70px; border-radius: 6px; cursor: pointer; position: relative; margin-top: auto;
  background: repeating-linear-gradient(90deg, #8b8f93 0 12px, #6c7074 12px 15px); box-shadow: inset 0 -6px 0 #55595d, 0 3px 8px rgba(0,0,0,.35);
}
#radiator::after { content: 'radiator'; position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: #e3e6e8; opacity: .7; }
#knob { position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; border-radius: 50%; background: #b8322a; box-shadow: 0 0 0 2px #55595d; }

/* ---------- the desk with the paper ---------- */
#deskArea {
  position: relative; min-height: 0; overflow: hidden;
  background:
    repeating-linear-gradient(178deg, rgba(0,0,0,.05) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 37px),
    linear-gradient(var(--wood), var(--wood2));
  border-left: 4px solid #4e3221; border-right: 4px solid #4e3221;
}
#paperWrap { position: absolute; inset: 14px 14px 64px 14px; overflow-y: auto; overflow-x: hidden; display: flex; justify-content: center; scrollbar-width: thin; }
.paper {
  width: min(620px, 100%); background: var(--paper); color: var(--type); padding: 26px 30px 30px; margin: 0 auto 30px;
  box-shadow: 0 2px 0 var(--paper2), 0 4px 0 #d8cba9, 0 10px 24px rgba(0,0,0,.45);
  background-image: repeating-linear-gradient(transparent 0 27px, rgba(80,110,160,.12) 27px 28px);
  position: relative; transform: rotate(-.4deg); align-self: flex-start; font-size: 15px; line-height: 1.45;
}
.paper.slide { animation: slideIn .35s ease-out; }
@keyframes slideIn { from { transform: translateY(40px) rotate(2deg); opacity: 0; } to { transform: rotate(-.4deg); opacity: 1; } }
.paper .dept { font-size: 11px; letter-spacing: .16em; color: #6b6355; display: flex; justify-content: space-between; border-bottom: 2px solid #2b2a26; padding-bottom: 4px; }
.paper .code { font-size: 13px; }
.paper h2 { margin: 12px 0 2px; font-size: 22px; font-weight: normal; letter-spacing: .02em; }
.paper .sub { font-size: 12px; color: #6b6355; margin-bottom: 10px; }
.paper .intro { font-size: 13px; margin: 8px 0 12px; }
.paper .fine { font-size: 10.5px; color: #6b6355; line-height: 1.35; margin-top: 14px; border-top: 1px dashed #b9ad90; padding-top: 8px; }
.paper .fine p { margin: 0 0 5px; }
.field { display: grid; grid-template-columns: 26px 1fr; gap: 4px 6px; padding: 7px 0; border-bottom: 1px dotted #c9bd9f; align-items: start; }
.field .no { font-size: 13px; color: #6b6355; padding-top: 2px; }
.field .lbl { font-size: 14px; }
.field .ctl { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-height: 30px; }
.hand { font-family: var(--hand-font); color: var(--ink); font-size: 24px; line-height: 1; }
.chk { background: none; border: none; font-size: 22px; color: var(--type); padding: 0 4px; line-height: 1; }
.chk.on { color: var(--ink); }
.opt { position: relative; background: none; border: none; font-size: 14px; color: var(--type); padding: 3px 8px; border-radius: 50%; }
.opt.on::before {           /* hand-drawn circle around the chosen option */
  content: ''; position: absolute; inset: -2px -6px; border: 2px solid var(--ink); border-radius: 50% 45% 55% 48%;
  transform: rotate(-4deg);
}
.opt.pip.on::before { border-color: #3a9a8a; border-style: dashed; }
.txt { font-family: var(--hand-font); font-size: 24px; color: var(--ink); background: transparent; border: none; border-bottom: 1px solid #8a7e64; width: min(320px, 70%); padding: 0 4px; outline: none; }
.txt::placeholder { color: #b5aa8e; font-size: 18px; }
.txt.write { animation: inkIn .7s steps(14); }   /* the pen writing left to right */
@keyframes inkIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.pen { background: none; border: 1px solid #b9ad90; border-radius: 4px; font-size: 13px; padding: 2px 7px; color: #6b6355; }
.num { display: inline-flex; align-items: center; gap: 8px; }
.num button { width: 26px; height: 26px; border: 1px solid #8a7e64; background: #efe5ca; border-radius: 4px; font-size: 16px; color: var(--type); }
.num .val { min-width: 36px; text-align: center; }
.inits { display: flex; gap: 10px; }
.ibox { width: 46px; height: 36px; border: 1.5px solid #6b6355; background: transparent; display: flex; align-items: center; justify-content: center; }
.ibox small { font-size: 9px; color: #9a8f74; font-family: var(--type-font); }
.sigline { min-width: 220px; border-bottom: 1px solid #2b2a26; height: 38px; display: flex; align-items: flex-end; padding: 0 6px 2px; cursor: pointer; }
.sigline .hand { font-size: 30px; transform: rotate(-3deg); display: inline-block; }
.sigline.empty::before { content: 'x  sign here'; color: #9a8f74; font-size: 13px; }
.stampbox { width: 190px; height: 70px; border: 1.5px dashed #8a7e64; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.stampbox.empty::before { content: '[ office stamp ]'; color: #9a8f74; font-size: 12px; }
.imprint {
  font-family: var(--type-font); font-size: 19px; letter-spacing: .08em; color: var(--red); border: 3px double var(--red);
  padding: 4px 10px; transform: rotate(-7deg); opacity: .85; mix-blend-mode: multiply; white-space: nowrap;
}
.imprint.thunk { animation: thunk .25s ease-out; }
@keyframes thunk { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } to { transform: rotate(-7deg); opacity: .85; } }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; }
.stamps button { background: #efe5ca; border: 1px solid #8a7e64; color: var(--red); font-size: 12px; padding: 3px 7px; border-radius: 3px; }
.attach { display: flex; align-items: center; gap: 10px; }
.clip { font-size: 13px; padding: 4px 8px; border: 1px solid #8a7e64; background: #fffaf0; transform: rotate(1deg); }
.clip.done { border-color: #4f7a46; color: #2f5a28; }
.officeuse { margin-top: 12px; font-size: 11px; color: #6b6355; border: 1px solid #c9bd9f; padding: 6px 8px; display: flex; gap: 10px; align-items: center; }
.officeuse button { background: none; border: 1px solid #9a8f74; width: 18px; height: 18px; font-size: 12px; line-height: 1; padding: 0; color: var(--ink); }
.filebar { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.returned {
  background: #fde3dc; border: 2px solid var(--red); color: #7a2018; padding: 8px 10px; font-size: 13px; margin: 8px 0 4px;
  transform: rotate(.6deg); box-shadow: 2px 2px 0 rgba(0,0,0,.1);
}
.returned b { letter-spacing: .1em; }
.empty-desk { color: #e8dcc0; text-align: center; margin: auto; padding: 40px 20px; font-size: 16px; opacity: .85; }
.empty-desk .big { font-size: 22px; margin-bottom: 8px; }

/* pip the desk bot + the cat + speech */
#pip { position: absolute; bottom: 8px; left: 70%; width: 72px; transition: left 1.4s ease-in-out; z-index: 4; cursor: pointer; }
#pipCv { width: 72px; height: 72px; image-rendering: pixelated; display: block; }
.bubble {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 4px; width: max-content; max-width: 230px;
  background: #fffaf0; color: #23303a; border: 2px solid #23303a; border-radius: 8px; padding: 5px 9px;
  font-family: var(--pix-font); font-size: 18px; line-height: 1.05; box-shadow: 2px 2px 0 rgba(0,0,0,.25);
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
.bubble.show { opacity: 1; }
.bubble::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: #23303a; }
#cat { position: absolute; bottom: 30%; left: -140px; width: 128px; z-index: 6; cursor: pointer; transition: left 3s linear; }
#catCv { width: 128px; height: 80px; image-rendering: pixelated; display: block; }
#cat.bedded { position: absolute; }

/* trays + drawers */
.tray {
  background: linear-gradient(#8a6a4a, #6e5238); border-radius: 4px; padding: 8px 10px 10px; position: relative; cursor: pointer;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.35); min-height: 96px;
}
.trayLabel { font-size: 12px; letter-spacing: .2em; color: #f3e3c2; }
.stack { position: relative; height: 56px; margin-top: 4px; }
.stack i { position: absolute; left: 6%; right: 6%; height: 7px; background: var(--paper); border: 1px solid #c9bd9f; border-radius: 1px; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.stack i.ret { background: #f6d6cc; }
.trayCount { position: absolute; right: 10px; top: 6px; font-size: 13px; color: #fff3d0; }
#inbox:hover { filter: brightness(1.08); }
#drawers { display: flex; flex-direction: column; gap: 6px; }
#drawers button {
  text-align: left; background: linear-gradient(#7a5a3e, #634830); color: #f3e3c2; border: 1px solid #3a281b; border-radius: 3px; padding: 7px 10px; font-size: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
#drawers button::before { content: '▭ '; color: #d9b45a; }
.badge { background: var(--red); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
#catbedCv { width: 96px; height: 48px; image-rendering: pixelated; align-self: center; cursor: pointer; }
#rug { position: absolute; left: 50%; bottom: -30px; width: 60%; height: 40px; transform: translateX(-50%); border-radius: 50%;
  background: repeating-radial-gradient(#7a3a4a 0 6px, #8a4a5a 6px 12px); opacity: .7; }
#coat { position: absolute; right: 12px; top: 12px; font-size: 40px; }

/* drawer panel (bylaws, memos, catalog, requisitions, log) */
#drawer {
  position: fixed; top: 54px; right: 0; bottom: 0; width: min(520px, 100%); background: #efe5ca; color: var(--type); z-index: 20;
  box-shadow: -8px 0 24px rgba(0,0,0,.5); display: flex; flex-direction: column; animation: drawerIn .25s ease-out;
}
@keyframes drawerIn { from { transform: translateX(40px); opacity: 0; } }
.drawerHead { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #d9caa3; border-bottom: 2px solid #8a7e64; font-size: 18px; }
.tabs { display: flex; gap: 4px; padding: 6px 10px 0; background: #d9caa3; flex-wrap: wrap; }
.tabs button { border: 1px solid #8a7e64; border-bottom: none; background: #e6d8b4; padding: 4px 9px; font-size: 13px; border-radius: 4px 4px 0 0; }
.tabs button.on { background: #efe5ca; }
#drawerBody { overflow-y: auto; padding: 14px 18px 30px; font-size: 14px; line-height: 1.5; }
.law { margin-bottom: 10px; }
.law b { display: inline-block; min-width: 70px; }
.law.live b { color: var(--red); }
.memo { border: 1px solid #c9bd9f; background: #fffaf0; padding: 9px 11px; margin-bottom: 10px; }
.memo .mh { font-size: 12px; color: #6b6355; border-bottom: 1px dashed #c9bd9f; margin-bottom: 6px; padding-bottom: 4px; }
.memo.new { border-color: var(--red); }
.cat-row, .req-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px dotted #c9bd9f; align-items: center; }
.req-row .d { font-size: 12px; color: #6b6355; }
.owned { color: #2f5a28; font-size: 12px; }
.logline { font-family: var(--pix-font); font-size: 18px; color: #2a3a40; }

/* modal for attached sub-forms and requisitions */
#modal { position: fixed; inset: 54px 0 0 0; background: rgba(10,14,16,.55); z-index: 15; overflow-y: auto; padding: 24px 10px; }
#modal .paper { transform: rotate(.5deg); }
#toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: #fffaf0; color: #2b2a26; border: 2px solid #2b2a26; padding: 6px 12px; font-size: 14px; box-shadow: 3px 3px 0 rgba(0,0,0,.3); animation: toastIn .3s ease-out; max-width: 90vw; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
#cert { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,16,.7); display: flex; align-items: center; justify-content: center; padding: 20px; }
#cert .paper { text-align: center; max-width: 520px; border: 8px double #b48a35; }

/* ---------- phones / narrow screens: stack everything ---------- */
@media (max-width: 860px) {
  html, body { overflow: auto; }
  #top { height: auto; flex-wrap: wrap; padding: 8px; gap: 8px; }
  .stats { flex-wrap: wrap; gap: 8px 12px; flex-basis: 100%; }
  .clock { margin-left: 0; }
  #office { display: flex; flex-direction: column; height: auto; }
  #left { order: 1; } #right { order: 2; } #deskArea { order: 3; }   /* trays above the desk on phones */
  #cork { display: none; }
  #left { flex-direction: row; flex-wrap: wrap; }
  #window { width: 46%; }
  #coffee { flex: 1; min-width: 200px; }
  #radiator { display: none; }
  #deskArea { min-height: 78vh; }
  #right { flex-direction: row; flex-wrap: wrap; }
  .tray { flex: 1; min-width: 140px; }
  #drawers { flex-direction: row; flex-wrap: wrap; width: 100%; }
  #drawer, #modal { top: 0; inset: 0; }
}
</style>
</head>
<body>
<header id="top">
  <div class="plate"><b>DEPT. OF MINOR AFFAIRS &middot; DESK 27</b><span id="rankName">Visiting Intern</span></div>
  <div class="stats">
    <div class="stat" title="Stamps: the Department's only currency"><span style="color:#f08a7a">&#10022;</span><b id="stStamps">0</b><small>stamps</small></div>
    <div class="stat" title="Ink in your pen"><small>ink</small><div class="bar"><i id="inkBar"></i></div></div>
    <div class="stat" title="How calm you feel"><small>calm</small><div class="bar calm"><i id="calmBar"></i></div><small id="calmWord">cozy</small></div>
    <div class="stat" title="Forms filed, ever"><small>filed</small><b id="stFiled">0</b></div>
    <div class="clock" id="clock">Tuesday-ish</div>
    <button id="sndBtn" title="Sound (M)">&#9835; on</button>
  </div>
</header>
<main id="office">
  <section id="left">
    <div id="window" title="Watch the rain">
      <canvas id="rain" width="160" height="120"></canvas>
      <canvas id="plantCv" width="12" height="16" class="hidden"></canvas>
      <div id="sill"></div>
    </div>
    <div class="hint">click the window to watch the rain</div>
    <div id="coffee">
      <canvas id="mugCv" width="24" height="24" title="Your coffee. Click to sip."></canvas>
      <div>
        <div id="coffeeTxt">A cup of coffee. Hot.</div>
        <div class="btnrow">
          <button class="btn" id="sipBtn">sip</button>
          <button class="btn" id="brewBtn">brew a fresh cup</button>
        </div>
      </div>
    </div>
    <div id="cork" title="The corkboard"><div class="note" id="corkNote"></div></div>
    <div id="radiator" title="The radiator. It has a changelog."><div id="knob" class="hidden"></div></div>
  </section>
  <section id="deskArea">
    <div id="paperWrap"></div>
    <div id="rug" class="hidden"></div>
    <div id="pip" title="Pip, the desk bot">
      <div class="bubble" id="pipBubble"></div>
      <canvas id="pipCv" width="24" height="24"></canvas>
    </div>
    <div id="cat" class="hidden" title="The office cat">
      <div class="bubble" id="catBubble"></div>

// Template lookup: main forms, attachments, or a requisition
function getTpl(code) {
  const f = FORMS.find(x => x.code === code);
  if (f) return f;
  if (SUBFORMS[code]) return SUBFORMS[code];
  const u = UPGRADES.find(x => x.code === code);
  if (u) return {
    code: u.code, title: 'Requisition: ' + u.name, reward: 0, tags: [], req: u.key,
    intro: "To requisition an item, describe your need for the item, then explain why you need to describe your need. Cost: " + u.cost + " stamps, deducted on filing. " + u.desc,
    fields: [['check', 'I require this item'], ['choice', 'Urgency', ['Low', 'Lower', 'Whenever']], ['text', 'Justification', ['for morale', 'Pip asked', 'it would be nice', 'see attached feelings']], ['sign'], ['stamp']],
  };
  return null;
}
// A fresh copy of a form, ready to be filled
function newInst(code, extra) {
  const ix = [];
  while (ix.length < 3) { const n = randi(0, FINE_PRINT.length - 1); if (!ix.includes(n)) ix.push(n); }
  return Object.assign({ id: S.id++, code, vals: {}, ret: null, depth: 0, fine: ix, skip: [], office: 0 }, extra || {});
}
const rankIdx = () => { let r = 0; RANKS.forEach(([n], i) => { if (S.filed >= n) r = i; }); return r; };
function randomForm() {
  const r = rankIdx();

  return newInst(pick(pool).code);
}
function logPip(s) {

// 3. FORM LOGIC: what counts as filled, which stamp, which Bylaw
// ---------------------------------------------------------------------
const kindOf = f => f[0];
function labelOf(f) {
  switch (f[0]) {
    case 'feel': return 'How do you feel about this request? (circle one)';
    case 'date': return 'Date of request (Office Calendar)';
    case 'init': return 'Initial here, here and here';
    case 'sign': return 'Signature of applicant';
    case 'stamp': return 'Office stamp (office use only, but you are the office)';
    case 'attach': return 'Attach Form ' + f[1] + ' (' + getTpl(f[1]).title + ')';
    default: return f[1];
  }
}
const optsOf = f => f[0] === 'feel' ? FEELINGS : f[0] === 'date' ? DATES : f[2];
function requiredStamp(tpl) {
  const t = tpl.tags || [];
  if (t.includes('cat')) return ['APPROVED', '38'];
  if (t.includes('stop')) return ['NOTED', '40'];
  if (t.includes('soup')) return ['RECEIVED', '19'];
  if (t.includes('weather')) return ['NOTED', '4'];
  return ['APPROVED', '1'];
}
// The name a signature must match (onboarding uses the name you just wrote)
function expectedName(inst, tpl) {
  const ni = tpl.fields.findIndex(f => f[0] === 'name');
  return ni >= 0 ? (inst.vals[ni] || '').trim() : S.name;
}
function isFilled(inst, f, i) {
  const v = inst.vals[i];
  switch (f[0]) {
    case 'check': case 'attach': return v === true;
    case 'num': return typeof v === 'number';
    case 'init': return Array.isArray(v) && v.length === 3;
    case 'text': case 'name': return typeof v === 'string' && v.trim().length > 0;
    default: return v != null && v !== '';
  }
}
// Returns null if the form is acceptable, otherwise the reason it comes back
function checkForm(inst) {
  const tpl = getTpl(inst.code), v = inst.vals;
  for (let i = 0; i < tpl.fields.length; i++) {
    if (!isFilled(inst, tpl.fields[i], i)) return 'Field ' + (i + 1) + ' is blank. Blank fields are considered shy, and the Department cannot process shyness.';
  }
  for (let i = 0; i < tpl.fields.length; i++) {
    const f = tpl.fields[i], n = 'Field ' + (i + 1) + ': ';
    if (f[0] === 'feel' && v[i] !== 'Fine') return n + "feelings must be written down as 'Fine' under the Feelings Accord (Bylaw 12). You may still feel " + v[i].toLowerCase() + ', privately.';
    if (f[0] === 'date' && v[i] === 'Thursday') return n + 'forms may not be dated Thursday. Thursday is under review (Bylaw 7).';
    if (f[0] === 'num' && v[i] > 11 && v[i] !== 12) return n + v[i] + ' is more than eleven and is not twelve (Bylaw 23).';
    if (f[0] === 'init' && v[i].join('') !== '012') return n + 'initials were applied out of order and are now considered surnames (Bylaw 31(c)(ii)).';
    if (f[0] === 'sign' && v[i] !== expectedName(inst, tpl)) {
      return v[i] === 'pip :)' ? n + 'signed by a robot. Lovely, but decorative (Bylaw 15). Please sign it yourself.' : n + 'the signature does not match the clerk (Bylaw 15).';
    }
    if (f[0] === 'stamp') {
      const [need, law] = requiredStamp(tpl);
      if (v[i] === 'DENIED') return n + 'the DENIED stamp is decorative and must not be used (Bylaw 2).';
      if (v[i] === 'FILED (EMOTIONALLY)') return n + 'FILED (EMOTIONALLY) is reserved for the office cat (Bylaw 33).';
      if (v[i] !== need) return n + 'this request must be stamped ' + need + ' (Bylaw ' + law + ').';
    }
  }
  if (tpl.req) {                               // requisitions cost stamps
    const u = UPGRADES.find(x => x.key === tpl.req);
    if (S.stamps < u.cost) return 'Insufficient stamps. This requisition costs ' + u.cost + ' and you have ' + S.stamps + '. File more forms and try again.';
  }
  return null;
}
// What it looks like when a form is filed successfully
function fileForm(inst, isSub) {
  const err = checkForm(inst);
  if (err) {
    inst.ret = err; S.returned++; S.calm = clamp(S.calm - 6, 0, 100);
    snd('error'); pipSay(pick(PIP.returned), 'worry'); logPip('form ' + inst.code + ' came back. we will fix it.');
    renderAll(); return;
  }
  const tpl = getTpl(inst.code);
  S.catalog[inst.code] = (S.catalog[inst.code] || 0) + 1;
  if (inst.code === '00-1') S.name = expectedName(inst, tpl);
  if (tpl.req) {                               // a requisition: spend stamps, get the thing
    const u = UPGRADES.find(x => x.key === tpl.req);
    S.stamps -= u.cost; S.up[u.key] = true;
    if (u.key === 'plant') S.plantT = Date.now();
    S.subs.pop(); snd('file'); toast('Requisition approved: ' + u.name + '.');
    pipSay(u.key === 'hat' ? 'a HAT? for ME?? i love it.' : 'requisition approved! the stapler is impressed.', 'love');
    logPip('requisitioned: ' + u.name.toLowerCase() + '.');
    renderAll(); return;
  }
  if (isSub) {                                 // an attachment: clip it to the form underneath
    S.subs.pop();
    const parent = S.subs.length ? S.subs[S.subs.length - 1] : S.cur;
    if (parent) {
      const ai = getTpl(parent.code).fields.findIndex(f => f[0] === 'attach');
      parent.vals[ai] = true; parent.ret = null;
    }
    snd('paper'); toast('Form ' + inst.code + ' attached with a paperclip.');
    if (inst.code === '27-B/6') pipSay(inst.depth >= 3 ? 'you found the loophole. bylaw 27 is proud of you.' : 'it needs a copy of itself. it is forms all the way down.', 'worry');
    renderAll(); return;
  }
  // a normal form
  const reward = tpl.reward + (S.up.stapler ? 2 : 0) + (S.calm >= 70 ? 1 : 0);
  S.stamps += reward; S.filed++; S.out++;
  S.calm = clamp(S.calm + 2, 0, 100);
  S.cur = null;
  snd('file'); toast('Filed ' + inst.code + '. +' + reward + ' stamps' + (S.calm >= 70 ? ' (calm bonus)' : '') + '.');
  pipSay(pick(PIP.filed), 'happy'); logPip('filed form ' + inst.code + '. +' + reward + ' stamps.');
  if (inst.code === '27-B/6') ending();
  const r = rankIdx();
  if (r > S.rank) { S.rank = r; snd('rank'); toast('Promoted: ' + RANKS[r][1] + '!'); logPip('you got promoted. i made a little hat out of a memo. for you.'); }
  renderAll();
}

function drawMug() {

  const P = (c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const O = '#2b2a26', lvl = S.coffee.lvl, hot = S.coffee.temp;
  if (hot > 35 && lvl > 0) {                   // steam
    const t = performance.now() / 260;
    g.globalAlpha = Math.min(1, (hot - 35) / 50);
    for (let k = 0; k < 2; k++) for (let y = 0; y < 6; y += 2) P('#e8eef0', 8 + k * 4 + Math.round(Math.sin(t + y * 0.7 + k * 2.5)), 1 + y + ((Math.floor(t) + k) % 2), 1, 1);
    g.globalAlpha = 1;
  }
  P(O, 4, 8, 13, 15); P('#eae6dc', 5, 9, 11, 13); P('#d2cdc0', 13, 9, 3, 13);   // mug
  P(O, 16, 11, 4, 8); P('#eae6dc', 17, 12, 2, 6); P(O, 17, 13, 1, 4);          // handle
  P(O, 4, 7, 13, 2);                                                              // rim
  P(lvl > 50 ? '#6a4128' : lvl > 0 ? '#3e2617' : '#8a8478', 5, 8, 11, 1);       // coffee surface
  P('#FF4BCB', 8, 14, 3, 1); P('#FF4BCB', 10, 15, 1, 2); P('#FF4BCB', 8, 17, 3, 1); P('#FF4BCB', 8, 15, 1, 1);   // tiny spiral logo
  if (S.brewEnd > Date.now()) { P('#FFD93D', 1, 21, 2, 2); }                    // brewing light
}
function coffeeText() {
  const c = S.coffee, now = Date.now();
  if (S.brewEnd > now) return 'Brewing... ' + Math.ceil((S.brewEnd - now) / 1000) + 's. The machine gurgles politely.';
  if (c.lvl <= 0) return 'The cup is empty. A cup should not be empty.';
  const t = c.temp > 70 ? 'Hot' : c.temp > 45 ? 'Warm' : c.temp > 20 ? 'Lukewarm' : 'Cold';
  const l = c.lvl > 70 ? 'full' : c.lvl > 35 ? 'half full' : 'nearly gone';
  return t + ' coffee, ' + l + '.' + (S.focus > 0 ? ' (focused)' : '');
}
function sip() {
  audioInit();
  if (S.brewEnd > Date.now()) { toast('Still brewing. Patience is also a hot drink.'); return; }
  if (S.coffee.lvl <= 0) { toast('The cup is empty. Brew a fresh one.'); return; }
  S.coffee.lvl = Math.max(0, S.coffee.lvl - (S.up.mug ? 7 : 11)); snd('sip');
  if (S.coffee.temp > 45) { S.focus = 45; S.calm = clamp(S.calm + 3, 0, 100); toast(pick(WARM_SIPS)); }
  else { S.calm = clamp(S.calm - 1, 0, 100); toast(pick(COLD_SIPS)); }
  renderTop();
}
function brew() {
  audioInit();
  if (S.brewEnd > Date.now()) { toast('It is already brewing.'); return; }
  S.brewEnd = Date.now() + 40000; snd('pour'); toast('You start a fresh pot. It will take a moment. Watch the rain.');
}
$('sipBtn').onclick = sip; $('mugCv').onclick = sip; $('brewBtn').onclick = brew;
let rainCool = 0;
$('window').addEventListener('click', () => {
  audioInit();
  if (rainCool > 0) { toast('You are already watching the rain. Keep watching.'); return; }
  rainCool = 15; S.calm = clamp(S.calm + 5, 0, 100);
  toast(pick(RAIN_LINES)); renderTop();
});
$('radiator').addEventListener('click', () => { audioInit(); snd('clank'); toast('Radiator changelog: ' + pick(RADIATOR)); });

// rain in the window: distant city, the spiral tower, falling rain, drops on the glass
const rainCv = $('rain'), rainCtx = rainCv.getContext('2d');
const RW = 160, RH = 120;
const skyline = document.createElement('canvas'); skyline.width = RW; skyline.height = RH;
(() => {
  const g = skyline.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, RH); grd.addColorStop(0, '#5d6c75'); grd.addColorStop(1, '#7c8a90');
  g.fillStyle = grd; g.fillRect(0, 0, RW, RH);
  g.fillStyle = '#6a7880';                     // far buildings
  for (let x = 0; x < RW; x += 9) { const h = 20 + ((x * 37) % 23); g.fillRect(x, RH - 30 - h, 8, h + 30); }
  g.fillStyle = '#5a6870';                     // the spiral tower, faint
  g.fillRect(104, 20, 10, 80); for (let y = 24; y < 100; y += 6) g.fillRect(102 + ((y / 6) % 2) * 2, y, 14, 2);
  g.fillStyle = '#516068';                     // near buildings
  for (let x = 0; x < RW; x += 14) { const h = 14 + ((x * 53) % 19); g.fillRect(x, RH - h, 13, h); }
  g.fillStyle = '#ffd98a';                     // a few lit windows
  for (let i = 0; i < 26; i++) { const x = (i * 47) % RW, y = RH - 4 - ((i * 13) % 26); g.globalAlpha = 0.5; g.fillRect(x, y, 1, 1); }
  g.globalAlpha = 1;
})();
const streaks = Array.from({ length: 70 }, () => ({ x: rand(0, RW), y: rand(0, RH), v: rand(90, 140) }));
const glass = Array.from({ length: 22 }, () => ({ x: rand(0, RW), y: rand(0, RH), v: rand(1, 6), r: rand(1, 2.2) }));
function drawRain(dt) {
  const g = rainCtx;
  g.drawImage(skyline, 0, 0);
  g.fillStyle = 'rgba(210,225,235,0.55)';
  for (const s of streaks) {
    s.y += s.v * dt; s.x -= s.v * dt * 0.18;
    if (s.y > RH) { s.y = -6; s.x = rand(0, RW + 20); }
    g.fillRect(Math.round(s.x), Math.round(s.y), 1, 4);
  }
  for (const d of glass) {                     // drops sliding down the glass
    d.y += d.v * dt * (Math.random() < 0.02 ? 12 : 1);
    if (d.y > RH + 3) { d.y = -3; d.x = rand(0, RW); }
    g.fillStyle = 'rgba(230,240,245,0.75)'; g.fillRect(Math.round(d.x), Math.round(d.y), Math.ceil(d.r), Math.ceil(d.r) + 1);
    g.fillStyle = 'rgba(230,240,245,0.18)'; g.fillRect(Math.round(d.x), Math.round(d.y) - 6, 1, 6);
  }
}
const plantCtx = $('plantCv').getContext('2d');
function drawPlant() {
  if (!S.up.plant) return;
  const stage = Math.min(6, 1 + Math.floor((Date.now() - S.plantT) / (12 * 60 * 1000)));   // grows every 12 real minutes
  const g = plantCtx; g.clearRect(0, 0, 12, 16);
  const P = (c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  P('#23282c', 2, 11, 8, 5); P('#b5603a', 3, 12, 6, 3); P('#d27a4f', 3, 12, 6, 1);
  for (let s = 0; s < stage; s++) {
    const y = 10 - s * 1.6 | 0;
    P('#3c8a4a', 6, y, 1, 2);
    if (s % 2) { P('#5fb86a', 7, y, 2, 1); } else { P('#5fb86a', 4, y, 2, 1); }
  }
  if (stage >= 6) P('#FF4BCB', 6, 0, 1, 1);    // it flowered
}

// ---------------------------------------------------------------------
// 8. DRAWERS: bylaws, memos, catalog, requisitions, Pip's log
// ---------------------------------------------------------------------
const TABS = [['bylaws', 'Bylaws'], ['memos', 'Memos'], ['catalog', 'Form Catalog'], ['req', 'Requisitions'], ['log', "Pip's Log"]];
let drawerTab = 'bylaws';
function openDrawer(tab) { drawerTab = tab; $('drawer').classList.remove('hidden'); snd('drawer'); renderDrawer(); }
function renderDrawer() {
  $('drawerTitle').textContent = TABS.find(t => t[0] === drawerTab)[1];
  $('drawerTabs').innerHTML = TABS.map(([k, n]) => '<button class="' + (k === drawerTab ? 'on' : '') + '" data-tab="' + k + '">' + n + '</button>').join('');
  let h = '';
  if (drawerTab === 'bylaws') {
    h = '<p><i>The Bylaws of the Department of Minor Affairs. The ones marked &#10022; are enforced at the outbox. The others are enforced in spirit.</i></p>' +
      BYLAWS.map(([n, live, t]) => '<div class="law' + (live ? ' live' : '') + '"><b>' + (live ? '&#10022; ' : '') + esc(n) + '.</b> ' + esc(t) + '</div>').join('');
  } else if (drawerTab === 'memos') {
    h = S.memos.length ? S.memos.map(m => '<div class="memo' + (m.isNew ? ' new' : '') + '"><div class="mh">FROM: ' + esc(m.from) + ' &middot; RE: ' + esc(m.sub) + '</div>' + esc(m.body) + '</div>').join('') : '<p>No memos yet. Enjoy the quiet. It will not last.</p>';
    let got = false;
    S.memos.forEach(m => { if (m.isNew) { m.isNew = false; got = true; } });
    if (got) { S.calm = clamp(S.calm + 1, 0, 100); setTimeout(renderTop, 50); }
  } else if (drawerTab === 'catalog') {
    const seenAny = c => S.catalog[c] || (S.cur && S.cur.code === c) || S.inbox.some(f => f.code === c);
    h = '<p><i>Every form the Department has ever sent you, and how many times you have filed it. Forms you have not met yet are shy.</i></p>' +
      FORMS.concat(Object.values(SUBFORMS)).map(f => seenAny(f.code)
        ? '<div class="cat-row"><b>' + esc(f.code) + '</b><div><b>' + esc(f.title) + '</b><div class="d" style="font-size:12px;color:#6b6355">' + esc(f.intro) + '</div></div><span>&times;' + (S.catalog[f.code] || 0) + '</span></div>'
        : '<div class="cat-row"><b>??</b><div style="color:#9a8f74">A form you have not met yet.</div><span></span></div>').join('');
  } else if (drawerTab === 'req') {
    h = '<p><i>Spend stamps on improvements to Desk 27. Every purchase is made by filling out a requisition form, naturally. You have ' + S.stamps + ' stamps.</i></p>' +
      UPGRADES.map(u => '<div class="req-row"><b>' + u.cost + ' &#10022;</b><div><b>' + esc(u.name) + '</b><div class="d">' + esc(u.desc) + '</div></div>' +
        (S.up[u.key] ? '<span class="owned">issued</span>' : '<button class="btn" data-req="' + u.code + '">requisition</button>') + '</div>').join('');
  } else if (drawerTab === 'log') {
    h = S.log.length ? S.log.map(l => '<div class="logline">' + esc(l.t) + ' &mdash; ' + esc(l.s) + '</div>').join('') : '<div class="logline">no entries. pip is warming up.</div>';
  }
  $('drawerBody').innerHTML = h;
}
$('drawers').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { audioInit(); openDrawer(b.dataset.tab); } });
$('drawerTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { drawerTab = b.dataset.tab; snd('check'); renderDrawer(); } });
$('drawerClose').onclick = () => { $('drawer').classList.add('hidden'); snd('drawer'); };
$('drawerBody').addEventListener('click', e => {
  const b = e.target.closest('[data-req]');
  if (!b) return;
  if (S.subs.length) { toast('Finish the paperwork already open first.'); return; }
  S.subs.push(newInst(b.dataset.req, { fresh: true })); $('drawer').classList.add('hidden'); snd('drawer'); renderAll();
});

// ---------------------------------------------------------------------
// 9. SOUND (rain bed, pen scratches, stamps, Pip, purring)
// ---------------------------------------------------------------------
let AC = null, master = null, noiseBuf = null, brownBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  master = AC.createGain(); master.gain.value = S.sound ? 0.7 : 0; master.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate); brownBuf = AC.createBuffer(1, len, AC.sampleRate);
  const w = noiseBuf.getChannelData(0), br = brownBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { w[i] = Math.random() * 2 - 1; last = (last + 0.02 * w[i]) / 1.02; br[i] = last * 3.5; }
  // the rain: soft brown noise + a little high patter, forever
  const bed = AC.createBufferSource(); bed.buffer = brownBuf; bed.loop = true;
  const bl = AC.createBiquadFilter(); bl.type = 'lowpass'; bl.frequency.value = 900;
  const bg = AC.createGain(); bg.gain.value = 0.32;
  bed.connect(bl); bl.connect(bg); bg.connect(master); bed.start();
  const pat = AC.createBufferSource(); pat.buffer = noiseBuf; pat.loop = true;
  const ph = AC.createBiquadFilter(); ph.type = 'highpass'; ph.frequency.value = 5000;
  const pg = AC.createGain(); pg.gain.value = 0.025;
  pat.connect(ph); ph.connect(pg); pg.connect(master); pat.start();
}
function tone(type, f, t, dur, vol, slide) {
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function nz(t, dur, vol, type, freq, q, sweepTo) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); if (q) f.Q.value = q;
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
function snd(n) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime;
  switch (n) {
    case 'stamp': tone('sine', 120, t, 0.18, 0.5, 45); nz(t, 0.09, 0.35, 'lowpass', 600); break;
    case 'pen': for (let k = 0; k < 4; k++) nz(t + k * 0.055, 0.045, 0.07, 'bandpass', 2800 + Math.random() * 1800, 5); break;
    case 'check': nz(t, 0.05, 0.1, 'bandpass', 2400, 3); break;
    case 'paper': nz(t, 0.28, 0.14, 'highpass', 1600); break;
    case 'file': tone('triangle', 659, t, 0.16, 0.16); tone('triangle', 988, t + 0.12, 0.3, 0.14); nz(t, 0.22, 0.08, 'highpass', 2000); break;
    case 'error': tone('square', 196, t, 0.14, 0.06); tone('square', 165, t + 0.16, 0.22, 0.06); break;
    case 'beep': tone('square', 1046, t, 0.05, 0.035); tone('square', 1568, t + 0.06, 0.06, 0.035); break;
    case 'boop': tone('square', 784, t, 0.07, 0.035); tone('square', 587, t + 0.08, 0.08, 0.035); break;
    case 'sip': nz(t, 0.2, 0.12, 'lowpass', 700); break;
    case 'pour': nz(t, 1.8, 0.1, 'bandpass', 500, 2, 1500); break;
    case 'clank': tone('square', 98, t, 0.08, 0.1); tone('square', 131, t + 0.1, 0.07, 0.08); nz(t, 0.12, 0.12, 'bandpass', 900, 2); break;
    case 'rank': [523, 659, 784, 1047].forEach((f, k) => tone('triangle', f, t + k * 0.09, 0.22, 0.14)); break;
    case 'drawer': nz(t, 0.3, 0.12, 'lowpass', 450); tone('sine', 85, t, 0.18, 0.12); break;
    case 'meow': tone('sine', 620, t, 0.18, 0.1, 820); tone('sine', 820, t + 0.18, 0.25, 0.08, 520); break;
    case 'tick': nz(t, 0.02, 0.05, 'highpass', 3000); break;
    case 'purr': {                             // rumbling noise, wobbling ~24 times a second
      const s = AC.createBufferSource(); s.buffer = brownBuf;
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 180;
      const g = AC.createGain(); g.gain.value = 0;
      const lfo = AC.createOscillator(); lfo.frequency.value = 24; const lg = AC.createGain(); lg.gain.value = 0.5;
      lfo.connect(lg); lg.connect(g.gain);
      const env = AC.createGain(); env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(1, t + 0.15); env.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      s.connect(f); f.connect(g); g.connect(env); env.connect(master);
      s.start(t); lfo.start(t); s.stop(t + 1.5); lfo.stop(t + 1.5);
      break;
    }
  }
}
function setSound(on) {
  S.sound = on;
  if (master) master.gain.setTargetAtTime(on ? 0.7 : 0, AC.currentTime, 0.05);
  renderTop();
}
$('sndBtn').onclick = () => { audioInit(); setSound(!S.sound); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'm' || e.key === 'M') { audioInit(); setSound(!S.sound); }
  if (e.key === 'Escape') { if (!$('drawer').classList.contains('hidden')) $('drawer').classList.add('hidden'); }
});
addEventListener('pointerdown', () => audioInit(), { once: true });

// ---------------------------------------------------------------------
// 10. TIME PASSING (live, and while you were away) + MAIN LOOP
// ---------------------------------------------------------------------
function toast(s) {
  const t = $('toasts');
  while (t.children.length > 3) t.firstChild.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = s;
  t.appendChild(d); setTimeout(() => d.remove(), 3600);
}
const inboxCap = () => S.up.tray ? 14 : 8;
function deliverForm() {
  if (S.filed >= 45 && !S.endSent) { S.endSent = true; S.inbox.unshift(newInst('27-B/6')); toast('A special form has arrived: 27-B/6.'); return; }
  if (S.inbox.length >= inboxCap()) return;
  S.inbox.push(randomForm()); snd('paper');
}
function deliverMemo() {
  const m = MEMOS[S.memoNext];
  if (!m || S.filed < m[0]) return;
  S.memos.unshift({ from: m[1], sub: m[2], body: m[3], t: Date.now(), isNew: true });
  S.memoNext++; toast('A memo has arrived from ' + m[1] + '.'); snd('paper');
}
let tick = 0;
function update(dt) {
  const now = Date.now();
  // forms and memos arrive
  S.nextForm -= dt;
  if (S.nextForm <= 0) { S.nextForm = (S.up.tray ? 34 : 52) * rand(0.7, 1.3); deliverForm(); renderTrays(); }
  S.nextMemo -= dt;
  if (S.nextMemo <= 0) { S.nextMemo = rand(80, 150); deliverMemo(); renderTop(); }
  // coffee cools, brewing finishes
  S.coffee.temp = Math.max(0, S.coffee.temp - dt * (S.up.mug ? 0.17 : 0.26));
  if (S.brewEnd && S.brewEnd <= now) { S.brewEnd = 0; S.coffee.lvl = 100; S.coffee.temp = 100; toast('Fresh coffee. The whole desk smells better.'); snd('pour'); }
  if (S.focus > 0) S.focus -= dt;
  // ink refills, calm drifts
  S.ink = Math.min(inkMax(), S.ink + dt * (S.up.pen ? 0.5 : 0.25) * (S.focus > 0 ? 2 : 1));
  const calmTarget = S.up.knob ? 75 : 55;
  S.calm += (calmTarget - S.calm) * dt * 0.004;
  if (S.coffee.temp > 45 && S.coffee.lvl > 0) S.calm = Math.min(100, S.calm + dt * 0.02);
  if (rainCool > 0) rainCool -= dt;
  updatePip(dt); updateCat(dt);
  if (Math.random() < dt * 0.02) snd('tick');  // the radiator, ticking
  // refresh the small things a few times a second
  tick += dt;
  if (tick > 0.5) { tick = 0; renderTop(); $('coffeeTxt').textContent = coffeeText(); }
}
// Catch up on everything that happened while the page was closed
function catchUp() {
  const away = (Date.now() - S.lastSeen) / 1000;
  if (away < 60) return;
  const was = { forms: S.inbox.length, filed: S.filed, stamps: S.stamps };
  const per = S.up.tray ? 34 : 52;
  const n = Math.min(inboxCap() - S.inbox.length, Math.floor(away / per));
  for (let i = 0; i < n; i++) S.inbox.push(randomForm());
  S.coffee.temp = Math.max(0, S.coffee.temp - away * 0.26);
  S.ink = inkMax();
  let pipFiled = 0, pipBack = 0;
  if (S.up.night) {                             // Pip's night shift
    const jobs = Math.min(S.inbox.length, Math.floor(away / 120));
    const acc = S.up.glasses ? 0.8 : 0.55;
    for (let j = 0; j < jobs; j++) {
      const f = S.inbox.shift();
      if (Math.random() < acc) {
        const tpl = getTpl(f.code);
        S.stamps += Math.ceil(tpl.reward / 2); S.filed++; S.out++; S.catalog[f.code] = (S.catalog[f.code] || 0) + 1; pipFiled++;
      } else { f.ret = 'Pip filed this one during the night shift. Something is wrong with it. Pip is very sorry and has drawn a small heart on it.'; S.inbox.push(f); pipBack++; }
    }
    logPip('night shift: filed ' + pipFiled + ', returned ' + pipBack + '. i did my best. the rain kept me company.');
  }
  S.pipBat = Math.max(20, S.pipBat - away / 60);
  const hrs = away / 3600;
  const body = 'While you were away (' + (hrs >= 1 ? hrs.toFixed(1) + ' hours' : Math.round(away / 60) + ' minutes') + '): ' + (S.inbox.length - was.forms + pipFiled + pipBack > 0 ? (S.inbox.length - was.forms + pipFiled) + ' forms arrived. ' : 'nothing arrived. ') +
    (S.up.night ? 'Pip filed ' + pipFiled + ' of them' + (pipBack ? ' and returned ' + pipBack + ' with apologies' : '') + ', earning ' + (S.stamps - was.stamps) + ' stamps. ' : '') + 'Your coffee went cold. The rain did not stop.';
  S.memos.unshift({ from: 'Desk 27', sub: 'While you were away', body, t: Date.now(), isNew: true });
  setTimeout(() => toast('Welcome back. There is a memo about while you were away.'), 900);
}
function start() {
  if (firstRun) {                              // day one: onboarding on the desk, two forms waiting
    S.cur = newInst('00-1', { fresh: true });
    S.inbox.push(newInst('3-P'), newInst('4-S'));
    setTimeout(() => pipSay('hello! i am pip. i am your desk bot. fill out this first one, i will help!', 'happy'), 1200);
    logPip('first day. new clerk. i am going to be so helpful.');
  } else {
    catchUp();
    setTimeout(() => pipSay(S.name ? 'welcome back, ' + S.name.split(' ')[0].toLowerCase() + '. it is still raining.' : 'welcome back!', 'happy'), 1200);
  }
  pipMove(72);
  corkI = randi(0, 10); corkNext(); setInterval(corkNext, 45000);
  renderAll();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    update(dt);
    drawRain(dt); drawPip(); drawCat(); drawMug(); drawPlant();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(() => { if (!document.hidden) save(); }, 5000);   // background tabs keep their 'last seen' time
  addEventListener('visibilitychange', () => { if (document.hidden) save(); else { catchUp(); renderAll(); } });
  addEventListener('beforeunload', save);
}
start();
